5 (Alma shrugging at a question)", "Ether 12:6"], "journal": "Take the question from Day 1. Is it a question you can live with unanswered? What would it take to set it down without pretending it's gone?"}, {"q": "How do you hold questions without dropping faith?", "intro": "The Lord's instruction is study *and* faith. Both. Not one instead of the other. James says ask, and the promise is real, but the timing isn't yours. Alma says nourish what you know and let the rest grow. When you read, look for what you're supposed to do with the part you *do* know while the rest stays dim.", "read": ["D&C 88:118", "James 1:5-6", "Alma 32:34-37", "Preach My Gospel, chapter 5, \"Study and Faith\" (or the section on learning by study and faith)"], "journal": "Write down three things you know clearly. Not through a glass. Clearly. Then write your Day 1 question under them and look at the ratio."}, {"q": "What do I believe now?", "intro": "Back to Paul's mirror. Read it one more time. Then read your Day 1 question and your Day 6 list.", "read": ["1 Corinthians 13:12", {"journal": [33, 1]}, {"journal": [33, 6]}], "journal": "Answer the week's question: How much are you supposed to know? And what do you do with the rest?"}]}, {"n": 34, "tag": "L3", "question": "Why baptize for the dead?", "intro": "Paul mentions it once, in passing, like everybody knew what he was talking about. \"Else what shall they do which are baptized for the dead?\" The rest of Christianity has spent 2,000 years trying to explain that verse away. We built temples for it. If baptism is required and most people who ever lived never heard of it, then either God's plan has a giant hole in it or there's a way to fix it. This week is the fix.", "days": [{"q": "What did Paul say, and what was around it?", "intro": "Read the verse in context. Paul is arguing for resurrection and uses baptism for the dead as evidence: why would people do it if the dead don't rise? He assumes his readers know the practice. Then read Jesus on why baptism is required in the first place. When you read, put the two together.", "read": ["1 Corinthians 15:12-22, 29", "John 3:3-5"], "journal": "Read your Week 2 Day 5 answer next: the hardest part of \"baptism is required.\" Is it still the hardest part?"}, {"q": "Did the early Church believe the dead could hear the gospel?", "intro": "Peter says Jesus preached to the spirits in prison between His death and resurrection. He says it twice. That's the missing piece: the dead aren't out of reach. Then read Malachi, the last prophet before the silence, promising Elijah would come to turn hearts to the fathers. When you read, notice how much of this was already in the Bible before Joseph Smith.", "read": ["1 Peter 3:18-20", "1 Peter 4:6", "Malachi 4:5-6", {"journal": [2, 5]}], "journal": "Peter says Christ preached to the dead. If that's true, what does it mean for someone you know who died without the gospel?"}, {"q": "What did the Restoration reveal about it?", "intro": "Joseph Smith wrote D&C 128 as a letter, excited, explaining the doctrine. Read him. Then read Joseph F. Smith's vision of the spirit world, where he sees what the dead are doing and who's teaching them. When you read, look for who does the work on each side of the veil.", "read": ["D&C 128:15-18", "D&C 138:29-35", "D&C 138:57-59", "D&C 124:29-33"], "journal": "D&C 128:15 says they can't be made perfect without us, and we can't without them. What does that do to the idea that salvation is an individual thing?"}, {"q": "What does the prophet say about the temple?", "intro": "President Russell M. Nelson, October 2021. He's built more temples than anyone in history and this is him explaining why it matters to *you*, not just the dead.", "read": [{"talk": "The Temple and Your Spiritual Foundation", "speaker": "Russell M. Nelson", "date": "October 2021", "section": "Read the whole thing."}], "takeaway": "His point is that the temple isn't primarily about the dead. It's the foundation for your own life. He says everything taught there points to Jesus Christ and the covenants there are what hold you up when the world shakes. And he says the work for the dead is how you become a savior on Mount Zion, which is a phrase that should mean something to you.", "journal": "Nelson says the temple is your foundation. When was the last time you went? What did it do for you, honestly?"}, {"q": "Does a proxy ordinance override the dead person's choice?", "intro": "Here's the hard part. If you get baptized for your great-grandfather, did you just decide his religion for him? No. Read D&C 138 again, where the dead are taught and choose. The ordinance is an offer, not a verdict. But then the other question: why would God need an earthly ordinance for someone who's already dead? Read the Lord on what's bound on earth and in heaven, and Moses on why water is required for everyone.", "read": ["D&C 138:31-34 again", "D&C 128:8-9", "Moses 6:59-60", "Matthew 16:19"], "journal": "The dead still have to choose. Does that resolve it for you? What's the remaining question, if any?"}, {"q": "How do you actually do it?", "intro": "Malachi's promise about hearts turning to fathers is the doctrine. FamilySearch is the practice. This week, find one name. One ancestor who needs work, or one name from the temple's list. When you read, notice that D&C 2 is the very first revelation in the D&C after section 1. That's how central this is.", "read": ["D&C 2", "3 Nephi 25:5-6", "Preach My Gospel, lesson 5, \"Temples and Family History\""], "journal": "Find one name this week. Write it down here. Then write when you'll take it to the temple, or who you'll give it to."}, {"q": "What do I believe now?", "intro": "Back to Paul's one verse. Read it one more time. Then read your Week 2 Day 5 answer and your Day 1 answer from this week.", "read": ["1 Corinthians 15:29", {"journal": [2, 5]}, {"journal": [34, 1]}], "journal": "Answer the week's question: Why baptize for the dead? And has the hardest part of \"baptism is required\" changed?"}]}, {"n": 35, "tag": "", "question": "What was Paul's thorn, and why didn't God take it away?", "intro": "Paul had something wrong with him. He called it a thorn in the flesh. He asked God three times to remove it. God said no. Not \"not yet.\" No. And Paul's response is one of the strangest sentences in scripture: \"most gladly therefore will I glory in my infirmities.\" This week is about the thing you've asked God to fix that He hasn't, and what Paul figured out that you might not have yet.", "days": [{"q": "What did Paul say about it?", "intro": "Read the whole passage. Paul was just describing being caught up to heaven and then immediately describes the thorn, like the two are connected. He asks three times. Read what God says back, word for word. It's one sentence.", "read": ["2 Corinthians 12:1-10"], "journal": "What's your thorn? The thing you've asked God to take away more than once. Write it down."}, {"q": "What was the thorn?", "intro": "Nobody knows. Paul never says. Some think it was his eyes, because he mentions the Galatians would have given him their own eyes and he wrote with big letters. Some think it was a person who kept attacking him. Some think it was a temptation. He calls it a messenger of Satan, which is strong. The point may be that he doesn't say, so anyone with any thorn can read it as theirs. Read the clues and then let it go.", "read": ["Galatians 4:13-15", "Galatians 6:11", "2 Corinthians 12:7 again", "Job 2:7-10"], "journal": "Paul never tells us what it was. Do you think that's on purpose? What would you lose if you knew?"}, {"q": "What does the Book of Mormon say about weakness?", "intro": "Ether 12:27 is the verse. God *gives* weakness. On purpose. So you'll be humble. So His grace can work. Then Nephi, who has a thorn of his own and names it, and Alma's people, who weren't freed but were strengthened. When you read, look for what God does with the thing He doesn't remove.", "read": ["Ether 12:27", "2 Nephi 4:17-19", "Mosiah 24:14-15", "Alma 7:11-12"], "journal": "Ether 12:27 says weakness comes from God so you'll be humble. Has your thorn made you humble, or just tired? Be honest."}, {"q": "What does an apostle say about thorns that don't go away?", "intro": "Elder Jeffrey R. Holland, October 2013. He talked about mental illness and depression from the pulpit, which almost nobody had done, and he did it as someone who'd been through it.", "read": [{"talk": "Like a Broken Vessel", "speaker": "Jeffrey R. Holland", "date": "October 2013", "section": "Read the whole thing."}], "takeaway": "His point is that some afflictions don't get fixed by faith alone, and pretending they should is cruel. He says get help. Take the medicine. Keep going. And he says the thing that matters: broken vessels are the kind the Lord uses. He's not waiting for you to be whole to work with you. He's working with the pieces.", "journal": "Holland says broken vessels are the ones God uses. Do you believe your thorn disqualifies you or qualifies you? What's the evidence?"}, {"q": "Did God put the thorn there?", "intro": "Here's the hard part. Paul says the thorn was \"given\" to him. By whom? He also calls it a messenger of Satan. So did God do it, or allow it, or is that a distinction without a difference? Job's story has the same problem: Satan does it, God allows it. Read these and decide what you actually believe about where your thorn came from.", "read": ["Job 1:8-12", "Job 2:3-6", "D&C 122:7", "Alma 14:11"], "journal": "Does it matter to you whether God sent your thorn or just allowed it? Which one is easier to accept? Which one do you think is true?"}, {"q": "How do you glory in an infirmity?", "intro": "Paul's answer sounds like denial until you read the mechanism: when I'm weak, then I'm strong, because the power is His, not mine. Read the rest of 2 Corinthians where he explains what the weakness is for. Then read Moroni on what grace does with a weak person. When you read, look for what Paul stopped trying to do.", "read": ["2 Corinthians 4:7-10, 16-18", "2 Corinthians 12:9-10 again", "Moroni 10:32", "Preach My Gospel, chapter 6, \"Humility\""], "journal": "Paul stopped asking God to remove it and started asking what it was for. Take your thorn from Day 1. Ask God tonight what it's for, not whether He'll remove it. Write what comes."}, {"q": "What do I believe now?", "intro": "Back to Paul's three prayers and God's one answer. Read it one more time. Then read your Day 1 thorn and your Day 6 answer.", "read": ["2 Corinthians 12:7-10", {"journal": [35, 1]}, {"journal": [35, 6]}], "journal": "Answer the week's question: Why didn't God take Paul's thorn away? And what about yours?"}]}, {"n": 36, "tag": "L3", "question": "Fruit of the Spirit. How do you know it's the Spirit and not just you?", "intro": "You get a feeling in church. Peace, maybe. Or a nudge to call someone. Was that the Holy Ghost, or was that you being tired and sentimental? People say \"I felt the Spirit\" about everything from a testimony to a sunset. Paul gives a list of what the Spirit produces. It's more specific than a warm feeling. This week is about learning to tell the difference, because if you can't, you'll either trust everything or nothing.", "days": [{"q": "What does the Spirit produce?", "intro": "Read Galatians 5. Paul contrasts two lists: what the flesh produces and what the Spirit produces. When you read, notice the second list isn't feelings. It's character. Love, joy, peace, patience. Things you'd see in a person over time, not in a moment.", "read": ["Galatians 5:16-25", "Matthew 7:16-20"], "journal": "When was the last time you were sure you felt the Spirit? What was it like, specifically? Write it down."}, {"q": "Why \"fruit\" and not \"fruits\"?", "intro": "In the Greek it's singular. One fruit, nine flavors. Paul's saying the Spirit produces one thing in you, a kind of person, and love, joy, peace, and the rest are what that person looks like. Contrast \"works of the flesh,\" plural, which is a pile of separate acts. Read the lists again with that in mind. Then read Jesus on how you tell a good tree.", "read": ["Galatians 5:19-23 again", "Luke 6:43-45", "James 3:17-18"], "journal": "If the Spirit produces a kind of person, not a feeling, does that change how you'd answer \"do I have the Spirit\"?"}, {"q": "What does the Restoration say about recognizing Him?", "intro": "The Lord had to teach Oliver Cowdery this exact thing. Twice. Read the two revelations, then the one to Hyrum, which has the simplest test in scripture: does it lead you to do good? Then Moroni, who says everything good comes from God and you can judge it as plainly as day from night.", "read": ["D&C 8:2-3", "D&C 11:12-14", "Moroni 7:12-17", "Alma 32:28"], "journal": "D&C 11:12 says trust the Spirit that leads to do good. Think of the feeling from Day 1. Did it lead you to do good? What?"}, {"q": "What does an apostle say about keeping the Spirit close?", "intro": "President Henry B. Eyring, October 2015. He describes what having the Holy Ghost as a companion actually feels like day to day.", "read": [{"talk": "The Holy Ghost as Your Companion", "speaker": "Henry B. Eyring", "date": "October 2015", "section": "Read the whole thing."}], "takeaway": "His point is that the Spirit's presence is quieter than people expect and it's mostly noticed in what you *want*. When He's with you, you want to be kinder, you want to pray, you want to forgive. Eyring says you can tell He's been with you more by looking back at your day than by checking for a feeling in the moment. And you get more of Him by acting on the small promptings you already got.", "journal": "Eyring says look back at your day to see where He was. Do it now. Where was He today?"}, {"q": "But sincere people feel confirmed about opposite things. So what's the feeling worth?", "intro": "Here's the hard part. Two people pray about the same decision and feel peace about different answers. Somebody in another religion feels the same burning you do. So is the feeling evidence of anything? Read John's instruction to *test* the spirits. Read the Lord on how gifts get distributed. Read Korihor, who said you can't know anything you can't see, and what Alma said back. Then decide what a feeling proves and what it doesn't.", "read": ["1 John 4:1", "D&C 46:7-9", "Alma 30:15-16, 41-44", "D&C 50:31-35"], "journal": "If someone from another faith told you they felt the Spirit, what would you say? What does that mean about your own feelings?"}, {"q": "How do you get better at telling?", "intro": "The Nephites at Bountiful heard a voice from heaven three times before they understood it. The first two times they didn't. Practice matters. The Lord says sanctify yourself and your mind gets single to Him, and then you see. When you read, look for what makes the difference between hearing and understanding.", "read": ["3 Nephi 11:3-6", "D&C 88:67-68", "Alma 5:14", "Preach My Gospel, chapter 4, \"Recognize the Spirit\" and the list of how the Spirit communicates"], "journal": "Pick one flavor of the fruit from Galatians 5:22-23. Watch for it this week, in yourself and others. Write down one time you saw it and whether you think it was the Spirit."}, {"q": "What do I believe now?", "intro": "Back to Galatians 5. Read the list one more time. Then read your Day 1 answer and Day 4 answer.", "read": ["Galatians 5:22-25", {"journal": [36, 1]}, {"journal": [36, 4]}], "journal": "Answer the week's question: How do you know it's the Spirit and not just you? Give yourself a real test, not a slogan."}]}, {"n": 37, "tag": "L1", "question": "Why does the Church need apostles and prophets?", "intro": "Paul says the Church is built on the foundation of apostles and prophets. Not on a book. Not on individual inspiration. On people, called and sent. Most of Christianity says that ended with the Bible. We say it didn't, and it's one of the main reasons we exist. But have you actually thought about *why* God does it that way? What does a prophet give you that scripture and the Spirit don't? This week is that question.", "days": [{"q": "What did Paul say the Church is built on?", "intro": "Read Ephesians 2, where Paul describes the foundation. Then Ephesians 4, where he lists what apostles and prophets are *for* and how long they're needed. When you read chapter 4, find the answer to \"until when.\" It's specific.", "read": ["Ephesians 2:19-22", "Ephesians 4:11-14"], "journal": "Ephesians 4 says apostles are needed until we all come to unity of the faith. Are we there yet? What would you say to someone who says they ended with the Bible?"}, {"q": "What is an apostle, actually?", "intro": "Greek: *apostolos*, one who is sent. Not a title. A job. Jesus picked twelve on purpose, matching the twelve tribes, and when Judas died they filled the seat. The office was meant to continue. Read the calling of the twelve, then the replacement of Judas, then Amos, who said God does nothing without telling a prophet first.", "read": ["Matthew 10:1-4", "Acts 1:21-26", "Amos 3:7", "Luke 6:12-13 (He prayed all night before choosing them)"], "journal": "They filled Judas's seat. If the apostleship was supposed to end, why replace him? What does that tell you?"}, {"q": "What does the Restoration say the office is for?", "intro": "The Lord defines the job in D&C 107: special witnesses of Christ, in all the world. Then read Him telling the Saints that His voice and His servants' voice are the same. Then read the Nephite version, where Jesus picks twelve on this continent too.", "read": ["D&C 107:23-27, 33", "D&C 1:38", "3 Nephi 12:1-2", "D&C 84:35-38"], "journal": "D&C 1:38 says the Lord's word by His servants is the same as by Him. Do you actually treat conference like that? What's the gap?"}, {"q": "What does an apostle say about being one?", "intro": "Elder David A. Bednar, October 2015. He describes what happened when he was called, what he was told his job was, and what he saw the other apostles do.", "read": [{"talk": "Chosen to Bear Testimony of My Name", "speaker": "David A. Bednar", "date": "October 2015", "section": "Read the whole thing."}], "takeaway": "His point is that the apostles' one job is to be witnesses of Christ. Everything else is downstream of that. He describes watching the senior apostles, some of them old and sick, keep testifying anyway, and says their witness is what holds the Church together. He also says something people miss: the apostles are ordinary men who were called, not extraordinary men who were found.", "journal": "Bednar says apostles are ordinary men, called. Does that make their witness weaker or stronger to you?"}, {"q": "If I have the Spirit, why do I need a middleman?", "intro": "Here's the hard part. You can pray. You can get revelation. So why does God route things through fifteen men in Salt Lake? Isn't that exactly the kind of priestcraft the Book of Mormon warns about? Read the Lord telling Oliver Cowdery who gets revelation for the Church and who doesn't. Read Hebrews on authority. Then read Nephi on what actual priestcraft looks like, and see whether it matches.", "read": ["D&C 28:2-7", "D&C 43:3-7", "Hebrews 5:4", "2 Nephi 26:29-31"], "journal": "D&C 28 says one person gets revelation for the whole Church. Why do you think God does it that way instead of everyone hearing directly?"}, {"q": "How do you actually follow a prophet?", "intro": "Sustaining isn't a vote. The Lord says receive his word in patience and faith, and that the gates of hell won't prevail against you if you do. Isaiah describes how beautiful the feet of the one who brings good news are, and Abinadi says that's every prophet. When you read, look for what the promise is attached to. It's not agreement. It's something else.", "read": ["D&C 21:4-6", "Mosiah 15:14-18", "D&C 124:45-46", "Preach My Gospel, lesson 1, \"Apostles and Prophets\" and \"The Restoration of the Gospel through Joseph Smith\""], "journal": "Pick the most recent thing the prophet asked. Not your favorite. The most recent. Are you doing it? Write yes or no and why."}, {"q": "What do I believe now?", "intro": "Back to Ephesians 4. Read the \"until\" verses one more time. Then read your Day 1 answer.", "read": ["Ephesians 4:11-14", {"journal": [37, 1]}], "journal": "Answer the week's question the way you'd say it to a Christian friend: Why does the Church need apostles and prophets now?"}]}, {"n": 38, "tag": "", "question": "\"I can do all things through Christ.\" Really? All things?", "intro": "It's on posters, t-shirts, and the back of athletes' cleats. \"I can do all things through Christ which strengtheneth me.\" But Paul wrote it from prison. He didn't get out. He was eventually executed. So he clearly didn't mean \"I can do anything I set my mind to.\" What did he mean? This week is about the verse people quote most and understand least, and what strength through Christ actually looks like when things don't work out.", "days": [{"q": "What did Paul say, and what was around it?", "intro": "Read the whole passage, not the one line. Paul is talking about being content whether he's full or hungry, rich or broke. *That's* the \"all things.\" He's not promising success. He's describing a man who can't be knocked over. When you read, list what he says he's learned.", "read": ["Philippians 4:4-13"], "journal": "What's the \"all things\" you've been hoping this verse covers? Write it down. We'll see if Paul meant that."}, {"q": "Where was he when he wrote it?", "intro": "Prison. Probably Rome, chained to a guard. He'd been shipwrecked, beaten, stoned, and left for dead. The Greek word for \"content\" is *autarkes*, self-sufficient, though Paul flips it to Christ-sufficient. \"Strengtheneth\" is *endunamoo*, to be made strong from the inside. Read what Paul said about being in prison, and his line about living and dying. Then you'll know what kind of strength he meant.", "read": ["Philippians 1:12-14", "Philippians 1:20-21", "2 Corinthians 11:23-28"], "journal": "Paul in chains says his imprisonment helped the gospel spread. What's the thing in your life that feels like chains? What would it look like to see it his way?"}, {"q": "Who in the Book of Mormon said the same thing?", "intro": "Ammon. Almost word for word. \"In his strength I can do all things.\" And Ammon had the receipts: he'd just spent fourteen years doing things that shouldn't have worked. Read his boast, which he's careful to say is in God, not himself. Then Nephi on the ship and Alma's people under burdens. When you read, look at what the strength was *for* in each case.", "read": ["Alma 26:11-12", "1 Nephi 17:50-51", "Mosiah 24:14-15", "Alma 20:4"], "journal": "Ammon says he can do all things in God's strength. What's the thing he actually did with it? Was it what he'd have picked?"}, {"q": "What does the prophet say about drawing on that power?", "intro": "President Russell M. Nelson, April 2017. He asked a room full of people whether they were actually accessing the Savior's power or just talking about it.", "read": [{"talk": "Drawing the Power of Jesus Christ into Our Lives", "speaker": "Russell M. Nelson", "date": "April 2017", "section": "Read the whole thing."}], "takeaway": "His point is that the Savior's power is real, available, and mostly unused. He says most of us have no idea how much He's willing to do for us because we don't ask in the right way. Nelson's method: study the Atonement seriously, use the Topical Guide, learn everything you can about what Christ actually did, and then reach for that power on purpose. It's not automatic. You have to draw it.", "journal": "Nelson says the power is available and mostly unused. What's one thing you've been trying to do in your own strength that you could actually ask Him to strengthen you in?"}, {"q": "What about when it doesn't work?", "intro": "Here's the hard part. Paul was strengthened and still got executed. Shadrach, Meshach, and Abednego said God could save them \"but if not\" they still wouldn't bow. Hebrews 11 lists people who got miracles and then, in the same breath, people who didn't. So what does \"I can do all things\" mean when the thing you're praying for doesn't happen? Read these and decide whether the verse is about outcomes or about something else.", "read": ["Daniel 3:16-18", "Hebrews 11:32-40", "2 Corinthians 12:9-10", "Alma 14:11 (Alma unable to save the believers)"], "journal": "\"But if not.\" Take your \"all things\" from Day 1. Can you say \"but if not\" about it? What would that cost you?"}, {"q": "How do you actually draw on it?", "intro": "Isaiah says the ones who wait on the Lord get their strength renewed. Not the ones who push harder. The Lord tells His missionaries He'll be on their right hand and left. Paul's own answer is that the strength shows up in weakness, not around it. When you read, look for the posture. It's more like leaning than lifting.", "read": ["Isaiah 40:28-31", "D&C 84:88", "2 Corinthians 12:9 again", "Preach My Gospel, lesson 2, \"The Atonement\" (the section on how it strengthens us)"], "journal": "Pick one hard thing this week. Before you do it, pray specifically for His strength in *that* thing. Then write down what happened, even if it's \"nothing I could tell.\""}, {"q": "What do I believe now?", "intro": "Back to Philippians 4. Read verses 11 through 13 one more time, all three. Then read your Day 1 and Day 5 answers.", "read": ["Philippians 4:11-13", {"journal": [38, 1]}, {"journal": [38, 5]}], "journal": "Answer the week's question: What did Paul mean by \"I can do all things through Christ\"? And what does it mean for the thing you wrote on Day 1?"}]}, {"n": 39, "tag": "L3", "question": "\"Fight the good fight.\" What was Paul actually fighting?", "intro": "Paul's last letter, written while he waited to be executed, has one of the best lines in scripture: \"I have fought a good fight, I have finished my course, I have kept the faith.\" Preach My Gospel calls this enduring to the end, the fifth principle of the gospel. It's the one nobody teaches well. It sounds like gritting your teeth until you die. Paul didn't sound like he was gritting anything. So what was the fight, and how do you fight it without being miserable?", "days": [{"q": "What did Paul say at the end?", "intro": "Read the end of 2 Timothy. Paul knows he's about to die. He's not scared. Read what he says about it, and then go back to the beginning of the letter where he tells Timothy not to be ashamed. When you read, notice he uses three images: a fight, a race, and a trust. Different things.", "read": ["2 Timothy 4:6-8", "2 Timothy 1:7-8, 12"], "journal": "Paul says he's kept the faith. What does \"keeping\" faith look like for you, day to day? Not gaining it. Keeping it."}, {"q": "What was the fight?", "intro": "The Greek word is *agon*, where we get \"agony.\" It's an athletic contest, a wrestling match, a race. Paul used sports language constantly. Read him describing the race in Corinthians, and the writer of Hebrews describing it with a stadium full of people watching. The fight wasn't against Rome. It was against quitting.", "read": ["1 Corinthians 9:24-27", "Hebrews 12:1-3", "Philippians 3:12-14"], "journal": "Paul's fight was against giving up, not against an enemy. What's the thing you're most tempted to quit on right now? Church? A calling? A person?"}, {"q": "What does the Book of Mormon call it?", "intro": "Nephi has the clearest description of enduring anywhere: press forward with a steadfastness in Christ, a perfect brightness of hope, and love. That's not gritting teeth. Read him. Then read the resurrected Christ giving the same instruction, and the Lord's shortest version of it in the D&C.", "read": ["2 Nephi 31:15-20", "3 Nephi 27:16-19", "D&C 14:7", "Mosiah 4:30"], "journal": "Nephi says press forward with brightness of hope. Is your endurance bright, or is it just endurance? What's the difference?"}, {"q": "What does an apostle say about not quitting?", "intro": "President Henry B. Eyring, October 2018. The title is the whole talk, and he means it.", "read": [{"talk": "Try, Try, Try", "speaker": "Henry B. Eyring", "date": "October 2018", "section": "Read the whole thing."}], "takeaway": "His point is that discipleship is mostly getting back up. He doesn't promise it gets easy. He says the Lord's expectation is that you keep trying, and that trying *is* the faith, not a warmup for it. He tells stories about people who failed and kept going, and says that's what the Lord counts. The only real failure is quitting, and even that can be undone.", "journal": "Eyring says trying is the faith. What have you stopped trying at because you failed? Is it too late to try again?"}, {"q": "Is enduring supposed to be joyless?", "intro": "Here's the hard part. \"Endure to the end\" sounds like a sentence, not a promise. And some people who endured for decades quit near the end. Oliver Cowdery left. Martin Harris left. Both came back, but they left. Read the moment the disciples abandoned Jesus and Peter's answer for why he stayed. Read Jesus on looking back. Then read Ammon, who endured plenty and was anything but joyless.", "read": ["John 6:66-69", "Luke 9:62", "Alma 26:27-30", "D&C 121:7-8"], "journal": "Peter said \"to whom shall we go?\" Is that why you stay? Is that a good enough reason? What's a better one?"}, {"q": "How do you actually keep going?", "intro": "This week connects to Week 4 and Week 11. Read what you wrote when you redefined \"perfect\" and \"repent.\" Enduring is just those two things repeated: getting more complete, turning again. Then read Alma's counsel to his son, which is the simplest instruction for enduring in scripture: counsel with the Lord in all thy doings.", "read": [{"journal": [4, 7]}, {"journal": [11, 7]}, "Alma 37:35-37", "Preach My Gospel, lesson 3, \"Endure to the End\""], "journal": "Alma says counsel with the Lord in *all* your doings. Pick one part of your life you've never actually counseled with Him about. Do it tonight. Write what you asked."}, {"q": "What do I believe now?", "intro": "Back to Paul in prison. Read 2 Timothy 4:7 one more time. Then read your Day 1 and Day 5 answers.", "read": ["2 Timothy 4:6-8", {"journal": [39, 1]}, {"journal": [39, 5]}], "journal": "Answer the week's question: What was Paul fighting? And what are you fighting?"}]}, {"n": 40, "tag": "L1", "question": "Paul warned about a falling away. Did it happen?", "intro": "Paul told the Thessalonians the Second Coming wouldn't happen until there was a \"falling away first.\" He told the Ephesian elders wolves would come after he left. He told Timothy people would stop putting up with sound doctrine. Every one of them was predicting the same thing: the Church would fall apart. We say it did. Most Christians say it didn't, or that the Reformation fixed it. This week is about what Paul saw coming and whether it came.", "days": [{"q": "What did Paul and the others actually predict?", "intro": "Read Paul's warning to the Thessalonians, then his goodbye to the Ephesian elders, then his letters to Timothy. Four different warnings from one man over about fifteen years. When you read, notice he's not vague. He describes what it'll look like.", "read": ["2 Thessalonians 2:1-3", "Acts 20:28-31", "1 Timothy 4:1-3", "2 Timothy 4:3-4"], "journal": "Before this week, what would you have said if a friend asked what \"the Great Apostasy\" means? Write it down."}, {"q": "What does \"apostasy\" mean, and was it foretold earlier?", "intro": "Greek: *apostasia*, a defection, a rebellion, walking away from where you stood. It's the word for a soldier deserting. Amos saw it centuries before Paul: a famine, not of bread, but of hearing the word of the Lord. Isaiah saw the ordinances being changed. Read them. Then read Peter and John describing it already starting while they were alive.", "read": ["Amos 8:11-12", "Isaiah 24:5", "2 Peter 2:1-3", "1 John 2:18-19"], "journal": "Amos calls it a famine of hearing God's word. Have you ever felt that famine personally? What was it like?"}, {"q": "What does the Restoration say happened?", "intro": "Nephi saw the church going into the wilderness, and the Book of Mormon calls the result a church that's \"built up\" instead of the Lord's. Then read the Lord's own summary in D&C 1, and what He told Joseph Smith in the grove. When you read, look for what was lost. It's not that people stopped being good. It's something more specific.", "read": ["1 Nephi 13:4-9", "2 Nephi 28:3-6", "D&C 1:15-16", "Joseph Smith—History 1:18-19"], "journal": "JS-H 1:19 says they had a form of godliness but denied the power. What's the difference between the form and the power? Have you ever had one without the other?"}, {"q": "What does an apostle say about why the Church exists?", "intro": "Elder D. Todd Christofferson, October 2015. A lot of people ask why they need a church at all if they have Jesus. He answers.", "read": [{"talk": "Why the Church", "speaker": "D. Todd Christofferson", "date": "October 2015", "section": "Read the whole thing."}], "takeaway": "His point is that the Church isn't an optional add-on to personal faith. Christ organized one on purpose, with authority, ordinances, and structure, because some things can't be done alone: you can't baptize yourself, you can't take the sacrament alone, and you can't be a Zion people by yourself. The apostasy wasn't that people stopped believing. It's that the organization Christ built, with its authority, came apart.", "journal": "Christofferson says some things can't be done alone. What's one thing the Church gives you that you literally couldn't get by yourself?"}, {"q": "Were there no good Christians for 1,700 years?", "intro": "Here's the hard part. If the Church fell away, what about all the sincere Christians in between? The monks who copied scripture, the reformers who died for it, your ancestors who prayed? Were they nothing? Read Nephi seeing the Spirit work on Columbus and the reformers. Read Moroni on the light of Christ given to everyone. Read Alma on God speaking to all nations. Then answer carefully.", "read": ["1 Nephi 13:12-19", "Moroni 7:16-19", "Alma 29:8", "D&C 137:7-9"], "journal": "The Restoration says the authority was lost, not the goodness. Does that distinction hold up for you? What would you say to a devout Catholic grandmother about her faith?"}, {"q": "Can it happen to you?", "intro": "Apostasy isn't just a historical event. The word means walking away, and people do it one step at a time. Helaman describes exactly how the Spirit withdraws from a people and it's gradual. The Lord tells Joseph the same thing about individuals. When you read, look for the mechanism. Then read King Benjamin on how to not drift.", "read": ["Helaman 4:23-25", "D&C 121:37", "Mosiah 5:12-13", "Preach My Gospel, lesson 1, \"The Great Apostasy\""], "journal": "Helaman says the Spirit withdraws when people harden their hearts and it's gradual. Where's one place you've drifted a step without noticing? Write it, then write the step back."}, {"q": "What do I believe now?", "intro": "Back to Paul's warning. Read 2 Thessalonians 2 one more time. Then read your Day 1 answer.", "read": ["2 Thessalonians 2:1-3", {"journal": [40, 1]}], "journal": "Answer the week's question the way you'd say it to a friend from another church: Did the falling away happen? And what does that mean for them?"}]}, {"n": 41, "tag": "", "placeholder": "October 2027 General Conference", "question": "Conference week. Which talk from October got under your skin?", "intro": "Same deal as Week 29. No topic picked ahead of time. You pick one talk from October 2027 general conference, the one that hit hardest or bugged you most, and we take it apart for a week. If you did Week 29, go read what you wrote on Day 7 there first. It'll be interesting to see what you got out of the last one. Then pick your talk and write the speaker and title in your Day 1 journal.", "days": [{"q": "What did the speaker actually say?", "intro": "Read the whole talk, start to finish. Not the highlights. The talk. When you read, mark the one sentence that stopped you and the one you pushed back on. There's always one of each.", "read": [{"journal": [29, 7]}, "Your talk, the whole thing"], "journal": "Write the speaker and title. Then the sentence that stopped you and the sentence you pushed back on."}, {"q": "What scriptures did they build it on?", "intro": "List every scripture the speaker cited. Read at least three in context, the verses around them, not just the line. When you read, figure out why the speaker picked *that* verse and not another one.", "read": ["Every scripture cited in your talk (list them)", "Three of them, read in context"], "journal": "Which scripture was carrying the talk? Did context change what you thought the speaker meant?"}, {"q": "What does the rest of scripture say about it?", "intro": "Find your own. Two scriptures the speaker didn't use, one Book of Mormon and one D&C, that teach the same point. Topical Guide or search bar. You're the student now, not the audience.", "read": ["One Book of Mormon passage on the talk's main point (you find it)", "One D&C passage on the same point (you find it)"], "journal": "Write the two references you found. Did either say it better than the talk?"}, {"q": "Who else talked about it?", "intro": "Find a second talk from the same conference on a related topic. Read it. Compare. When you read, look for where they agree and where they come at it differently.", "read": ["A second talk from October 2027 on a related topic"], "takeaway": "Write your own. Two or three sentences on what the second speaker added.", "journal": "What did the second speaker see that the first one didn't say?"}, {"q": "What did they ask you to do that you don't want to?", "intro": "Every talk has an ask. Find it. If you're happy to do it, it's probably not the real ask. Look harder.", "read": ["Your talk again, just the last third", "D&C 1:37-38"], "journal": "What did the speaker ask you to do? Write the actual ask. Then write why you haven't done it yet."}, {"q": "Do it.", "intro": "No reading today. Take the ask from Day 5 and do the first step. Today. Then write what happened. If you can't figure out the first step, that's the entry.", "read": [{"journal": [41, 5]}], "journal": "What did you do? What happened? What's next?"}, {"q": "What do I believe now?", "intro": "Read your Day 1 entry. Then reread the paragraph with the sentence that stopped you.", "read": [{"journal": [41, 1]}, "That one paragraph of your talk"], "journal": "Rewrite the talk's main point in your own words, two sentences, like you're telling a friend who didn't watch."}]}, {"n": 42, "tag": "", "question": "Why did Jesus have to \"learn obedience by the things which he suffered\"?", "intro": "Hebrews says something about Jesus that should make you stop: He *learned* obedience. Through suffering. If He was already perfect, what was there to learn? And if He had to learn it that way, what does that say about how you learn it? This week is about a Savior who grew, and what His growing means for yours.", "days": [{"q": "What does Hebrews actually say?", "intro": "Read Hebrews 5, the verses about Jesus praying with strong crying and tears and learning obedience. Then read chapter 2, where the writer says He was made perfect *through* suffering and that's why He can help. When you read, notice how many times the word \"suffer\" shows up.", "read": ["Hebrews 5:7-9", "Hebrews 2:9-10, 17-18"], "journal": "Jesus learned obedience through suffering. What's something you've learned only by suffering? Write it down."}, {"q": "What was the writer getting at?", "intro": "Hebrews was written to Jewish Christians who knew the high priest system. Every year the high priest went into the Holy of Holies for the people. The writer says Jesus is the real high priest, and the reason He can do the job is that He's *been* where you are. Read chapter 4, which is the point of the whole book. When you read, look for why His suffering makes Him qualified.", "read": ["Hebrews 4:14-16", "Hebrews 7:24-27", "Isaiah 53:3-5"], "journal": "Hebrews 4:15 says He was tempted in all points like you, without sin. Which temptation are you most surprised He'd understand?"}, {"q": "What does the Restoration say about how He grew?", "intro": "D&C 93 says something almost nobody teaches: Jesus didn't receive the fulness at first. He got grace for grace, and continued until He did. King Benjamin described what He'd suffer 120 years early. And the Lord told Joseph that the Son had descended below all of it. When you read, look for the word \"continued.\"", "read": ["D&C 93:11-14", "Mosiah 3:5-7", "Alma 7:11-13", "D&C 122:8"], "journal": "D&C 93 says He went from grace to grace. If the Son of God had to grow that way, what does that do to your impatience with yourself?"}, {"q": "What does an apostle say about carrying loads?", "intro": "Elder David A. Bednar, April 2014. He tells a story about a truck stuck in the snow and what got it out, and then explains how the Savior's yoke works.", "read": [{"talk": "Bear Up Their Burdens with Ease", "speaker": "David A. Bednar", "date": "April 2014", "section": "Read the whole thing."}], "takeaway": "His point is that the load is what gives you traction. The truck couldn't get out of the snow until it was loaded with wood. He says the Savior doesn't always remove the burden, He makes you strong enough that it becomes the thing that moves you forward. And the yoke is shared. You're not pulling alone. You're pulling *with* Him, and He's been under the same yoke.", "journal": "Bednar says the load gives traction. What's the load you've been asking to have removed that might be the thing moving you?"}, {"q": "If He had to learn, was He ever not perfect?", "intro": "Here's the hard part. If Jesus learned obedience, was there a time He didn't have it? Did He ever fail? Luke says He grew in wisdom and stature. The Joseph Smith Translation says He didn't need anyone to teach Him. Hebrews says without sin. So what does \"learned\" mean for someone who never sinned? Read these and try to hold both: He grew, and He never fell.", "read": ["Luke 2:40, 52", "Joseph Smith Translation, Matthew 3:24-26 (in the appendix)", "Hebrews 4:15 again", "D&C 93:12-13 again"], "journal": "Can you learn something without failing at it first? What would it mean that Jesus did?"}, {"q": "How do you learn obedience from your own suffering?", "intro": "Hebrews 12 says chastening isn't fun while it's happening but it produces something afterward, *if* you let it. Alma says the people who get humble without being forced are more blessed. The Lord told Joseph all of it would give him experience. When you read, look for the condition. Suffering doesn't automatically teach. Something has to happen for it to.", "read": ["Hebrews 12:11", "Alma 32:13-16", "D&C 122:7", "D&C 58:2-4"], "journal": "Go back to the thing you wrote on Day 1. What did it teach you? Now write what you would have learned if you'd been humble *before* it hit."}, {"q": "What do I believe now?", "intro": "Back to Hebrews 5. Read it one more time. Then read your Day 1 and Day 6 answers.", "read": ["Hebrews 5:7-9", {"journal": [42, 1]}, {"journal": [42, 6]}], "journal": "Answer the week's question: Why did Jesus have to learn obedience through suffering? And what does that mean for how you learn it?"}]}, {"n": 43, "tag": "", "question": "Melchizedek priesthood. Why is it named after a guy we know almost nothing about?", "intro": "Melchizedek shows up in three verses of Genesis. He's a king and a priest. Abraham pays him tithing. Then he's gone. And somehow the highest priesthood in the Church is named after him. Hebrews spends a whole chapter on him. Alma spends half of one. If you've ever held or been blessed by that priesthood and wondered who this guy was and why it matters, this is the week.", "days": [{"q": "What does the Bible say about him?", "intro": "Read the three verses in Genesis. That's all the Old Testament gives you. Then read Hebrews 7, where the writer makes a big deal out of how little we know: no father, no mother, no beginning of days. He's using Melchizedek as a picture of Christ. When you read, notice what the writer says was wrong with the *other* priesthood.", "read": ["Genesis 14:18-20", "Hebrews 7:1-4, 11-17"], "journal": "What do you actually know about the priesthood? Not the definition. What it does. Write it down before this week."}, {"q": "Why does Hebrews care so much?", "intro": "Israel had the Levitical priesthood for 1,500 years. It came by lineage. Jesus wasn't a Levite, so by their rules He couldn't be a priest. Hebrews solves that with Psalm 110, which says the Messiah is a priest after the order of Melchizedek, an older and higher order that doesn't depend on which tribe you're from. Read the Psalm, then Hebrews using it. The name of the priesthood is the argument.", "read": ["Psalm 110:1-4", "Hebrews 5:5-6, 10", "Hebrews 7:20-25"], "journal": "The Levitical priesthood came by birth. The Melchizedek priesthood comes by call. Why does that difference matter?"}, {"q": "What does the Restoration add?", "intro": "A lot. Alma tells you more about Melchizedek than the Bible does. D&C 107 tells you the priesthood used to be called something else and why they changed it. D&C 84 tells you what the priesthood *does*, and it's bigger than passing the sacrament. When you read D&C 84:19-22, slow down. That's the whole point in four verses.", "read": ["Alma 13:14-19", "D&C 107:1-4", "D&C 84:17-22", "Joseph Smith Translation, Genesis 14:25-40 (in the appendix, if you have time)"], "journal": "D&C 84:20 says the power of godliness shows up in the ordinances. What's an ordinance where you've actually felt that? What was it?"}, {"q": "What does an apostle say about keys and authority?", "intro": "President Dallin H. Oaks, April 2014. He explains keys, authority, and who has what, including a section on women and priesthood authority that surprised a lot of people.", "read": [{"talk": "The Keys and Authority of the Priesthood", "speaker": "Dallin H. Oaks", "date": "April 2014", "section": "Read the whole thing."}], "takeaway": "His point is that priesthood keys are what direct the use of priesthood power, and they're held by a few people so the power can be used by many. He says something most members haven't heard: when a woman is set apart under the direction of someone with keys, she exercises priesthood authority in that calling. The priesthood isn't a men's club. It's God's power, organized, and everyone in the Church operates under it.", "journal": "Oaks says anyone set apart exercises priesthood authority in their calling. Does that change how you see your own calling, or someone else's?"}, {"q": "If Jesus is the high priest, why do we need any others?", "intro": "Here's the hard part. Hebrews says Christ is the only high priest we need, forever. So why does the Church ordain thousands of men? Isn't that exactly the Levitical system Hebrews said was replaced? Read Hebrews again, carefully. Then read D&C 121 on how fast the priesthood stops working when it's misused. Then read the Lord's own explanation of why He gives power to men at all.", "read": ["Hebrews 7:23-28 again", "D&C 121:36-37", "D&C 84:19-22 again", "John 15:16"], "journal": "D&C 121:37 says the priesthood quits working the moment it's used to control someone. Have you ever seen that happen? What did it look like?"}, {"q": "How is it supposed to be used?", "intro": "D&C 121 is the answer, and it's the opposite of what most people expect from the word \"authority.\" Persuasion. Long-suffering. Gentleness. Love unfeigned. Then read the oath and covenant, which is what you sign up for when you receive it. When you read, list what the priesthood is *not* allowed to do.", "read": ["D&C 121:34-46", "D&C 84:33-42", "Preach My Gospel, lesson 5, \"Priesthood and Auxiliaries\""], "journal": "Whether you hold the priesthood or are blessed by it, pick one thing from D&C 121:41-42 to do this week. Not think about. Do."}, {"q": "What do I believe now?", "intro": "Back to Melchizedek. Read Genesis 14 one more time, all three verses, and then Alma's description of the same man. Then read your Day 1 answer.", "read": ["Genesis 14:18-20", "Alma 13:17-19", {"journal": [43, 1]}], "journal": "Answer the week's question: Why is the priesthood named after him? And what do you know about the priesthood now that you didn't on Day 1?"}]}, {"n": 44, "tag": "L3", "question": "Faith without works is dead. But we're saved by grace. Pick one?", "intro": "Paul says you're saved by faith, not works. James says faith without works is dead. Martin Luther wanted James thrown out of the Bible over it. We tend to like James and get nervous around Paul. Neither one is wrong. But if you can't explain how both are true, you'll spend your life bouncing between earning your way and coasting. This week is Week 30 finished.", "days": [{"q": "What did James actually say?", "intro": "Read James 2. He's blunt: show me your faith without works and I'll show you mine by them. He uses Abraham and Rahab as examples, and here's the thing: Paul used Abraham too, to prove the opposite point. Same guy. When you read, notice James isn't against faith. He's against a certain kind of \"faith.\"", "read": ["James 2:14-26"], "journal": "Read your Week 30 Day 7 answer next. Then write: do you lean Paul or James? Which one makes you nervous?"}, {"q": "Were Paul and James actually disagreeing?", "intro": "Paul quotes Genesis 15, where Abraham believed and it was counted as righteousness. James quotes Genesis 22, where Abraham offered Isaac. Same man, thirty years apart. Paul is answering \"how do you get in?\" James is answering \"how do you know you're in?\" Read both of them using Abraham, then read Genesis, and see whether they're fighting or describing two ends of the same thing.", "read": [{"journal": [30, 7]}, "Romans 4:1-5", "Genesis 15:5-6", "Genesis 22:9-12"], "journal": "Paul's Abraham believed. James's Abraham obeyed. Was that one faith or two? What did the thirty years in between do?"}, {"q": "What does the Book of Mormon say works are for?", "intro": "Amulek says your prayer is worthless if you turn away the needy. Moroni says a work done without real intent counts as nothing. King Benjamin says even serving God your whole life leaves you in debt. Put those three together and you get the answer: works don't buy anything. They *show* something. When you read, look for what the works are evidence of.", "read": ["Alma 34:26-29", "Moroni 7:6-9", "Mosiah 2:21-24", "Mosiah 4:10"], "journal": "Moroni 7 says a gift given grudgingly is counted as if you kept it. What's something you do for God grudgingly? What would it take to do it for real?"}, {"q": "What does an apostle say about the order?", "intro": "President Dieter F. Uchtdorf, October 2018. Three words in the title, and the order of the three words is the whole talk.", "read": [{"talk": "Believe, Love, Do", "speaker": "Dieter F. Uchtdorf", "date": "October 2018", "section": "Read the whole thing."}], "takeaway": "His point is that the sequence matters. You believe, that changes what you love, and what you love changes what you do. Works come *out* of faith, not in front of it. He says if you try to do without believing, you burn out. If you believe without doing, you were never really believing. The doing is the proof that the believing was real.", "journal": "Uchtdorf says believe, then love, then do. Where does your discipleship usually start? Is it in the right order?"}, {"q": "Can you have real faith and still not act?", "intro": "Here's the hard part. James says no. But you've had faith and still not acted, and you know it wasn't fake. So what's going on? Jesus says if you love Him, keep His commandments, which sounds like James. John says if you say you know Him and don't keep them, you're lying. But the Lord also warns about doing things only because you're commanded. Read these and figure out where laziness ends and dead faith begins.", "read": ["John 14:15", "1 John 2:3-6", "D&C 58:26-29", "Matthew 6:1-4 (works done to be seen)"], "journal": "Where's the line between \"I have faith but I'm being lazy\" and \"my faith is dead\"? Which side are you on with the thing you've been avoiding?"}, {"q": "What works, specifically?", "intro": "Not a checklist. The resurrected Christ said the works are the ones you've seen *Him* do. Matthew 25 lists them. James says be a doer of the word, not just a hearer, and describes what a hearer-only looks like. When you read, look for the works that count. They're not impressive.", "read": ["3 Nephi 27:21", "Matthew 25:34-40", "James 1:22-27", "Preach My Gospel, lesson 3, \"Faith in Jesus Christ\" and \"Endure to the End\""], "journal": "Pick one work from Matthew 25:35-36. Do it this week for a specific person. Write who and what. That's your faith made visible."}, {"q": "What do I believe now?", "intro": "Back to James 2. Read it one more time. Then read your Day 1 answer and your Week 30 answer side by side.", "read": ["James 2:17-18, 26", {"journal": [44, 1]}, {"journal": [30, 7]}], "journal": "Answer the week's question: Faith or works? Say how both are true in a way that would satisfy Paul *and* James."}]}, {"n": 45, "tag": "L1", "question": "\"If any of you lack wisdom.\" What did Joseph Smith actually do with that verse?", "intro": "A fourteen-year-old farm kid read one verse in James and it started the Restoration. Millions of people have read the same verse and nothing happened. So what did Joseph do that they didn't? The verse says ask God. Everybody asks God. But Joseph did something specific with it, and Preach My Gospel builds the whole first lesson on it. This week is about the verse, the boy, and the method.", "days": [{"q": "What does James say, and what did Joseph do with it?", "intro": "Read James first. Then read Joseph's own account of reading it. When you read Joseph, pay attention to what he says the verse did to him and what he did *next*. There's a gap between reading and asking, and what he did in that gap is the whole story.", "read": ["James 1:5-8", "Joseph Smith—History 1:11-13"], "journal": "Joseph says the verse entered his heart with great force. Has any scripture ever done that to you? Which one?"}, {"q": "What was James actually promising?", "intro": "James was Jesus's brother. He wrote to Jews scattered across the empire, practical people. \"Wisdom\" in Greek is *sophia*, practical wisdom, knowing what to do. And \"upbraideth not\" means God won't scold you for asking. Read Proverbs, which James was echoing, and the verses in James about asking without wavering. That's the condition. It's not \"ask nicely.\" It's \"ask like you'll act.\"", "read": ["Proverbs 2:3-6", "James 1:6-8 again", "Matthew 7:7-8"], "journal": "\"Upbraideth not.\" God won't scold you for asking. What question have you not asked because you were embarrassed to?"}, {"q": "What happened when he asked?", "intro": "Read the First Vision in Joseph's own words. All of it, including the part before the light, which people skip. He was attacked first. Then read the Lord telling Oliver Cowdery that he'd already received an answer he hadn't recognized. Two ways answers come. When you read, notice what Joseph did when the darkness hit.", "read": ["Joseph Smith—History 1:14-20", "D&C 6:22-23", "2 Nephi 32:8-9"], "journal": "Joseph was nearly overcome before the light came. Have you ever been closest to giving up right before an answer? What happened?"}, {"q": "What does the prophet say about it?", "intro": "President Russell M. Nelson, April 2020, the 200th anniversary of the First Vision. He's talking about what the Father said in the grove and what it means for you.", "read": [{"talk": "Hear Him", "speaker": "Russell M. Nelson", "date": "April 2020", "section": "Read the whole thing."}], "takeaway": "His point is that the Father said one thing in the grove that matters for everyone: \"Hear Him.\" Not \"hear about Him.\" Hear Him. Nelson says the First Vision isn't just history, it's the pattern: you have a question, you go somewhere to ask it, and God answers. And he says the most important thing you can do in your life is learn to hear the Lord's voice, because it's not optional for what's coming.", "journal": "Nelson says learn to hear Him. When was the last time you'd say you heard Him, not just felt something? What did He say?"}, {"q": "Joseph asked and got a vision. I ask and get nothing. So what's the difference?", "intro": "Here's the hard part. You've asked in faith. No pillar of light. Was Joseph special, or are you doing it wrong, or is there a third option? Read the Lord explaining to Oliver why his attempt to translate failed. Read the Lord on how *most* revelation comes. Read Alma's experiment, which promises a result but not a vision. Then be honest about what you were expecting.", "read": ["D&C 9:7-9", "D&C 8:2-3", "Alma 32:27-28, 33-34", "1 Kings 19:11-12"], "journal": "What were you expecting when you asked? A vision? A feeling? A voice? Would you recognize the answer if it came a different way?"}, {"q": "How do you ask like Joseph did?", "intro": "Joseph's method is in JS-H 1:12-13 and it's specific: he read the verse, reflected on it again and again, concluded he had to ask, and picked a place and time. Moroni adds \"real intent,\" which means you've decided to act before you get the answer. When you read, write down the actual steps.", "read": ["Joseph Smith—History 1:12-14 again", "Moroni 10:3-5", "D&C 9:8", "Preach My Gospel, lesson 1, \"Pray to Know the Truth through the Holy Ghost\""], "journal": "Pick one question. Do Joseph's steps this week: read something about it, reflect on it again and again, decide to ask, pick a place, and go. Write the question and the place."}, {"q": "What do I believe now?", "intro": "Back to James 1:5. Read it one more time. Then read your Day 1 answer and your Day 6 question.", "read": ["James 1:5-6", {"journal": [45, 1]}, {"journal": [45, 6]}], "journal": "Answer the week's question: What did Joseph do with that verse? And what did you do with it this week?"}]}, {"n": 46, "tag": "", "question": "\"Partakers of the divine nature.\" Can people really become like God?", "intro": "Peter says you can become a partaker of the divine nature. Paul says you're a joint-heir with Christ. John says when He appears we'll be like Him. Most of Christianity reads those as metaphors. We read them as the point. That gets us called heretics. This week is about what the scriptures actually say you can become, why early Christians believed it, and whether you actually believe it about yourself.", "days": [{"q": "What did Peter say?", "intro": "Read 2 Peter 1. He says God has given you promises so that you can become a partaker of the divine nature, and then he gives a ladder of things to add to your faith. When you read, notice the order of the ladder. It starts with faith and ends with charity. Then read Paul on inheritance.", "read": ["2 Peter 1:1-11", "Romans 8:16-17"], "journal": "\"Partakers of the divine nature.\" Do you actually believe that's about you? Or does it feel like it's about someone more spiritual?"}, {"q": "Did early Christians believe this?", "intro": "Yes. For centuries. The Greek fathers called it *theosis*, becoming like God. Irenaeus and Athanasius both said God became man so that man might become like God. It was mainstream. It faded in the West. Read where they got it: Psalm 82, which Jesus quoted to the Pharisees when they accused Him of blasphemy. Then John, who says we'll be like Him.", "read": ["Psalm 82:6", "John 10:34-36", "1 John 3:1-3"], "journal": "Jesus quoted \"ye are gods\" to defend Himself. If that's a scandal, why did He use it?"}, {"q": "What did the Restoration reveal?", "intro": "D&C 76 is Joseph Smith's vision of the kingdoms of glory, and the description of the celestial kingdom says the words nobody else will: they are gods, even the sons of God. Read it. Then D&C 132, on what exaltation means, and Moses 1:39, which tells you what God is *for*. When you read, notice how much of it is about relationships, not power.", "read": ["D&C 76:50-60", "D&C 132:19-20", "Moses 1:39", "D&C 93:19-20"], "journal": "D&C 76:58 says \"they are gods.\" What's your gut reaction reading that? Excitement, fear, disbelief? Why?"}, {"q": "What does the prophet say about thinking that way?", "intro": "President Russell M. Nelson, October 2023. He says two words that became a slogan, and the talk behind them is about exactly this.", "read": [{"talk": "Think Celestial!", "speaker": "Russell M. Nelson", "date": "October 2023", "section": "Read the whole thing."}], "takeaway": "His point is that every decision you make should be run through one question: what does this mean for my eternal life? He says thinking celestial changes how you handle conflict, temptation, and grief, because you're not living for this life. And he says the doctrine that you can become like God isn't a distant fantasy, it's the reason the commandments exist. They're how you get there.", "journal": "Nelson says run decisions through \"what does this mean for eternity.\" Pick one decision you're facing. Run it through. What changes?"}, {"q": "Isn't this blasphemy?", "intro": "Here's the hard part. Isaiah has God saying there was no God formed before Him and won't be after. Christians hear \"you can become a god\" and think we're demoting God. So what does exaltation actually claim? Read Isaiah. Then read how the Lord describes the relationship between Father and Son and us, which is the model. Then decide: does becoming *like* Him mean becoming *instead of* Him?", "read": ["Isaiah 43:10-11", "John 17:20-23", "D&C 76:58-60 again", "Philippians 2:5-6"], "journal": "What would you say to a Christian friend who says this doctrine makes God smaller? Write your actual answer."}, {"q": "How do you become that?", "intro": "Peter gave you the ladder on Day 1. Read it again as instructions: add to your faith virtue, to virtue knowledge, and on up. The resurrected Christ asks the question and answers it: what manner of men ought ye to be? As I am. Moroni tells you what to pray for. When you read, look for how ordinary the steps are.", "read": ["2 Peter 1:5-8 again, slowly", "3 Nephi 27:27", "Moroni 7:48", "Preach My Gospel, lesson 2, \"The Kingdoms of Glory\" and lesson 5, \"Eternal Marriage\""], "journal": "Pick the next rung on Peter's ladder you need. Write it. Write one thing this week that's a step on that rung."}, {"q": "What do I believe now?", "intro": "Back to 2 Peter 1:4. Read it one more time. Then read your Day 1 and Day 3 answers.", "read": ["2 Peter 1:3-4", {"journal": [46, 1]}, {"journal": [46, 3]}], "journal": "Answer the week's question: Can people really become like God? And do you believe it about *you*?"}]}, {"n": 47, "tag": "L2", "question": "Was the Fall a mistake?", "intro": "Most of Christianity says Adam and Eve blew it. Original sin, the world broken, everything since is damage control. We say something different: the Fall was part of the plan. Eve was wise. Adam was right. If that's true, it changes everything about how you see yourself, your body, your struggles, and God. If it's not true, we've been telling ourselves a nice story. This week finds out.", "days": [{"q": "What does Genesis say happened?", "intro": "Read the Garden story straight. Two trees, one commandment, one serpent. Then read the Book of Moses, which is Joseph Smith's revealed version, and notice what it adds: the serpent's motive, and who Satan actually is. When you read Moses, look for what the Bible left out.", "read": ["Genesis 2:15-17", "Genesis 3:1-7, 22-24", "Moses 4:6-13"], "journal": "Before this week: was the Fall a mistake, a sin, a plan, or something else? Write your honest answer."}, {"q": "What did Adam and Eve face?", "intro": "They'd been given two commandments that couldn't both be kept. Multiply and fill the earth. Don't eat the fruit. In the Garden they couldn't have children. So one commandment had to give. Read Eve's reasoning, then read what Adam and Eve said *after* they'd been cast out. It's not what you'd expect from people who'd just ruined everything.", "read": ["Genesis 1:28", "Moses 4:12", "Moses 5:10-11", "Genesis 3:16-19 (the consequences, which we call blessings in disguise)"], "journal": "Eve said \"were it not for our transgression we never should have had seed.\" Does that sound like regret? What does it sound like?"}, {"q": "What does the Book of Mormon say the Fall was for?", "intro": "Lehi's explanation to Jacob is the clearest treatment of the Fall anywhere in scripture. Adam fell that men might be. Men are that they might have joy. Then Alma adds the word \"probationary,\" which means the Fall created the test you're in. When you read, look for what the Fall made possible that wasn't possible before.", "read": ["2 Nephi 2:15-27", "Alma 12:22-26", "Alma 42:2-10", "Articles of Faith 1:2"], "journal": "2 Nephi 2:25. Adam fell that men might be. Men are that they might have joy. Does your life feel like it was designed for joy? Why or why not?"}, {"q": "What does an apostle say about opposition?", "intro": "President Dallin H. Oaks, April 2016. He explains why the Fall was necessary and makes a distinction between transgression and sin that clears a lot up.", "read": [{"talk": "Opposition in All Things", "speaker": "Dallin H. Oaks", "date": "April 2016", "section": "Read the whole thing."}], "takeaway": "His point is that opposition isn't the enemy of the plan, it *is* the plan. Without it there's no growth, no choice, no joy. He says Adam and Eve's act was a transgression, breaking a formal rule, not a sin, doing something inherently wrong, and that the distinction matters because it means the Fall was a step forward, not a catastrophe. And he says your own opposition, the stuff you'd rather not deal with, is the same thing: the condition that makes becoming possible.", "journal": "Oaks says opposition is the plan, not the obstacle. What's the opposition in your life you've been treating as a mistake?"}, {"q": "If God wanted them to fall, why forbid it?", "intro": "Here's the hard part. If the Fall was the plan, why did God command them not to eat? Was He setting them up? And if Eve was wise, why did she get deceived? Read the two commandments again and notice God said \"nevertheless, thou mayest choose.\" Read Lehi on why there had to be a real choice. Then read the Lord telling Adam his children are innocent. Sit with whether God was tricking them or teaching them.", "read": ["Moses 3:16-17", "2 Nephi 2:11-16", "Moses 6:53-55", "Alma 42:7-8"], "journal": "Moses 3:17 says \"thou mayest choose for thyself.\" Was that a trap or a gift? Write the case for each. Then pick."}, {"q": "What do you do with agency now?", "intro": "The Fall gave you a body, a test, and the ability to choose. Lehi says you're free to choose liberty or captivity. Samuel the Lamanite says you're your own judge. The Lord says don't wait to be told. When you read, look for what the scriptures say agency is *for*. It's not for getting away with things.", "read": ["2 Nephi 2:26-29", "Helaman 14:30-31", "D&C 58:26-28", "Preach My Gospel, lesson 2, \"Agency and the Fall of Adam and Eve\""], "journal": "D&C 58 says people who wait to be commanded are slothful. What's something good you've been waiting to be told to do? Do it this week. Write it."}, {"q": "What do I believe now?", "intro": "Back to 2 Nephi 2:25. Read it one more time. Then read your Day 1 and Day 5 answers.", "read": ["2 Nephi 2:22-25", {"journal": [47, 1]}, {"journal": [47, 5]}], "journal": "Answer the week's question: Was the Fall a mistake? And what does your answer mean for the hard stuff in your life?"}]}, {"n": 48, "tag": "L2", "question": "\"The Lamb slain from the foundation of the world.\" Was the Atonement plan B?", "intro": "Revelation calls Jesus the Lamb slain from the foundation of the world. Before the world. Which means the Atonement wasn't a rescue mission God came up with after the Fall went wrong. It was the plan from the start. That raises a question: if God knew we'd fall and had a Savior ready, was the Fall a setup? And what does it mean that you were in the room when the plan was made? This week starts December with the beginning of everything.", "days": [{"q": "What does Revelation say?", "intro": "Read the phrase in Revelation 13, then Peter saying the same thing, then John's vision of the Lamb in heaven with everyone worshipping. When you read, notice the timing in each one. \"Before the foundation.\" \"Foreordained.\" It's never \"after.\"", "read": ["Revelation 13:8", "1 Peter 1:18-20", "Revelation 5:6-12"], "journal": "The Atonement was planned before the earth. Does that make it feel more certain to you, or more like you were never really free? Write your first reaction."}, {"q": "What did \"Lamb\" mean to them?", "intro": "Every Jew hearing \"Lamb\" thought of Passover. A lamb without blemish, killed so the family could live. John the Baptist called Jesus the Lamb of God the first time he saw Him. Isaiah described the Messiah as a lamb to the slaughter 700 years early. Read them in order. When you read, notice how far back the lamb goes. Abraham told Isaac God would provide one.", "read": ["Exodus 12:3-7, 13", "Isaiah 53:7", "John 1:29, 36", "Genesis 22:7-8"], "journal": "Abraham told Isaac \"God will provide himself a lamb.\" What did Abraham know about the plan? What does that story do to you now?"}, {"q": "What did the Restoration reveal about the council?", "intro": "The Book of Moses and Abraham let you into the room. God asks who He'll send. Two volunteer. One wants the glory. One says thy will be done. Read it. Then read Alma on people being called from the foundation of the world, and King Benjamin on the Atonement being prepared then too. When you read, notice that the Atonement, the Savior, and *you* were all decided in the same council.", "read": ["Moses 4:1-4", "Abraham 3:24-28", "Alma 13:3-5", "Mosiah 4:6-7"], "journal": "Abraham 3:27: \"Whom shall I send?\" Jesus said \"here am I, send me.\" Nobody made Him. What does it change to know He volunteered?"}, {"q": "What does an apostle say about the Lamb?", "intro": "Elder Jeffrey R. Holland, April 2019. He gave this on Easter and it's about the Lamb specifically, what the word means and what it cost.", "read": [{"talk": "Behold the Lamb of God", "speaker": "Jeffrey R. Holland", "date": "April 2019", "section": "Read the whole thing."}], "takeaway": "His point is that the sacrament is where the Lamb slain from the foundation of the world meets you, every week, and most of us treat it like a break in the meeting. He walks through what the lamb imagery meant across all of scripture, from the Garden to Revelation, and says the whole plan was always pointing at one Sunday afternoon on a hill. And he asks you to take the sacrament like you know that.", "journal": "Holland says the sacrament is where the plan from the foundation of the world meets you. Next Sunday, what will you do differently because of that?"}, {"q": "If God knew we'd fall, was the Fall a setup?", "intro": "Here's the hard part. God knew Adam would fall. He had a Savior ready. So was there any real choice? Read what you wrote in Week 47 about whether the Fall was a trap or a gift. Then read Satan's proposal in the council, which was to remove the risk entirely. Then read Alma on why God can't do that. The answer to \"was it a setup\" depends on what you think agency is worth.", "read": [{"journal": [47, 5]}, "Moses 4:1-3", "Alma 42:11-15", "2 Nephi 2:27"], "journal": "Satan's plan was to guarantee everyone made it. God rejected it. Why is a guaranteed outcome worse than a risky one? Answer in your own words."}, {"q": "What do you do with a plan made for you before you were born?", "intro": "You were in that council. Alma says people were called and prepared from the foundation of the world. Jeremiah was known before he was formed. Joseph F. Smith saw noble spirits held back for the last days. That's not just prophets. When you read, look for what being \"prepared from the foundation\" asks of you now.", "read": ["Jeremiah 1:5", "Alma 13:3-5 again", "D&C 138:53-56", "Ephesians 1:4", "Preach My Gospel, lesson 2, \"Pre-Earth Life\""], "journal": "You chose this before you came. What's one thing you'd do differently this week if you actually believed you signed up for it?"}, {"q": "What do I believe now?", "intro": "Back to Revelation 13:8. Read it one more time. Then read your Day 1 and Day 5 answers.", "read": ["Revelation 13:8", "Moses 4:2", {"journal": [48, 1]}, {"journal": [48, 5]}], "journal": "Answer the week's question: Was the Atonement plan B? And what does it mean that you were there when it was decided?"}]}, {"n": 49, "tag": "L2", "question": "The war in heaven. Are we still fighting it?", "intro": "Before the earth there was a war. Not with swords. With ideas. A third of God's children chose Satan's plan and were cast out. You were on the winning side, which is why you're here. But Revelation says the dragon went to make war with the rest of her seed, which is you. So the war didn't end. It moved. This week is about what the war was over, and whether you know which side you're fighting on right now.", "days": [{"q": "What does Revelation say happened?", "intro": "Read John's vision of the war. Michael and the dragon. A third of the stars. Then read *how* the winners won, because it's specific and it's not by force. When you read, find the two weapons in verse 11.", "read": ["Revelation 12:7-11", "Revelation 12:12-17"], "journal": "Revelation 12:11 says they overcame by the blood of the Lamb and the word of their testimony. Do you have both? Which one is weaker in you?"}, {"q": "What did other prophets see?", "intro": "Isaiah saw Lucifer fall and named his sin: \"I will exalt my throne. I will be like the most High.\" Jesus Himself said He saw Satan fall like lightning. Jude mentions angels who didn't keep their first estate. Read them and put together who Satan was and what he wanted. It wasn't to be evil. It was to be in charge.", "read": ["Isaiah 14:12-15", "Luke 10:17-18", "Jude 1:6", "2 Peter 2:4"], "journal": "Lucifer's sin was \"I will.\" Five times. Where does \"I will\" show up in your life in a way that's about being in charge instead of being good?"}, {"q": "What does the Restoration say the war was about?", "intro": "The Book of Moses tells you Satan's actual proposal: save everyone, no one lost, and give me the glory. It sounds generous until you read what it required. Read it, then D&C 29 and D&C 76, which describe the rebellion and what became of it. When you read, look for the word \"agency.\" That's what the war was over.", "read": ["Moses 4:1-4", "Abraham 3:27-28", "D&C 29:36-39", "D&C 76:25-29"], "journal": "Satan's plan would have saved everyone. God's plan let some be lost. Why is God's better? Explain it like you're talking to a kid."}, {"q": "What does an apostle say about choosing sides?", "intro": "Elder Dale G. Renlund, October 2018. He takes Joshua's line, \"choose you this day,\" and says the war in heaven is the same choice, over and over.", "read": [{"talk": "Choose You This Day", "speaker": "Dale G. Renlund", "date": "October 2018", "section": "Read the whole thing."}], "takeaway": "His point is that the choice made in the council wasn't a one-time vote. It's the same choice every day: God's way, where you use your agency and might fail, or Satan's way, where someone else takes the responsibility and you never grow. He says a lot of people who chose right in heaven are quietly choosing the other plan now, by wanting God to just make decisions for them.", "journal": "Renlund says wanting God to just decide for you is Satan's plan wearing a nice outfit. Where are you asking Him to take away a choice instead of help you make it?"}, {"q": "If a third was lost then, is that happening again now?", "intro": "Here's the hard part. A third of God's children rejected Him with a perfect view of the plan. What does that say about people who reject it here, with a worse view? And what about the people you love who've walked away? Read what you wrote in Week 47 about the Fall. Then read Lehi on how free you actually are, and Samuel on being your own judge. Then read the Lord's warning that Satan's war is aimed at *you* specifically.", "read": [{"journal": [47, 7]}, "2 Nephi 2:27-29", "Helaman 14:30-31", "D&C 76:28-29"], "journal": "Someone you love has walked away. Does the war in heaven help you understand it, or make it worse? Write what you actually think."}, {"q": "How do you fight now?", "intro": "Same two weapons: the blood of the Lamb and your testimony. Paul lists the armor. The Lord tells the Saints to put it on. And Captain Moroni's people had one thing that made them fight harder than the Lamanites: they knew what they were fighting for. When you read, look for what you're supposed to be defending. It's not abstract.", "read": ["Ephesians 6:10-18", "D&C 27:15-18", "Alma 43:45-47", "Preach My Gospel, lesson 2, \"Pre-Earth Life\" and \"Agency\""], "journal": "Pick one piece of the armor in Ephesians 6 you're missing. What's it protecting? What are you going to do about it this week?"}, {"q": "What do I believe now?", "intro": "Back to Revelation 12:11. Read it one more time. Then read your Day 1 and Day 3 answers.", "read": ["Revelation 12:7-11", {"journal": [49, 1]}, {"journal": [49, 3]}], "journal": "Answer the week's question: Are we still fighting the war in heaven? And which side are you actually on this week, judging by what you did?"}]}, {"n": 50, "tag": "L2", "question": "\"I make all things new.\" What actually happens at the end?", "intro": "Revelation ends with God saying He'll make everything new. No more death, no more tears. Most people either skip Revelation because it's weird or obsess over it because it's weird. The end of the plan of salvation is the part that's supposed to make the middle worth it. So what actually happens? Judgment, kingdoms, a new earth. Preach My Gospel covers it in a page. This week we take the page seriously.", "days": [{"q": "What does John see at the end?", "intro": "Read the last two chapters of Revelation. New heaven, new earth, no more sea, no more death. God with people, not far from them. When you read, notice what's gone and what's left. The list of what's gone is specific.", "read": ["Revelation 21:1-7", "Revelation 22:1-5"], "journal": "Revelation 21:4 says God will wipe away all tears. What's the tear you most want wiped away? Write it down."}, {"q": "What did the prophets before John see?", "intro": "John wasn't the first. Isaiah saw a new heaven and a new earth seven centuries earlier, and he saw the wolf and the lamb together. Apocalyptic writing used pictures because the thing was too big for plain words. Read Isaiah, then read Jesus describing the same thing as a house with many mansions.", "read": ["Isaiah 65:17-19", "Isaiah 11:6-9", "John 14:1-3"], "journal": "Isaiah says the former things won't be remembered or come to mind. Is there a former thing you're not sure you'd want to forget? Why?"}, {"q": "What did Joseph Smith see?", "intro": "D&C 76 is the most detailed description of the afterlife anywhere in scripture. Three kingdoms, described in order from lowest to highest. Read the telestial and terrestrial first, because they're more generous than most people expect, then the celestial. Then read what happens to the earth itself. When you read, look for who ends up where and why.", "read": ["D&C 76:81-89", "D&C 76:71-79", "D&C 76:50-62", "D&C 88:17-20, 25-26", "Articles of Faith 1:10"], "journal": "D&C 76:89 says the glory of the *lowest* kingdom surpas
