ses all understanding. What does that tell you about God's plan for people who reject Him?"}, {"q": "What does an apostle say about the kingdoms?", "intro": "President Dallin H. Oaks, October 2023. He explains the three kingdoms plainly and says why the doctrine should change how you live now.", "read": [{"talk": "Kingdoms of Glory", "speaker": "Dallin H. Oaks", "date": "October 2023", "section": "Read the whole thing."}], "takeaway": "His point is that the doctrine of three kingdoms is the most merciful thing in Christianity. Almost everyone ends up in a kingdom of glory. The question isn't heaven or hell, it's how much of God you want to be around, and He gives you exactly what you're willing to receive. Oaks says the celestial kingdom is for people who want to live with God's *laws*, not just His presence, and the difference matters for what you choose today.", "journal": "Oaks says God gives you what you're willing to receive. What are you willing to receive right now? Be honest about the ceiling you've set."}, {"q": "Is anyone actually lost?", "intro": "Here's the hard part. Three kingdoms of glory sounds like everybody wins. So what about judgment? What about hell? Read the sons of perdition, the only people D&C 76 says are lost, and notice how narrow that is. Then read D&C 19, where the Lord explains what \"endless punishment\" actually means, and it's not what you think. Then Alma on restoration: you get back what you sent.", "read": ["D&C 76:31-38", "D&C 19:6-12", "Alma 41:3-7", "Alma 12:14"], "journal": "Alma says you'll be restored to what you actually were. Not what you said you were. If that happened today, what would you be restored to?"}, {"q": "How do you live like the end is real?", "intro": "Jesus told a story about ten bridesmaids and half of them weren't ready. The Lord says stand in holy places and don't be moved. He says if you're prepared you won't fear. When you read, look for what being ready actually involves. It's not stockpiling. It's something else.", "read": ["Matthew 25:1-13", "D&C 45:56-57", "D&C 87:8", "D&C 38:30", "Preach My Gospel, lesson 2, \"The Spirit World,\" \"The Resurrection and Judgment,\" and \"The Kingdoms of Glory\""], "journal": "The five wise virgins had oil they couldn't share. What's your oil? What have you actually stored up this year that nobody can give you?"}, {"q": "What do I believe now?", "intro": "Back to Revelation 21. Read verses 3 through 5 one more time. Then read your Day 1 tear and what you wrote in Week 25 about resurrection.", "read": ["Revelation 21:3-5", {"journal": [50, 1]}, {"journal": [25, 7]}], "journal": "Answer the week's question: What actually happens at the end? And what does that make you want to do with the next year?"}]}, {"n": 51, "tag": "", "question": "Christmas. Why a baby? Why a manger? Why then?", "intro": "God came to earth. He could have come any way He wanted. Fire on a mountain, a king in a palace, a warrior in the sky. He came as a baby to a teenager in a town nobody cared about, and they put Him in a feeding trough. None of that was an accident. This week is Christmas, and the question is why He did it the way He did it. Nephi called it the condescension of God. Let's find out what that means.", "days": [{"q": "What does Luke say happened?", "intro": "Read the Christmas story like you've never heard it. Census, no room, shepherds, angels. When you read, notice how ordinary the first half is and how loud the second half gets. Then read Matthew's version, which is darker and has a king trying to kill the baby.", "read": ["Luke 2:1-20", "Matthew 2:1-12"], "journal": "What part of the Christmas story do you actually think about, and what part do you skip? Write it down."}, {"q": "Why Bethlehem, and why a manger?", "intro": "Bethlehem means \"house of bread.\" Micah named it as the Messiah's birthplace 700 years early. It was David's town. The shepherds nearby raised lambs for the temple sacrifices, which means the first people to see the Lamb of God were the guys who raised the lambs. And a manger is a feeding trough. The Bread of Life was laid in a place where animals eat. Read the prophecies and then the story again.", "read": ["Micah 5:2", "Isaiah 7:14", "Isaiah 9:6-7", "Luke 2:7, 12 again"], "journal": "The first witnesses were shepherds who raised sacrificial lambs. God picks His audience on purpose. Who's the audience He picked for you this year?"}, {"q": "What did the Book of Mormon see?", "intro": "Nephi saw the birth 600 years before it happened and an angel asked him if he understood the condescension of God. He said no. Then he saw a virgin with a baby. Alma described it to a city that didn't want to hear it. Samuel gave the sign. And then read the night it actually happened on this continent, with people about to be executed for believing it.", "read": ["1 Nephi 11:13-23", "Alma 7:9-10", "Helaman 14:2-6", "3 Nephi 1:12-21"], "journal": "3 Nephi 1:13: \"on the morrow come I into the world.\" The Savior said that the night before He was born. What do you feel reading that?"}, {"q": "What does an apostle say about why He came that way?", "intro": "Elder Jeffrey R. Holland, October 2003. He gave a talk on what Jesus came to show us about the Father, and the birth is the start of it.", "read": [{"talk": "The Grandeur of God", "speaker": "Jeffrey R. Holland", "date": "October 2003", "section": "Read the whole thing."}], "takeaway": "His point is that Jesus came to show us what God is actually like, because we'd gotten it wrong. Every time Jesus fed someone, healed someone, forgave someone, He was saying: this is my Father. Holland says the baby in the manger was the Father's way of introducing Himself, and if you want to know what God thinks of you, look at how His Son treated people.", "journal": "Holland says Jesus came to show us the Father. What's one thing about God you only know because of something Jesus did?"}, {"q": "Why so ordinary?", "intro": "Here's the hard part. He could have come in glory and settled every argument. Instead He came so quietly that almost nobody noticed, in a body that Isaiah says had no beauty that we should desire Him. Why? Read Paul on what Christ gave up. Read Isaiah on what He looked like. Read Nephi's word again: condescension. Then decide why God chose small.", "read": ["Philippians 2:5-8", "Isaiah 53:2-3", "1 Nephi 11:16-17", "D&C 122:8"], "journal": "He chose to come small and unnoticed. What does that tell you about how He might be showing up in your life, and how you might be missing it?"}, {"q": "What do you give Him?", "intro": "The wise men brought gifts. King Benjamin gave a sermon about the coming Christ and then told his people what to do with it. The Savior Himself said what He wants, and it's not gold. When you read, look for what you actually have that He'd want.", "read": ["Matthew 2:11", "Mosiah 3:8-10, 19", "3 Nephi 9:20", "Preach My Gospel, lesson 1, \"Jesus Christ's Earthly Ministry and Atonement\""], "journal": "What's your gift this Christmas? Not the ones under the tree. The one you'd give Him. Write it, then figure out how to actually give it this week."}, {"q": "What do I believe now?", "intro": "Christmas week. Read the shepherds one more time, and then read Nephi's answer to the angel.", "read": ["Luke 2:8-14", "1 Nephi 11:16-17", {"journal": [51, 1]}], "journal": "Answer the week's question: Why a baby? Why a manger? Why then? Say it the way you'd tell it to your family on Christmas Eve."}]}, {"n": 52, "tag": "", "question": "What do I believe now?", "intro": "Fifty-one weeks. Fifty-one questions. Every week you ended by writing what you believe. This week you read all of it back. Not to grade yourself. To see what a year of asking hard questions did to you. Some of your answers will surprise you. Some you'll disagree with now. That's the point. By Day 7 you'll write one thing: what you believe. In your own words. Nobody else's.", "days": [{"q": "Where did you start?", "intro": "Read your Day 7 answers from the first eight weeks. Waiting on God, baptism, fasting, being perfect, prayer, being born again, being called, faith. Read them in order. When you read, notice which ones you'd write differently now.", "read": [{"journal": [1, 7]}, {"journal": [2, 7]}, {"journal": [3, 7]}, {"journal": [4, 7]}, {"journal": [5, 7]}, {"journal": [6, 7]}, {"journal": [7, 7]}, {"journal": [8, 7]}], "journal": "Which of these eight would you rewrite today? Why?"}, {"q": "What did the Savior's ministry teach you?", "intro": "Weeks 9 through 17. Worry, healing, repentance, parables, Easter, Peter on the water, revelation, forgiveness, the Samaritan. Read your answers. When you read, look for a thread. Something you kept coming back to without meaning to.", "read": [{"journal": [9, 7]}, {"journal": [10, 7]}, {"journal": [11, 7]}, {"journal": [12, 7]}, {"journal": [13, 7]}, {"journal": [14, 7]}, {"journal": [15, 7]}, {"journal": [16, 7]}, {"journal": [17, 7]}], "journal": "What's the thread? What kept showing up in your answers that you didn't plan?"}, {"q": "What did the last week of His life teach you?", "intro": "Weeks 18 through 26. The older brother, the rich young man, the temple, the Book of Mormon, the last night, Gethsemane, the cross, resurrection, the Holy Ghost. Read them. When you read, notice which answer you're proudest of and which one you're least sure of.", "read": [{"journal": [18, 7]}, {"journal": [19, 7]}, {"journal": [20, 7]}, {"journal": [21, 7]}, {"journal": [22, 7]}, {"journal": [23, 7]}, {"journal": [24, 7]}, {"journal": [25, 7]}, {"journal": [26, 7]}], "journal": "Which answer are you least sure of now? What would it take to be sure?"}, {"q": "What did the early Church teach you?", "intro": "Weeks 27 through 35. Saul, Peter's vision, your conference talk, grace, why you're here, charity, not knowing, the dead, thorns. Read them. When you read, look for the one that changed how you actually act, not just what you think.", "read": [{"journal": [27, 7]}, {"journal": [28, 7]}, {"journal": [29, 7]}, {"journal": [30, 7]}, {"journal": [31, 7]}, {"journal": [32, 7]}, {"journal": [33, 7]}, {"journal": [34, 7]}, {"journal": [35, 7]}], "journal": "Which week actually changed what you do? What's different because of it?"}, {"q": "What did the epistles teach you?", "intro": "Weeks 36 through 44. The Spirit, apostles, strength, enduring, apostasy, your second conference talk, learning through suffering, priesthood, faith and works. Read them. When you read, notice whether your answers got shorter or longer over the year, and what that means.", "read": [{"journal": [36, 7]}, {"journal": [37, 7]}, {"journal": [38, 7]}, {"journal": [39, 7]}, {"journal": [40, 7]}, {"journal": [41, 7]}, {"journal": [42, 7]}, {"journal": [43, 7]}, {"journal": [44, 7]}], "journal": "Did your answers get more sure or less sure as the year went on? Is that good?"}, {"q": "What did the end teach you?", "intro": "Weeks 45 through 51. James 1:5, becoming like God, the Fall, the Lamb, the war in heaven, the end, Christmas. Read them. Then read Alma's questions, which are the questions this whole year was asking.", "read": [{"journal": [45, 7]}, {"journal": [46, 7]}, {"journal": [47, 7]}, {"journal": [48, 7]}, {"journal": [49, 7]}, {"journal": [50, 7]}, {"journal": [51, 7]}, "Alma 5:14-16, 26"], "journal": "Alma 5:26: if you've felt to sing the song of redeeming love, can you feel so now? Can you?"}, {"q": "What do I believe now?", "intro": "No reading today except three verses and your own year. Nephi's instruction for what to do next. Moroni's promise about what Christ does with you. Then write. Not a testimony you've heard before. Yours. What you actually believe, after a year of asking. Write it like it's the only thing anyone will ever read from you.", "read": ["2 Nephi 31:19-20", "Moroni 10:32-33", "Alma 32:41-43"], "journal": "What do you believe? Write it. Then read it out loud to someone this week."}]}]</script>
<script>
(function(){
'use strict';
var WEEKS = JSON.parse(document.getElementById('data').textContent);
var ARC = ["What does it actually say?","What did it mean to the people who first heard it?","What does the Restoration add?","What are prophets saying about it right now?","What's the hard part?","What would it look like to live this?","What do I believe now?"];
var DEFAULT_START = '2027-01-01';
var LS = 'tq.';
function lsGet(k,d){ try{ var v=localStorage.getItem(LS+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(LS+k,JSON.stringify(v)); return true;}catch(e){ return false;} }

/* people + journal */
function people(){ return lsGet('people',[]); }
function me(){ var m=lsGet('me',''); var p=people(); if(!m&&p.length) m=p[0]; return m; }
function jkey(w,d){ return 'j.'+me()+'.'+w+'.'+d; }
function getEntry(w,d){ return me()? (lsGet(jkey(w,d),'')||'') : ''; }
function setEntry(w,d,t){ return lsSet(jkey(w,d),t); }
function talkKey(w){ return 'talk.'+me()+'.'+w; }

/* dates */
function startDate(){ return lsGet('start',DEFAULT_START); }
function parseDate(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function position(){
  var diff=Math.floor((today()-parseDate(startDate()))/86400000);
  if(diff<0) return {before:true, daysUntil:-diff, w:1, d:1};
  if(diff>=364) return {after:true, w:52, d:7};
  return {w:Math.floor(diff/7)+1, d:(diff%7)+1};
}
function fmtDate(dt){ return dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
function dateOf(w,d){ var s=parseDate(startDate()); return new Date(s.getFullYear(),s.getMonth(),s.getDate()+(w-1)*7+(d-1)); }

/* text */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md(s){ return esc(s).replace(/\*([^*\n]+)\*/g,'<em>$1</em>'); }
function paras(s){ return s.split(/\n\n+/).map(function(p){return '<p>'+md(p)+'</p>';}).join(''); }
function searchUrl(q){ return 'https://www.churchofjesuschrist.org/search?lang=eng&query='+encodeURIComponent(q); }
function week(n){ return WEEKS[n-1]; }
function tagLabel(t){ return t==='L1'?'Preach My Gospel lesson 1':t==='L2'?'Preach My Gospel lesson 2':t==='L3'?'Preach My Gospel lesson 3':''; }
function done(w,d){ return getEntry(w,d).trim().length>0; }
function weekDone(w){ var c=0; for(var i=1;i<=7;i++) if(done(w,i)) c++; return c; }
function totalDone(){ var c=0; for(var w=1;w<=52;w++) c+=weekDone(w); return c; }

/* render read items */
function isLinkable(ref){ return !/^(your |every |three of|one book|one d&c|a second|that one|the person)/i.test(ref); }
function readItem(r, w, d){
  if(typeof r==='string'){
    var m=r.match(/^([^(]+?)(\s*\((.*)\))?$/);
    var ref=m?m[1].trim():r, note=m&&m[3]?m[3]:'';
    var inner = isLinkable(ref) ? '<a class="ref" href="'+searchUrl(ref)+'" target="_blank" rel="noopener">'+esc(ref)+'</a>' : '<span class="ref">'+esc(ref)+'</span>';
    return '<li>'+inner+(note?'<span class="note">'+md(note)+'</span>':'')+'</li>';
  }
  if(r.journal){
    var jw=r.journal[0], jd=r.journal[1], e=getEntry(jw,jd), src=week(jw).days[jd-1];
    var who='Your Week '+jw+', Day '+jd+' entry';
    if(e.trim()) return '<li class="jrnl"><div class="who">'+who+'</div><div class="entry">'+esc(e)+'</div></li>';
    return '<li class="jrnl"><div class="who">'+who+'</div><div class="miss">You skipped that one. The prompt was: <em>'+md(src.journal)+'</em> <a href="#/w/'+jw+'/d/'+jd+'">Go answer it</a></div></li>';
  }
  if(r.talk){
    var url=r.url||searchUrl('"'+r.talk+'" '+r.speaker);
    var meta=esc(r.speaker)+', '+esc(r.date)+' general conference';
    return '<li class="talk"><a class="ref" href="'+url+'" target="_blank" rel="noopener">'+esc(r.talk)+'</a><span class="note">'+meta+(r.section?'. '+md(r.section):'')+(r.note?' '+md(r.note):'')+'</span></li>';
  }
  return '';
}

/* views */
var app=document.getElementById('app'), navEl=document.getElementById('nav');
function nav(cur){
  var items=[['#/','Today'],['#/week','This week'],['#/questions','All 52'],['#/journal','Journal'],['#/settings','Settings']];
  navEl.innerHTML='<a class="brand" href="#/">Study Better</a>'+items.map(function(i){return '<a href="'+i[0]+'"'+(cur===i[1]?' class="on"':'')+'>'+i[1]+'</a>';}).join('');
}
function setView(html,title){ app.innerHTML='<div class="fade">'+html+'</div>'; document.title=(title?title+' · ':'')+'Study Better'; window.scrollTo(0,0); }

function firstRun(){
  return '<h1 class="q">A year of one question a week.</h1>'+
  '<div class="prose"><p>Ten minutes a day. One hard question every week. Seven days to work it out: what the scripture says, what it meant, what the Restoration adds, what prophets are saying now, the hard part, how to live it, and what you believe.</p><p>Your journal stays on this device. Nobody else can see it, including the person who built this.</p></div>'+
  '<label class="f" for="nm">Your name</label><input type="text" id="nm" placeholder="First name" autocomplete="off">'+
  '<div class="row"><button class="btn" id="go">Start</button></div>';
}

function viewToday(){
  nav('Today');
  if(!me()){ setView(firstRun(),'Welcome'); document.getElementById('go').onclick=function(){ var n=document.getElementById('nm').value.trim(); if(!n) return; var p=people(); if(p.indexOf(n)<0) p.push(n); lsSet('people',p); lsSet('me',n); route(); }; return; }
  var pos=position();
  if(pos.before){
    var s=parseDate(startDate());
    setView('<p class="kicker">Hi '+esc(me())+'</p><h1 class="q">The program starts '+fmtDate(s)+'.</h1><div class="prose"><p>That\u2019s '+pos.daysUntil+' day'+(pos.daysUntil===1?'':'s')+' from now. You can read ahead from the <a href="#/questions">list of all 52 questions</a>, or change the start date in <a href="#/settings">Settings</a> if you\u2019re testing.</p></div>'+arcHtml(),'Not started');
    return;
  }
  viewDay(pos.w,pos.d,true);
  if(backupDue()){ var fd=app.querySelector('.fade'); if(fd){ var bp=document.createElement('p'); bp.className='help'; bp.style.marginTop='28px'; bp.innerHTML='It\u2019s been a while since you backed up your notes. <a href="#/settings">Save a backup</a>'; fd.appendChild(bp); } }
}
function arcHtml(){ return '<h3 class="sec">Every week follows the same seven days</h3><ol class="arc">'+ARC.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ol>'; }

function viewDay(w,d,isToday){
  var W=week(w), D=W.days[d-1]; if(!W||!D){ location.hash='#/'; return; }
  if(!isToday) nav('');
  var pos=position(), reallyToday=!pos.before&&!pos.after&&pos.w===w&&pos.d===d;
  var h='';
  h+='<p class="kicker">'+(reallyToday?'Today, ':'')+fmtDate(dateOf(w,d))+' &nbsp;·&nbsp; <a href="#/week/'+w+'">Week '+w+'</a>, Day '+d+' of 7'+(W.tag?'<span class="tag">'+tagLabel(W.tag)+'</span>':'')+'</p>';
  h+='<h1 class="q">'+md(W.question)+'</h1>';
  if(d===1) h+='<div class="weekintro">'+paras(W.intro)+'</div>';
  if(W.placeholder){
    var t=lsGet(talkKey(w),'');
    h+='<div class="notice warn"><strong>'+esc(W.placeholder)+'.</strong> This week you pick the talk. '+(t?'You picked: <em>'+esc(t)+'</em>.':'Write the speaker and title here so it shows up all week.')+'<label class="f" for="tk">My talk</label><input type="text" id="tk" value="'+esc(t)+'" placeholder="Speaker, title"><div class="row"><button class="btn quiet" id="tksave">Save talk</button></div></div>';
  }
  h+='<h2 class="dq">Day '+d+': '+md(D.q)+'</h2>';
  h+='<div class="prose">'+paras(D.intro)+'</div>';
  h+='<h3 class="sec">Read</h3><ul class="read">'+D.read.map(function(r){return readItem(r,w,d);}).join('')+'</ul>';
  if(D.takeaway) h+='<h3 class="sec">Key takeaway</h3><div class="takeaway">'+paras(D.takeaway)+'</div>';
  h+='<h3 class="sec">Journal</h3><p class="jprompt">'+md(D.journal)+'</p>';
  h+='<textarea id="jt" placeholder="Write it here. Only you can see this.">'+esc(getEntry(w,d))+'</textarea>';
  h+='<div class="row"><button class="btn" id="jsave">Save entry</button><span class="status" id="jstat">'+(done(w,d)?'Saved':'')+'</span></div>';
  var prev=d>1?'#/w/'+w+'/d/'+(d-1):(w>1?'#/w/'+(w-1)+'/d/7':''), next=d<7?'#/w/'+w+'/d/'+(d+1):(w<52?'#/w/'+(w+1)+'/d/1':'');
  h+='<div class="pager"><span>'+(prev?'<a href="'+prev+'">Previous day</a>':'')+'</span><span>'+(next?'<a href="'+next+'">Next day</a>':'')+'</span></div>';
  setView(h,'Week '+w+' Day '+d);
  var ta=document.getElementById('jt'), st=document.getElementById('jstat');
  document.getElementById('jsave').onclick=function(){ var ok=setEntry(w,d,ta.value); st.textContent=ok?'Saved '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'Could not save. Your browser is blocking storage.'; };
  ta.addEventListener('input',function(){ st.textContent='Unsaved changes'; });
  var tks=document.getElementById('tksave'); if(tks) tks.onclick=function(){ lsSet(talkKey(w),document.getElementById('tk').value.trim()); viewDay(w,d,isToday); };
}

function viewWeek(w){
  nav('This week');
  var W=week(w); if(!W){ location.hash='#/'; return; }
  var pos=position();
  var h='<p class="kicker">Week '+w+' of 52 &nbsp;·&nbsp; '+fmtDate(dateOf(w,1))+(W.tag?'<span class="tag">'+tagLabel(W.tag)+'</span>':'')+'</p>';
  h+='<h1 class="q">'+md(W.question)+'</h1><div class="weekintro">'+paras(W.intro)+'</div>';
  h+='<h3 class="sec">Seven days</h3><ul class="days">'+W.days.map(function(D,i){ var d=i+1, cur=!pos.before&&!pos.after&&pos.w===w&&pos.d===d;
    return '<li><span class="n">'+d+'</span><a class="t" href="#/w/'+w+'/d/'+d+'">'+md(D.q)+'</a><span>'+(done(w,d)?'<span class="done">Done</span>':(cur?'<span class="today">Today</span>':''))+'</span></li>'; }).join('')+'</ul>';
  h+='<div class="pager"><span>'+(w>1?'<a href="#/week/'+(w-1)+'">Week '+(w-1)+'</a>':'')+'</span><span>'+(w<52?'<a href="#/week/'+(w+1)+'">Week '+(w+1)+'</a>':'')+'</span></div>';
  setView(h,'Week '+w);
}

function viewQuestions(){
  nav('All 52');
  var pos=position(), t=totalDone();
  var h='<h1 class="q">All 52 questions.</h1><p class="prog">'+t+' of 364 sessions done. Jump anywhere; the program doesn\u2019t care what day it is.</p>';
  h+='<ul class="qlist">'+WEEKS.map(function(W){ var cur=!pos.before&&!pos.after&&pos.w===W.n; var c=weekDone(W.n);
    return '<li'+(cur?' class="cur"':'')+'><span class="n">'+W.n+'</span><span><a href="#/week/'+W.n+'">'+md(W.question)+'</a><span class="meta">'+fmtDate(dateOf(W.n,1)).replace(/^\w+, /,'')+(W.tag?' · '+tagLabel(W.tag):'')+(c?' · '+c+'/7 done':'')+'</span></span></li>'; }).join('')+'</ul>';
  setView(h,'All 52');
}

function viewJournal(){
  nav('Journal');
  var h='<h1 class="q">'+(me()?esc(me())+'\u2019s journal.':'Journal.')+'</h1>';
  h+='<p class="help">Everything you\u2019ve written, newest first. It lives in this browser on this device only. Clearing your browser data erases it, so copy it out now and then.</p>';
  var entries=[];
  for(var w=52;w>=1;w--) for(var d=7;d>=1;d--) if(done(w,d)) entries.push([w,d]);
  if(!entries.length) h+='<div class="notice">Nothing yet. Your first entry is waiting on <a href="#/">today\u2019s page</a>.</div>';
  else{
    h+='<div class="row"><button class="btn quiet" id="exp">Show as plain text to copy</button></div><div id="expbox"></div>';
    h+=entries.map(function(e){ var W=week(e[0]),D=W.days[e[1]-1];
      return '<div class="jentry"><div class="h"><a href="#/w/'+e[0]+'/d/'+e[1]+'">Week '+e[0]+', Day '+e[1]+'</a> · '+fmtDate(dateOf(e[0],e[1])).replace(/^\w+, /,'')+'</div><div class="p">'+md(D.journal)+'</div><div class="e">'+esc(getEntry(e[0],e[1]))+'</div></div>'; }).join('');
  }
  setView(h,'Journal');
  var b=document.getElementById('exp'); if(b) b.onclick=function(){
    var txt=entries.slice().reverse().map(function(e){ var W=week(e[0]),D=W.days[e[1]-1]; return 'WEEK '+e[0]+', DAY '+e[1]+' ('+fmtDate(dateOf(e[0],e[1]))+')\n'+W.question+'\nPrompt: '+D.journal+'\n\n'+getEntry(e[0],e[1])+'\n\n'; }).join('----\n\n');
    document.getElementById('expbox').innerHTML='<textarea style="min-height:260px" readonly>'+esc(txt)+'</textarea><p class="help">Select all, copy, and paste it somewhere safe.</p>';
  };
}

function viewSettings(){
  nav('Settings');
  var p=people(), m=me();
  var h='<h1 class="q">Settings.</h1>';
  h+='<label class="f">Who\u2019s reading</label><div class="people" id="ppl">'+p.map(function(n){return '<button data-n="'+esc(n)+'"'+(n===m?' class="on"':'')+'>'+esc(n)+'</button>';}).join('')+'</div>';
  h+='<p class="help">Each person gets their own journal. Switching names switches journals. Nobody can read anyone else\u2019s entries, but anyone using this device can pick any name, so this is privacy by trust, not by lock.</p>';
  h+='<label class="f" for="newp">Add a person</label><input type="text" id="newp" placeholder="First name"><div class="row"><button class="btn quiet" id="addp">Add</button></div>';
  h+='<label class="f" for="sd">Program start date</label><input type="date" id="sd" value="'+esc(startDate())+'"><div class="row"><button class="btn quiet" id="sdsave">Save date</button><button class="btn quiet" id="sdreset">Reset to Jan 1, 2027</button></div>';
  h+='<p class="help">Today\u2019s page is figured from this date. Set it to today if you want to test from Week 1 right now. Day 1 of each week lands on the weekday you pick here.</p>';
  h+='<label class="f">Back up your notes</label><p class="help">Your notes only live on this device. If you clear your browser data or get a new phone, they\u2019re gone. Save a backup file every so often and keep it somewhere safe, like email or iCloud.</p><p class="help">Last backup: '+esc(lastBackupText())+'</p><div class="row bk"><button class="btn quiet" id="bksave">Save a backup</button><button class="btn quiet" id="bkload">Restore from a backup</button></div><input type="file" id="bkfile" accept="application/json,.json" hidden>';
  if(!isInstalled()) h+='<p class="help" style="margin-top:14px"><a href="#/install">Add this to your home screen</a></p>';
  h+='<label class="f" for="th">Theme</label><select id="th"><option value="">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select>';
  h+='<h3 class="sec">About</h3><p class="small">Fifty-two questions, seven days each, ten minutes a day. Sources: the New Testament, the Book of Mormon, the Doctrine and Covenants, the Old Testament and Pearl of Great Price, Preach My Gospel, and general conference. Scripture and talk links open a search on churchofjesuschrist.org.</p>'+arcHtml();
  setView(h,'Settings');
  document.getElementById('bksave').onclick=saveBackup;
  var bf=document.getElementById('bkfile');
  document.getElementById('bkload').onclick=function(){ bf.value=''; bf.click(); };
  bf.onchange=function(){ if(bf.files&&bf.files[0]) restoreBackup(bf.files[0]); };
  var th=document.getElementById('th'); th.value=lsGet('theme',''); th.onchange=function(){ lsSet('theme',th.value); applyTheme(); };
  document.getElementById('ppl').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; lsSet('me',b.getAttribute('data-n')); viewSettings(); };
  document.getElementById('addp').onclick=function(){ var n=document.getElementById('newp').value.trim(); if(!n) return; var pp=people(); if(pp.indexOf(n)<0) pp.push(n); lsSet('people',pp); lsSet('me',n); viewSettings(); };
  document.getElementById('sdsave').onclick=function(){ var v=document.getElementById('sd').value; if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ lsSet('start',v); viewSettings(); } };
  document.getElementById('sdreset').onclick=function(){ lsSet('start',DEFAULT_START); viewSettings(); };
}
function applyTheme(){ var t=lsGet('theme',''); if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }

/* install + backup */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; var slot=document.getElementById('instslot'); if(slot) fillInstallSlot(slot); });
window.addEventListener('appinstalled',function(){ deferredPrompt=null; if(document.getElementById('instslot')) setView('<h1 class="q">Installed.</h1><div class="prose"><p>Open Study Better from your home screen or app list. You can close this tab.</p></div>','Installed'); });
function isInstalled(){ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }
function platform(){ var ua=navigator.userAgent||''; if(/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) return 'ios'; if(/Android/i.test(ua)) return 'android'; return 'desktop'; }
function fillInstallSlot(slot){ if(!deferredPrompt) return; slot.innerHTML='<div class="row"><button class="btn" id="instbtn">Install</button></div>'; document.getElementById('instbtn').onclick=function(){ var e=deferredPrompt; if(!e) return; e.prompt(); e.userChoice.then(function(){ deferredPrompt=null; }); }; }
function installSteps(pl){
  if(pl==='ios') return '<h3 class="sec">On iPhone or iPad</h3><ol class="arc"><li>Tap the Share button (the square with the arrow).</li><li>Scroll down and tap Add to Home Screen.</li><li>Tap Add.</li><li>Close this tab and open Study Better from your home screen.</li></ol><p class="help">Don\u2019t see Add to Home Screen? You\u2019re probably inside another app\u2019s browser. Tap the three dots (or the Safari icon) and choose Open in Safari, then try again.</p>';
  if(pl==='android') return '<h3 class="sec">On Android</h3><ol class="arc"><li>Tap the menu (three dots) in Chrome.</li><li>Tap Add to Home screen or Install app.</li><li>Open Study Better from your home screen.</li></ol><p class="help">Don\u2019t see it? Tap the three dots and choose Open in Chrome, then try again.</p>';
  return '<h3 class="sec">On a computer</h3><div class="prose"><p>In Chrome or Edge, click the install icon at the right end of the address bar. In Safari on a Mac, choose File, then Add to Dock.</p></div>';
}
function viewInstall(gate){
  if(gate){ navEl.innerHTML='<span class="brand">Study Better</span>'; } else nav('');
  if(isInstalled()){
    setView('<h1 class="q">You\u2019re all set.</h1><div class="prose"><p>Study Better is already on your home screen, and you\u2019re using it from there.</p></div><div class="row"><a class="btn" href="#/">Go to today</a></div>','Add to home screen');
    return;
  }
  var pl=platform(), others=['ios','android','desktop'].filter(function(x){return x!==pl;});
  var h='<div class="inst"><h1 class="q">Add this to your home screen first.</h1>';
  h+='<div class="prose"><p>This works like an app. Adding it to your home screen gives you an icon, lets it work offline, and keeps your notes safe if you miss a stretch of days. It takes about 10 seconds.</p></div>';
  h+='<div id="instslot"></div>';
  h+=installSteps(pl);
  h+='<p class="notice warn">Start your notes after you add it. Notes written here in the browser won\u2019t show up in the home screen version.</p>';
  if(gate) h+='<button class="linkbtn" id="skip">Keep using it in the browser</button>';
  h+='<details class="other"><summary>Using a different device?</summary>'+others.map(installSteps).join('')+'</details></div>';
  setView(h,'Add to home screen');
  fillInstallSlot(document.getElementById('instslot'));
  var sk=document.getElementById('skip');
  if(sk) sk.onclick=function(){ lsSet('installSkip',true); if(location.hash&&location.hash!=='#/'&&location.hash.indexOf('#/install')!==0){ route(); } else if(location.hash.indexOf('#/install')===0){ location.hash='#/'; } else route(); };
}
function hasNotes(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&(k.indexOf(LS+'j.')===0||k.indexOf(LS+'talk.')===0)){ var v=localStorage.getItem(k); if(v&&v!=='""') return true; } } }catch(e){} return false; }
function backupDue(){ if(!hasNotes()) return false; var lb=lsGet('lastBackup',''); if(!lb) return true; return (Date.now()-new Date(lb).getTime())>30*864e5; }
function backupName(){ var d=new Date(), z=function(n){return (n<10?'0':'')+n;}; return 'study-better-backup-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json'; }
function buildBackup(){ var data={}; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf(LS)===0&&k!==LS+'lastBackup') data[k]=localStorage.getItem(k); } return JSON.stringify({app:'study-better',version:1,exported:new Date().toISOString(),data:data},null,1); }
function markBackedUp(){ lsSet('lastBackup',new Date().toISOString()); if((location.hash||'').indexOf('#/settings')===0) viewSettings(); }
function downloadBackup(json,name){ var blob=new Blob([json],{type:'application/json'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1000); markBackedUp(); }
function saveBackup(){
  var json=buildBackup(), name=backupName(), file=null;
  try{ file=new File([json],name,{type:'application/json'}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Study Better backup'}).then(markBackedUp).catch(function(err){ if(!err||err.name!=='AbortError') downloadBackup(json,name); });
  } else downloadBackup(json,name);
}
function restoreBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var o=null; try{ o=JSON.parse(r.result); }catch(e){}
    var ok=o&&o.app==='study-better'&&o.data&&typeof o.data==='object'&&!Array.isArray(o.data)&&Object.keys(o.data).every(function(k){ return k.indexOf(LS)===0&&typeof o.data[k]==='string'; });
    if(!ok){ alert('That file isn\u2019t a backup from Study Better.'); return; }
    if(!confirm('This will replace the notes on this device with the ones in the backup. Continue?')) return;
    try{ Object.keys(o.data).forEach(function(k){ localStorage.setItem(k,o.data[k]); }); }catch(e){ alert('Couldn\u2019t restore. Your device may be out of storage space.'); return; }
    location.reload();
  };
  r.readAsText(file);
}
function lastBackupText(){ var lb=lsGet('lastBackup',''); return lb? new Date(lb).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}) : 'never'; }

function route(){
  var h=location.hash||'#/', m;
  if(h.indexOf('#/install')===0) return viewInstall(false);
  if(!isInstalled() && !lsGet('installSkip',false)) return viewInstall(true);
  if(m=h.match(/^#\/w\/(\d+)\/d\/(\d+)/)) return viewDay(+m[1],+m[2],false);
  if(m=h.match(/^#\/week(?:\/(\d+))?/)) { var w=m[1]?+m[1]:position().w; return viewWeek(w); }
  if(h.indexOf('#/questions')===0) return viewQuestions();
  if(h.indexOf('#/journal')===0) return viewJournal();
  if(h.indexOf('#/settings')===0) return viewSettings();
  return viewToday();
}
applyTheme();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
if(isInstalled()&&navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
