<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Better">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191C" media="(prefers-color-scheme: dark)">
<title>Study Better: weekly study guide</title>
<style>
:root{
  --bg:#FAFAF7; --ink:#22262A; --muted:#6B7078; --line:#DCDCD5; --soft:#EFEFE9;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --warn:#8A5A1B;
  --serif:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191C; --ink:#E8E6E0; --muted:#9AA0A8; --line:#2E343A; --soft:#1E2428;
    --accent:#8CC9B2; --accent-ink:#0F1A16; --warn:#D9A65A;
  }
}
:root[data-theme="dark"]{
  --bg:#15191C; --ink:#E8E6E0; --muted:#9AA0A8; --line:#2E343A; --soft:#1E2428;
  --accent:#8CC9B2; --accent-ink:#0F1A16; --warn:#D9A65A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;background:var(--bg);color:var(--ink);}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 80px;}

/* top nav */
.nav{display:flex;gap:18px;align-items:baseline;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap;}
.nav .brand{font-family:var(--serif);font-size:20px;font-weight:600;margin-right:auto;color:var(--ink);}
.nav a{color:var(--muted);font-size:14px;font-weight:500;}
.nav a.on{color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:2px;}

/* type */
.kicker{font-size:14px;color:var(--muted);margin:0 0 10px;}
.kicker a{color:var(--muted);}
h1.q{font-family:var(--serif);font-weight:700;font-size:clamp(30px,6.4vw,42px);line-height:1.12;letter-spacing:-0.01em;margin:0 0 14px;}
h2.dq{font-family:var(--serif);font-style:normal;font-weight:600;font-size:clamp(22px,4.6vw,27px);line-height:1.25;margin:34px 0 12px;color:var(--ink);}
.prose{font-family:var(--serif);font-size:18px;line-height:1.6;}
.prose p{margin:0 0 1em;}
.prose em{font-style:italic;}
h3.sec{font-size:13px;font-weight:600;color:var(--muted);margin:30px 0 10px;letter-spacing:.01em;}
.weekintro{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink);margin:0 0 6px;}

/* read list */
.read{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.read li{padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.45;}
.read li .ref{font-weight:500;}
.read li .note{color:var(--muted);display:block;font-size:14px;margin-top:2px;}
.read li.talk .ref{font-family:var(--serif);font-size:18px;}
.read li.jrnl{background:var(--soft);padding:12px 14px;border-radius:4px;border-bottom:0;margin:6px 0;}
.read li.jrnl .who{font-size:13px;color:var(--muted);margin-bottom:6px;}
.read li.jrnl .entry{font-family:var(--serif);font-size:17px;white-space:pre-wrap;}
.read li.jrnl .miss{color:var(--muted);font-size:15px;}
.read li.jrnl .miss a{font-weight:500;}
.takeaway{font-family:var(--serif);font-size:18px;line-height:1.5;border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:8px 0 0;}
.takeaway p{margin:0 0 .8em;} .takeaway p:last-child{margin:0;}

/* journal */
.jprompt{font-family:var(--serif);font-size:19px;line-height:1.5;margin:0 0 12px;}
textarea{width:100%;min-height:150px;font-family:var(--serif);font-size:18px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical;}
textarea:focus{border-color:var(--accent);}
.row{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:4px;font-weight:600;font-size:15px;}
.btn.quiet{background:var(--soft);color:var(--ink);}
.status{font-size:14px;color:var(--muted);}
.pager{display:flex;justify-content:space-between;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:15px;gap:12px;}

/* week + list */
.days{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);}
.days li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);}
.days .n{color:var(--muted);font-size:14px;}
.days .t{font-family:var(--serif);font-size:18px;}
.days .done{font-size:12px;color:var(--accent);font-weight:600;}
.days .today{font-size:12px;color:var(--muted);}
.qlist{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);}
.qlist li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline;}
.qlist .n{color:var(--muted);font-size:14px;}
.qlist a{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.3;}
.qlist .meta{display:block;font-size:13px;color:var(--muted);margin-top:3px;font-family:var(--sans);}
.qlist li.cur a{color:var(--accent);}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:2px;font-family:var(--sans);}
.prog{font-size:14px;color:var(--muted);margin:6px 0 22px;}

/* settings + forms */
label.f{display:block;font-size:14px;font-weight:500;margin:18px 0 6px;}
input[type=text],input[type=date],select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%;max-width:340px;}
.help{font-size:14px;color:var(--muted);margin:6px 0 0;line-height:1.45;}
.notice{background:var(--soft);padding:14px 16px;border-radius:4px;font-size:15px;line-height:1.5;margin:0 0 24px;}
.notice.warn{border-left:3px solid var(--warn);}
.people{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.people button{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;}
.people button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.jentry{padding:14px 0;border-bottom:1px solid var(--line);}
.jentry .h{font-size:14px;color:var(--muted);margin-bottom:4px;} .jentry .h a{color:var(--muted);font-weight:500;}
.jentry .p{font-family:var(--serif);font-size:16px;color:var(--muted);margin-bottom:6px;}
.jentry .e{font-family:var(--serif);font-size:18px;white-space:pre-wrap;}
.arc{list-style:none;padding:0;margin:14px 0 0;counter-reset:d;}
.arc li{font-family:var(--serif);font-size:17px;padding:5px 0 5px 34px;position:relative;}
.arc li::before{counter-increment:d;content:counter(d);position:absolute;left:0;color:var(--muted);font-family:var(--sans);font-size:13px;top:9px;}
.small{font-size:14px;color:var(--muted);}
.inst h3.sec{margin-top:26px;}
.inst .notice{margin-top:22px;}
.inst .arc li{font-size:18px;}
details.other{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;}
details.other summary{cursor:pointer;font-size:15px;color:var(--accent);font-weight:500;}
.linkbtn{color:var(--accent);font-size:15px;font-weight:500;padding:10px 0;}
.bk{margin-top:4px;}
@media (prefers-reduced-motion: no-preference){ .fade{animation:fade .25s ease-out;} @keyframes fade{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" id="nav"></nav>
  <main id="app"></main>
</div>
<script type="application/json" id="data">[{"n": 1, "tag": "L1", "question": "What was God doing in the 400 years before Jesus was born?", "intro": "The Old Testament ends with Malachi around 430 BC. The New Testament picks up around 6 BC. In between? Nothing. No prophet, no new scripture, no voice from heaven in Jerusalem. People call it \"the silent years.\" So was God actually silent? And what does that tell you about the quiet stretches in your own life?", "days": [{"q": "What's the last thing God said, and the first thing He said next?", "intro": "Read the last words of the Old Testament, then the first thing that happens in the New. Four hundred years apart. Pay attention to what Malachi promises and what Zacharias gets told. They're talking about the same thing. Then flip back to Exodus. Israel waited in Egypt for 430 years before God \"remembered\" them. Same number. Nobody notices that.", "read": ["Malachi 4:5-6", "Luke 1:5-13, 18-20", "Exodus 2:23-25", "Exodus 12:40-41"], "journal": "The angel tells Zacharias \"thy prayer is heard.\" He'd been praying a long time. What have you been praying about long enough that you've started wondering if anyone's listening?"}, {"q": "What was it like to live in the gap?", "intro": "The people in Luke 1 and 2 weren't sitting in a bubble. Persia ran things, then Greece, then Rome. Synagogues, Pharisees, and Sadducees all showed up during this stretch. So did the Greek Old Testament the Apostles quoted from later. Now look at Simeon and Anna. Everybody else moved on. They kept showing up.", "read": ["Luke 2:25-38", "Habakkuk 2:1-3 (a prophet in the gap being told \"though it tarry, wait for it\")", "Daniel 2:44", "Bible Dictionary, \"Synagogue\""], "journal": "Simeon and Anna waited in the temple for decades. What do you think kept them coming back?"}, {"q": "Was God silent *everywhere*?", "intro": "Here's where the Restoration flips the question. While Jerusalem heard nothing, God was talking constantly on another continent. Samuel the Lamanite gave the exact sign. Nephi got a direct answer the night before it happened. The \"silence\" was a Jerusalem problem, not a God problem.", "read": ["Helaman 14:1-8", "3 Nephi 1:4-15", "1 Nephi 10:4-6"], "journal": "Does it change anything for you to know God was speaking somewhere else the whole time? Why or why not?"}, {"q": "What do prophets say about waiting on God?", "intro": "Here's what we got: President Dieter F. Uchtdorf gave an awesome talk on this back in 2010. Read it. He tells us what waiting is supposed to look like.", "read": [{"talk": "Continue in Patience", "speaker": "Dieter F. Uchtdorf", "date": "April 2010", "section": "Start at the marshmallow experiment and read through his definition of patience."}], "takeaway": "His point is that patience isn't passive. We're supposed to *actively* wait. Do everything we can while the answer is delayed. He said \"Patience is not passive resignation, nor is it failing to act because of our fears.\" He teaches that this is what turns regular people into real disciples.", "journal": "Where in your life are you \"waiting\" when you should be doing more?"}, {"q": "Why would God go quiet for so long?", "intro": "This is uncomfortable, but let it sit with you. If God loves His children, why would He let 400 years go by without a prophet? It's easy to say \"the people rejected Him,\" but you don't believe there were *zero* good people on the earth, do you? Joseph Smith asked the same thing from a jail cell: \"O God, where art thou?\" He didn't get scolded for asking. Now, don't answer the question yet. Read the stuff below and let your mind chew on it.", "read": ["D&C 121:1-8", "D&C 122:7-9", "Isaiah 55:8-9", "Helaman 12:1-6"], "journal": "Have you had a stretch where God felt silent? Looking back now, was He?"}, {"q": "How do you wait? How *should* you wait?", "intro": "Waiting sucks sometimes, mostly because we often just sit there. When you do something while waiting, it's not nearly as bad. Same thing with life. Waiting on God is easier when we're actively doing good.\n\nTwo stories today: Joseph got thrown in prison for doing the right thing, ran the prison well anyway, was forgotten for two more years by the dude he helped, and was still ready when the call came. Alma's people were in bondage and God didn't free them. They had to stay in bondage and finally God made their burdens light, but they were still waiting to be freed.\n\nWhen you read, pick out what people are doing while they wait on the Lord.", "read": ["Genesis 39:20-23", "Genesis 40:23 and 41:1", "Genesis 41:14-16", "Mosiah 24:13-16", "Preach My Gospel, chapter 6, \"Patience\""], "journal": "Pick one thing you've been waiting on. What can you do this week that helps you actively wait for it? Don't be a wuss, pick something real and write it down."}, {"q": "What do I believe now?", "intro": "Go back to the beginning. Read the angel's words to Zacharias with the whole week behind you.", "read": ["Luke 1:13-17", {"journal": [1, 1]}], "journal": "Answer the week's question in three or four sentences: What was God doing in the 400 years before Jesus was born? And what's He doing in the quiet parts of your life?"}]}, {"n": 2, "tag": "L3", "question": "Why did Jesus have to be baptized?", "intro": "John the Baptist asked this first. He actually tried to talk Jesus out of it. Baptism is for the forgiveness of sins. Jesus had none. So what was the point? The answer says a lot about what baptism really is, and about what you're doing every Sunday when you take the sacrament.", "days": [{"q": "What actually happened at the Jordan?", "intro": "Four writers, four angles. Read them back to back. Notice what each one includes that the others skip. Notice John's objection and what Jesus says back.", "read": ["Matthew 3:13-17", "Mark 1:9-11", "Luke 3:21-22", "John 1:29-34"], "journal": "Before this week, what would you have said if someone asked why Jesus got baptized? Write it down. We'll check it on Day 7."}, {"q": "What does \"fulfil all righteousness\" even mean?", "intro": "Jesus gives John a one-line reason and it's kind of cryptic. Two things help. The Greek word behind \"baptize\" (baptizo) means to dip or dunk. And \"righteousness\" here doesn't mean sinless. It means doing what the Father asks. Read what John was doing before Jesus showed up, so you know what baptism meant to the people standing on the riverbank.", "read": ["Matthew 3:1-12", "Matthew 3:15 again, slowly", "Bible Dictionary, \"Baptism\""], "journal": "If \"righteousness\" means doing what the Father asks, not being flawless, what does that do to the word for you?"}, {"q": "Who answered this 600 years early?", "intro": "Nephi asks this exact question, almost word for word, and then answers it. He's on the other side of the world and six centuries early. Read him first. Then read how the Lord defines baptism in our day.", "read": ["2 Nephi 31:4-13", "D&C 20:37", "D&C 20:72-74"], "journal": "Nephi gives several reasons. Which one had you never thought about?"}, {"q": "What do apostles say baptism actually is?", "intro": "Elder Robert D. Hales gave this talk after two years of surgeries kept him out of conference. He came back and spent his whole time on what our baptism commits us to. Read it.", "read": [{"talk": "The Covenant of Baptism: To Be in the Kingdom and of the Kingdom", "speaker": "Robert D. Hales", "date": "October 2000", "section": "Read the section on what we promise at baptism."}], "takeaway": "Baptism is the doorway into God's kingdom, and when you walk through it you're picking a side. He said \"At that point we have chosen to be of His kingdom and not of the world.\" You're not just *in* the kingdom. You're *of* it.", "journal": "Do you think of yourself as \"in\" the kingdom, \"of\" the kingdom, or both? What's the difference?"}, {"q": "If Jesus didn't need it, is baptism about need or about following?", "intro": "Here's the hard part. If a sinless person still gets baptized, then baptism can't only be about washing sin away. Fine. But if it's required of *everyone*, what about the billions of people who never got the chance? Little kids? People born 1,000 years before Christ in the middle of nowhere? The Restoration has answers, but don't skip to them. Read these as answers to a real problem.", "read": ["Moroni 8:8-12", "1 Corinthians 15:29", "D&C 138:29-35"], "journal": "What's the hardest part of \"baptism is required\" for you? Be honest. Nobody's reading this but you."}, {"q": "What does a baptized person actually do differently?", "intro": "Alma at the waters of Mormon gives the clearest description in scripture of what the covenant looks like Monday through Saturday. Then the sacrament prayer, which is you standing back in the Jordan every week. Read them together and pick out the promises.", "read": ["Mosiah 18:8-10", "D&C 20:77", "Preach My Gospel, lesson 3, \"Baptism, Our First Covenant\""], "journal": "Next Sunday, what would it look like to take the sacrament like you were getting baptized again? Pick one thing you'd do differently."}, {"q": "What do I believe now?", "intro": "Back to John's objection and what Jesus told him. Then read what you wrote on Day 1.", "read": ["Matthew 3:13-17", {"journal": [2, 1]}], "journal": "Answer the week's question in three or four sentences: Why did Jesus have to be baptized? And why did you?"}]}, {"n": 3, "tag": "", "question": "Why did Jesus fast for 40 days before doing anything else?", "intro": "Before a single sermon, miracle, or disciple, Jesus went into the desert alone and didn't eat for 40 days. It's the *first* thing He does after baptism. If fasting matters that much, why does it feel like a chore once a month?", "days": [{"q": "What actually happened in the wilderness?", "intro": "Read Matthew and Luke. Then read the Joseph Smith Translation change to the first verse. It flips the reason He went out there. And watch how Jesus answers every temptation. Same move, three times.", "read": ["Matthew 4:1-11", "Luke 4:1-13", "Joseph Smith Translation, Matthew 4:1 (in the footnote)"], "journal": "The JST says the Spirit led Him there \"to be with God.\" When was the last time you went somewhere just to be with God? Not to church. Somewhere on purpose."}, {"q": "Why 40, and why the desert?", "intro": "Forty shows up all over scripture. Moses on the mountain. Israel in the wilderness. Elijah walking to Horeb. It's the number for \"long enough to be changed.\" And here's the part most people miss: every scripture Jesus throws back at Satan comes from one chapter in Deuteronomy about Israel's own 40 years. He was fasting inside a story He already knew.", "read": ["Exodus 34:28", "1 Kings 19:4-8", "Deuteronomy 8:2-3 (this is what Jesus quotes)"], "journal": "Moses, Elijah, and Jesus all went without food before something big. What's the connection between going without and being ready?"}, {"q": "What does the Book of Mormon say fasting actually does?", "intro": "The Book of Mormon treats fasting like a tool, not a checkbox. The sons of Mosiah fasted and became teachers who could actually teach. Alma's church fasted for people by name. When you read, look for the results. What did fasting *get* them?", "read": ["Alma 17:2-3", "Helaman 3:35", "Alma 6:6", "D&C 59:13-14"], "journal": "Alma 17:3 says they fasted and prayed much and it gave them something specific. What was it? Have you ever fasted for that?"}, {"q": "What do prophets say fasting is for?", "intro": "President Henry B. Eyring, April 2015. He spends the talk on the law of the fast, and specifically on the half we skip: the offering.", "read": [{"talk": "Is Not This the Fast That I Have Chosen?", "speaker": "Henry B. Eyring", "date": "April 2015", "section": "Read the opening through the Isaiah 58 section."}], "takeaway": "Fasting is a commandment simple enough for a kid, with real promises attached. And the offering is what turns your hunger into somebody else's meal. He called it \"a commandment so simple that a child can understand it.\" Simple isn't the same as small.", "journal": "When's the last time you fasted for something specific *and* gave a real offering with it? What happened?"}, {"q": "Does skipping food actually do anything?", "intro": "Honest question. Is fasting a spiritual tool, or a ritual we keep because we always have? If you've ever fasted, gotten a headache, and felt nothing else, you've asked this. Isaiah 58 is God answering people who asked the same thing. Read it as a rebuke and a promise, because it's both.", "read": ["Isaiah 58:3-11", "Matthew 6:16-18"], "journal": "Isaiah describes a fast God rejects and a fast He chooses. Which one is closer to your usual fast Sunday? No spin. Just look at it."}, {"q": "How do you fast with a purpose?", "intro": "A fast with no purpose is just hunger. Every time scripture talks about fasting, it pairs it with prayer and a specific reason. A question, a person, a need. Alma tells us straight how he came to know what he knows. Read him and figure out what his fast had that yours usually doesn't.", "read": ["Alma 5:45-46", "Omni 1:26", "Preach My Gospel, lesson 4, \"The Law of the Fast\""], "journal": "If you decided right now, what's the one thing you'd fast for next fast Sunday? Write it down so you can't pretend you forgot."}, {"q": "What do I believe now?", "intro": "Back to the desert.", "read": ["Matthew 4:1-4"], "journal": "Answer the week's question in three or four sentences: Why did Jesus fast before He started? What is fasting actually for?"}]}, {"n": 4, "tag": "", "question": "\"Be ye therefore perfect.\" What was Jesus actually asking?", "intro": "It's the last line of a chapter that's already hard, and it reads like an impossible bar. Most of us hear \"perfect,\" think \"flawless,\" and quietly give up. But that's probably not the word Jesus used. This week is about finding out what He actually meant, and what you're supposed to do about it.", "days": [{"q": "What does the verse say, and what's around it?", "intro": "Read the whole passage, not just the last line. Jesus is talking about loving your enemies when He says it. That's the context. Then read the same sermon when the resurrected Christ gives it in the Book of Mormon. He changes one word. Find it.", "read": ["Matthew 5:43-48", "3 Nephi 12:43-48"], "journal": "What does \"perfect\" mean to you right now, before this week starts? Write it down so you can compare on Day 7."}, {"q": "What word did Jesus actually use?", "intro": "The Greek word is *teleios*. It means complete, finished, mature, having reached its purpose. Not flawless. A full-grown oak is teleios compared to an acorn. Read the other places the New Testament uses the same word and watch what happens to the meaning.", "read": ["Hebrews 5:8-9 (Jesus \"being made perfect\")", "Ephesians 4:11-13", "James 1:2-4", "Footnote on Matthew 5:48"], "journal": "If Jesus had said \"be ye therefore *complete*,\" what changes about the ask?"}, {"q": "Who does the completing?", "intro": "The Restoration answers the \"how\" question head on. Read these and look for who's doing the perfecting in each verse. Spoiler: it's not you.", "read": ["Moroni 10:32-33", "D&C 67:13", "D&C 76:69", "2 Nephi 25:23"], "journal": "Moroni says \"come unto Christ, and be perfected in him.\" What's your part of that sentence, and what's His?"}, {"q": "What are apostles saying about this right now?", "intro": "Two talks. Elder Jeffrey R. Holland's is the one everybody quotes, and he built it on a word study President Russell M. Nelson did back in 1995. Read Holland's first. If you've got time left, skim Nelson's part on the Greek.", "read": [{"talk": "Be Ye Therefore Perfect—Eventually", "speaker": "Jeffrey R. Holland", "date": "October 2017", "section": "Read the opening through the Tolstoy story.", "url": "https://www.churchofjesuschrist.org/study/general-conference/2017/10/be-ye-therefore-perfect-eventually?lang=eng"}, {"talk": "Perfection Pending", "speaker": "Russell M. Nelson", "date": "October 1995", "section": "The section on teleios."}], "takeaway": "Holland's point is that the commandment is about your potential, not your report card, and turning it into self-loathing gets it exactly backwards. He said \"except for Jesus, there have been no flawless performances on this earthly journey.\" He calls the other thing toxic perfectionism, and he's not being cute about it.\n\nNelson's point is that the word means finished or complete, and scripture uses that same word about Jesus Himself reaching it *after* the Resurrection. Perfection is pending. For everyone.", "journal": "Write down one sentence from either talk you want to keep."}, {"q": "If God does the perfecting, why does Jesus command it?", "intro": "Here's the tension. Day 3 said Christ perfects us. But Matthew 5:48 is a command, and commands mean you're supposed to do something. Both are true. So how? Read the parable Holland uses and pay attention to what the forgiven servant was expected to do afterward. Then read Paul, both halves of the verse.", "read": ["Matthew 18:21-35", "Philippians 2:12-13", "Ether 12:27"], "journal": "Where in your life are you trying to be finished with something God isn't finished with yet?"}, {"q": "What does steady improvement actually look like?", "intro": "Not a leap. A pace. King Benjamin says it flat out: don't run faster than you have strength. Amulek says now is the time, but the time is for *preparing*, not arriving. When you read, look for the pattern.", "read": ["Mosiah 4:27", "Alma 34:32-33", "Alma 37:6-7", "Preach My Gospel, chapter 6, \"Developing Christlike Attributes\" intro and the attribute activity"], "journal": "Pick one attribute from PMG chapter 6. What's one small thing this week that moves you toward it? Small on purpose. Then actually do it."}, {"q": "What do I believe now?", "intro": "Back to the verse. Read it with the whole week behind you, then read what you wrote on Day 1.", "read": ["Matthew 5:48", "3 Nephi 12:48", {"journal": [4, 1]}], "journal": "Rewrite Matthew 5:48 in your own words. Then compare it to what you wrote on Day 1."}]}, {"n": 5, "tag": "L1", "question": "If God is your Father, why do you talk to Him like a stranger?", "intro": "Preach My Gospel starts with one sentence: God is our loving Heavenly Father. Not a force. Not a boss. A dad. If that's true, it should change how you pray. But most of us pray the same way we'd write a formal email. This week is about what it actually means that He's your Father, and what to do about it.", "days": [{"q": "What did Jesus say about how to pray?", "intro": "Jesus taught His disciples to pray exactly once in scripture, and it's short. Read it, then read what He said right before it about people who pray to be seen. When you read, notice what word He uses for God in the very first line.", "read": ["Matthew 6:5-13", "3 Nephi 13:5-13"], "journal": "Be honest. How do your prayers usually start, and how long before you get to what you actually want to say?"}, {"q": "What did it mean to call God \"Father\" back then?", "intro": "Jews in Jesus's day almost never called God \"Father\" in prayer. It was too familiar. Jesus did it constantly, and then told everyone else to. The word He probably used was *Abba*, the everyday word a kid uses. Paul picked it up later. Read where it shows up and what Paul says it means.", "read": ["Romans 8:14-17", "Galatians 4:6-7", "Mark 14:36"], "journal": "If you called God \"Dad\" in your prayer tonight, would it feel wrong? Why?"}, {"q": "What do we know about Him that others don't?", "intro": "The Restoration gives us specifics. God has a body. He's a real Person. We lived with Him before we came here. Joseph Smith saw Him. Read these looking for what kind of Father He is, not just that He is one.", "read": ["Joseph Smith—History 1:16-17", "D&C 130:22", "Moses 1:1-6", "Preach My Gospel, lesson 1, \"God Is Our Loving Heavenly Father\""], "journal": "Moses 1 shows God calling Moses \"my son\" before giving him a single assignment. What would change if you believed He sees you that way first?"}, {"q": "What do prophets say about praying like a son or daughter?", "intro": "Elder David A. Bednar, October 2008. He spends the whole talk on prayer, but the part that matters is what he says about praying with real intent, and about praying *for* people instead of just about them.", "read": [{"talk": "Pray Always", "speaker": "David A. Bednar", "date": "October 2008", "section": "Read the three principles."}], "takeaway": "His point is that prayer isn't a performance. You pray with real intent, meaning you're actually going to act on what you ask for. He teaches that our prayers become more meaningful when we pray for others and then go do something about it. The prayer and the doing are one thing.", "journal": "What did you pray for last that you didn't actually do anything about?"}, {"q": "If He's a loving Father, why doesn't He answer?", "intro": "This is the one everybody asks. You pray, nothing. You pray harder, still nothing. If a dad ignored his kid like that we'd call it neglect. Don't defend God here. Read these and let the question sit. Some of them are answers. Some just tell you that His not answering yet isn't the same as not listening.", "read": ["Matthew 7:7-11", "D&C 9:7-9", "Alma 34:17-27", "Jacob 4:10"], "journal": "What's the prayer you've stopped praying because it never got answered? Write it down. Then write what you'd do if you found out He'd heard every one."}, {"q": "How do you actually talk to Him differently?", "intro": "Enos went into the woods and prayed all day and all night. Nobody's asking you to do that. But read how he describes it. It's a conversation. He says something, God says something back, he says something else. Then read the sons of Mosiah, who prayed and fasted and got something specific. When you read, look for what makes a prayer a conversation instead of a speech.", "read": ["Enos 1:1-17", "Alma 17:9-11", "Preach My Gospel, lesson 4, \"Pray Often\""], "journal": "Tonight, pray out loud, alone, and talk to Him like He's in the room. Then write one sentence about how it went."}, {"q": "What do I believe now?", "intro": "Back to the Lord's Prayer. Read it slowly, then read what you wrote on Day 1.", "read": ["Matthew 6:9-13", {"journal": [5, 1]}], "journal": "Answer the week's question: If God is your Father, why do you talk to Him like a stranger? And what are you going to do about it?"}]}, {"n": 6, "tag": "L3", "question": "What does \"born again\" mean, and did Nicodemus ever get it?", "intro": "Nicodemus was a Pharisee and a member of the Sanhedrin. Smart, religious, respected. He came to Jesus at night, probably so nobody would see. And Jesus told him he had to be born again. He didn't get it. He asked if he was supposed to climb back into his mother. Most of us nod along at the phrase without understanding it any better than he did.", "days": [{"q": "What did Jesus actually say to him?", "intro": "Read the whole conversation. Notice that Nicodemus never asks the question Jesus answers. Jesus just starts in. And notice what Jesus says being born again requires. Two things, not one.", "read": ["John 3:1-21"], "journal": "Nicodemus came at night. What's something about your faith you'd rather ask about in the dark?"}, {"q": "What does \"born of water and of the Spirit\" mean?", "intro": "The Greek phrase can mean \"born again\" or \"born from above.\" Both work and Jesus probably meant both. Water is baptism. Spirit is the Holy Ghost. That's the same two steps John the Baptist described. Read how the early Saints understood it.", "read": ["Acts 2:37-41", "Titus 3:4-7", "Bible Dictionary, \"Baptism\" (the section on rebirth)"], "journal": "Baptism is a one-time event. Being born \"of the Spirit\" sounds ongoing. Which one do you think about more?"}, {"q": "What does it feel like when it actually happens?", "intro": "The Book of Mormon has the clearest description in scripture. King Benjamin's people hear a sermon and something happens to them. Alma the Younger describes it from the inside. When you read, look for what changed in them. Not what they did. What they *wanted*.", "read": ["Mosiah 5:1-7", "Mosiah 27:24-26", "Alma 5:14"], "journal": "Alma asks if you've experienced a mighty change in your heart. Have you? When?"}, {"q": "What do apostles say being born again looks like?", "intro": "Elder D. Todd Christofferson, April 2008. He gave a whole talk with this exact title and he's blunt about the fact that it usually isn't a single moment.", "read": [{"talk": "Born Again", "speaker": "D. Todd Christofferson", "date": "April 2008", "section": "Read the whole thing. It's short."}], "takeaway": "His point is that being born again is usually a process, not an event. For most people it happens gradually, through covenants and the Holy Ghost working on you over years. If you're waiting for a lightning bolt before you count yourself born again, you might be waiting for the wrong thing.", "journal": "Do you feel like you're \"still being born again\" or like it already happened? What's the evidence either way?"}, {"q": "Did Nicodemus ever get it?", "intro": "Here's the part people skip. Nicodemus shows up two more times in John. Read them in order. He defends Jesus, carefully. Then after the crucifixion he shows up with a hundred pounds of burial spices, in daylight, when it was dangerous. Scripture never says he was baptized. So did he get it? Don't answer fast.", "read": ["John 7:45-52", "John 19:38-42"], "journal": "Nicodemus went from sneaking in at night to carrying spices in daylight. What's your version of that? What would \"daylight\" look like for you?"}, {"q": "How do you stay born again?", "intro": "Alma asks the question nobody wants to hear: if you felt it once, can you feel it now? Being born again isn't a trophy. It's a direction. When you read, look for what Alma and Paul say you keep doing.", "read": ["Alma 5:26-35", "Galatians 5:16-25", "Preach My Gospel, lesson 3, \"The Gift of the Holy Ghost\""], "journal": "What's one thing you did this week that felt like walking in the Spirit, and one that didn't?"}, {"q": "What do I believe now?", "intro": "Back to the night conversation. Read the first few verses again with the whole week behind you.", "read": ["John 3:1-8", {"journal": [6, 3]}], "journal": "Answer the week's question: What does \"born again\" mean? And did it happen to you?"}]}, {"n": 7, "tag": "", "question": "Does God call the qualified, or qualify the called?", "intro": "Jesus picked fishermen. Not scribes, not rabbis, not anyone with a résumé. Peter's first real words to Jesus were \"depart from me, I am a sinful man.\" That's who He built the Church on. So when God asks you to do something you're not ready for, is that a mistake, or is that the point?", "days": [{"q": "Who did Jesus actually call, and what did they say?", "intro": "Read the calling of the first disciples in Luke. Pay attention to Peter's reaction. It's not \"yes.\" Then read Matthew's version, which is shorter and has one detail Luke leaves out: how fast they went.", "read": ["Luke 5:1-11", "Matthew 4:18-22", "Matthew 9:9"], "journal": "Peter's first response to Jesus was basically \"you've got the wrong guy.\" When have you felt that way about something God asked of you?"}, {"q": "What did it mean to be a fisherman in Galilee?", "intro": "Not glamorous. Long nights, smelly work, taxed hard by Rome. Fishermen weren't educated in the law. The religious leaders later called Peter and John \"unlearned and ignorant.\" That's the crew Jesus chose. Read what the leaders said, and read what Paul said about who God picks.", "read": ["Acts 4:13", "1 Corinthians 1:26-29", "Judges 6:11-16 (Gideon, hiding from the enemy, called \"mighty man of valour\")"], "journal": "God called Gideon a mighty warrior while he was hiding in a hole. What does God call you that you don't believe yet?"}, {"q": "What does the Restoration say about who gets called?", "intro": "D&C 4 was given to Joseph Smith's dad, a farmer with no church experience. Read what it says qualifies you. Then read the Lord's own explanation of why He uses weak people. When you read, list the qualifications. They're not what you'd expect.", "read": ["D&C 4:1-7", "D&C 1:17-24", "1 Nephi 3:7"], "journal": "D&C 4 lists what qualifies someone. Which one do you actually have, and which one are you faking?"}, {"q": "What do prophets say about being called before you're ready?", "intro": "President Henry B. Eyring, October 2002. He was asked to give a talk about raising the bar for missionaries and instead gave one about how the Lord makes people equal to their calls.", "read": [{"talk": "Rise to Your Call", "speaker": "Henry B. Eyring", "date": "October 2002", "section": "Read the first half, through the story of his own calling."}], "takeaway": "His point is that the call comes first and the ability comes after, not the other way around. God doesn't wait until you're qualified. He calls you and then, if you go, He qualifies you as you serve. Waiting to feel ready is how you never go.", "journal": "What are you waiting to feel ready for? What if you're supposed to start before that happens?"}, {"q": "But doesn't God sometimes call people who fail?", "intro": "Here's the hard part. Judas was called too. Saul was anointed king and lost it. Being called doesn't guarantee anything. So what's the difference between the fisherman who becomes Peter and the one who walks away? Read these and don't make it easy.", "read": ["Matthew 26:14-16, 47-50", "1 Samuel 15:22-26", "Alma 39:1-4 (Corianton, a called missionary who blew it)", "Alma 39:9-13 (and what Alma told him to do about it)"], "journal": "Corianton failed badly and Alma still told him to go back to work. Where have you disqualified yourself when God hasn't?"}, {"q": "How do you get qualified?", "intro": "Same D&C 4 verse from Day 3, but now read it as a to-do list. Then read Moroni, who spent his whole life doing a job he felt unqualified for and said so. When you read, look for what the Lord says He does with weakness.", "read": ["Ether 12:23-29", "D&C 4:5-7", "Preach My Gospel, lesson 5, \"Missionary Work\""], "journal": "Name one thing God has asked of you where you're waiting to feel qualified. What's the first step you could take anyway? Do it this week."}, {"q": "What do I believe now?", "intro": "Back to the boat. Read Peter's reaction one more time.", "read": ["Luke 5:8-11", {"journal": [7, 1]}], "journal": "Answer the week's question: Does God call the qualified, or qualify the called? And which one are you acting like is true?"}]}, {"n": 8, "tag": "L3", "question": "Is faith a feeling, a decision, or something else?", "intro": "Everybody says \"have faith\" like it's obvious what that means. Is it a feeling you either have or don't? Is it a choice? Is it believing something you can't prove? Preach My Gospel calls it the first principle of the gospel, which means if you get this one wrong, the rest wobbles. This week we figure out what it actually is.", "days": [{"q": "What does the New Testament say faith is?", "intro": "Hebrews 11 is the closest thing scripture has to a definition, and it's one verse. Then read the dad in Mark 9, who says the most honest sentence in the Bible. When you read, notice that he has faith and doubt at the same time, and Jesus heals his kid anyway.", "read": ["Hebrews 11:1-3", "Mark 9:17-27", "Matthew 17:19-20"], "journal": "\"Lord, I believe; help thou mine unbelief.\" Which half of that sentence is louder in you right now?"}, {"q": "What did the word mean to them?", "intro": "The Greek word is *pistis*. It means trust, or faithfulness, more than belief. When Paul says \"faith in Christ\" he's closer to \"trusting Christ\" than \"believing facts about Christ.\" You can believe your doctor is good and still not take the medicine. Read Hebrews 11 as a list of people who *did* something, not people who felt something.", "read": ["Hebrews 11:4-12", "Hebrews 11:24-29", "James 2:17-24"], "journal": "Pick one person from Hebrews 11. What did their faith make them do?"}, {"q": "What does the Book of Mormon add?", "intro": "Alma 32 is the best explanation of faith anywhere. He doesn't define it, he tells you how to grow it. Like a seed. You plant it, you see if it grows, and the growing is the evidence. When you read, look for the experiment. He literally calls it that.", "read": ["Alma 32:21", "Alma 32:26-34", "Preach My Gospel, lesson 3, \"Faith in Jesus Christ\""], "journal": "Alma says try the experiment. What's one thing you've been unwilling to try because you don't have enough faith to be sure it'll work?"}, {"q": "What do apostles say faith is?", "intro": "Elder Jeffrey R. Holland, April 2013. He uses the dad from Mark 9 and builds a whole talk on it. If you only read one talk this year, this might be it.", "read": [{"talk": "Lord, I Believe", "speaker": "Jeffrey R. Holland", "date": "April 2013", "section": "Read the whole thing."}], "takeaway": "His point is that you start with what faith you *have*, not what you wish you had. Hold on to what you know, and let your doubts stay doubts instead of turning them into conclusions. He says to be as candid about your questions as you need to be, but don't let the unknown crowd out what you actually do know. Faith and doubt can be in the same person at the same time, and Jesus works with that.", "journal": "Holland says hold on to what you already know. Write down three things you actually know."}, {"q": "If faith is a choice, why can't I just choose it?", "intro": "Here's the hard part. People say faith is a decision. Fine. But you can't just decide to believe something any more than you can decide to like a food you hate. So what part of it is a choice and what part isn't? Read these and don't let yourself off easy.", "read": ["Alma 32:27 (\"even if ye can no more than *desire* to believe\")", "Ether 12:6", "Moroni 10:4-5", "2 Nephi 2:27"], "journal": "Alma says you can start with just wanting to believe. Is that enough for you? What's stopping you from that much?"}, {"q": "How do you actually build it?", "intro": "Faith grows the way a muscle grows: by using it on things you can't see the end of. Nephi built a ship without a blueprint. The brother of Jared couldn't see through the veil until he'd already made the stones. When you read, look at the order. Action, then seeing. Never the other way around.", "read": ["1 Nephi 17:7-11", "Ether 3:1-6", "Ether 12:7-12"], "journal": "Pick one thing this week you'll do *before* you're sure it'll work. Write it down. That's the experiment."}, {"q": "What do I believe now?", "intro": "Back to the dad in Mark 9. Read the whole thing again. Then read your Day 1 answer.", "read": ["Mark 9:17-27", {"journal": [8, 1]}], "journal": "Answer the week's question: Is faith a feeling, a decision, or something else? Use your own words. And say what you're going to do about it."}]}, {"n": 9, "tag": "", "question": "Jesus said don't worry about tomorrow. Tomorrow is a real problem. So what did He mean?", "intro": "\"Take no thought for the morrow\" is one of the most quoted lines in the Sermon on the Mount, and one of the least followed. You have bills. You have kids. You have a job that might not be there in a year. Jesus knew that too. So either He was being naive, or He meant something more specific than \"don't plan.\" Let's find out which.", "days": [{"q": "What did He actually say?", "intro": "Read the whole passage, not the one line. He's not talking about planning. He's talking about *worry*. And He gives a reason at the end that most people miss: seek the kingdom first, and the rest follows. When you read, count how many times He says \"take no thought.\" Then find what He says to do instead.", "read": ["Matthew 6:25-34", "3 Nephi 13:25-34"], "journal": "What's the thing you're worried about most right now? Write it down. We'll come back to it."}, {"q": "What did \"take no thought\" mean to them?", "intro": "The Greek is *merimnao*, which means to be anxious, to be pulled apart. It's not \"don't think.\" It's \"don't be torn up.\" And notice the audience. These were poor people. Day laborers. When Jesus said don't worry about food and clothes, He was talking to people who actually didn't know where dinner was coming from. That makes the promise heavier, not lighter.", "read": ["Luke 12:22-34", "Philippians 4:6-7", "1 Peter 5:6-7"], "journal": "Is your worry about real needs, or about wanting more than you need? Be honest."}, {"q": "What does the Restoration say about providing?", "intro": "Here's where it gets practical. The Lord told the early Saints the same thing, and then in the same breath told them to work. Read D&C 84, which quotes the Sermon on the Mount almost word for word and then adds instructions. Then read King Benjamin, who says you have to work for what you have *and* God gave it all to you. Both.", "read": ["D&C 84:80-88", "Mosiah 2:20-25", "Mosiah 4:16-19"], "journal": "D&C 84 is a promise to missionaries who left everything. How much of that promise applies to you? How much are you sure?"}, {"q": "What do prophets say about worry?", "intro": "Elder Ronald A. Rasband, October 2018. He gave this talk when the world felt unstable and it's held up.", "read": [{"talk": "Be Not Troubled", "speaker": "Ronald A. Rasband", "date": "October 2018", "section": "Read the whole thing. It's short."}], "takeaway": "His point is that \"be not troubled\" is a commandment, not a suggestion, and Jesus gave it right before describing wars, earthquakes, and everything else that's coming. The peace isn't because things will be fine. It's because He's in charge of the things that won't be. Rasband lists the things that anchor you: covenants, the Spirit, the prophet, and doing what you already know to do.", "journal": "Rasband says peace comes from what you're anchored to, not what's happening around you. What are you actually anchored to right now?"}, {"q": "But Paul said provide for your family or you're worse than an unbeliever. So which is it?", "intro": "Here's the hard part. Jesus says don't worry about food. Paul says if you don't provide for your family you've denied the faith. The Lord told Joseph Smith that the idler shall not eat the bread of the laborer. So is it \"trust God\" or \"work hard\"? Read these and figure out where the line is between worry and responsibility.", "read": ["1 Timothy 5:8", "D&C 42:42", "D&C 75:28", "Proverbs 6:6-11"], "journal": "Where's the line for you between responsibly planning and being torn apart by worry? Where are you crossing it?"}, {"q": "How do you actually stop worrying?", "intro": "Jesus gives the how in the same passage, but it's easy to miss. Seek the kingdom *first*. Not instead. First. And Paul gives the mechanics: pray about it, be thankful, and let the peace come. Then read Nephi, who had every reason to worry and describes what he does instead. When you read, look for what replaces the worry.", "read": ["Matthew 6:33-34", "Philippians 4:6-9", "2 Nephi 4:17-35"], "journal": "Go back to what you wrote on Day 1. Pray about it tonight, specifically. Then write one sentence about what you'll do tomorrow that's seeking the kingdom first."}, {"q": "What do I believe now?", "intro": "Back to the lilies. Read it once more with the week behind you.", "read": ["Matthew 6:25-34", {"journal": [9, 1]}], "journal": "Answer the week's question: What did Jesus mean by \"take no thought for the morrow\"? And what's your worry from Day 1 look like now?"}]}, {"n": 10, "tag": "", "question": "Why does Jesus heal some people and not others?", "intro": "Jesus healed a lot of people. He also walked past a lot of people. At the pool of Bethesda there were crowds of sick people and He healed one guy. Alma watched women and children burn and didn't stop it. If God can heal, and doesn't, that's a real question, and \"His ways are higher\" is not a full answer. Don't expect one this week. Expect to think harder.", "days": [{"q": "Who did He heal, and how?", "intro": "Read a run of healings from Matthew 8. Notice the variety. Some people ask. Some are brought. One guy's servant isn't even in the room. Then read Bethesda. There's a crowd, and Jesus heals one man, and He doesn't explain why him.", "read": ["Matthew 8:1-17", "John 5:1-9"], "journal": "At Bethesda there were many sick and one got healed. If you'd been one of the others, what would you have thought?"}, {"q": "What did healing mean in their world?", "intro": "Sickness in first-century Judea wasn't just physical. Lepers were unclean and cut off from the temple and their families. Being healed meant getting your life back. And people assumed sickness meant sin. Jesus's disciples asked Him about that directly, and His answer is one of the most important things He ever said about suffering.", "read": ["John 9:1-7", "Luke 13:1-5", "Job 2:3-10"], "journal": "The disciples assumed the blind man or his parents sinned. Whose suffering have you quietly assumed they earned?"}, {"q": "What does the Book of Mormon add?", "intro": "Two stories. Alma and Amulek watch believers burn and Alma says the Spirit told him not to stop it. Then Alma's people in bondage, who aren't freed but are strengthened. When you read, look for what the Lord does *instead* of fixing it.", "read": ["Alma 14:8-13", "Mosiah 24:13-16", "Alma 7:11-12"], "journal": "Alma 7:12 says Christ took on our infirmities so He'd know how to help. Does that change anything about the times He doesn't heal? Why or why not?"}, {"q": "What do apostles say about the unfairness of it?", "intro": "Elder Dale G. Renlund, April 2021. He's a heart doctor. He's watched people die who shouldn't have. He didn't dodge this one.", "read": [{"talk": "Infuriating Unfairness", "speaker": "Dale G. Renlund", "date": "April 2021", "section": "Read the whole thing."}], "takeaway": "His point is that unfairness is real, it's not your imagination, and God doesn't ask you to pretend it isn't. What He promises is that Jesus Christ will make everything right eventually, and that in the meantime He'll be with you in it. Renlund says the Savior's suffering wasn't fair either, and that's exactly why He understands yours.", "journal": "Renlund says it's okay to call unfairness what it is. What's the unfair thing you've been trying not to be angry about?"}, {"q": "If He can heal and doesn't, is He choosing not to?", "intro": "Here's the hard part, and I'm not going to soften it. God has the power. Someone you love needed healing and didn't get it. So either He couldn't or He wouldn't. Read these. D&C 42 says some people are \"appointed unto death,\" which means there's a plan you can't see. That's either comforting or infuriating depending on the day. Let it be both.", "read": ["D&C 42:43-48", "2 Corinthians 12:7-10", "Isaiah 55:8-9", "Alma 60:13"], "journal": "Write the name of someone you prayed for who wasn't healed. What do you actually believe about why?"}, {"q": "What do you do while you wait to be healed?", "intro": "Sometimes the healing is the thing. Sometimes the healing is what you become while you're not healed. Nephi says his heart groans because of his flesh and then decides to trust anyway. Paul got told no three times and calls it grace. When you read, look for what they do with the no.", "read": ["2 Nephi 4:17-19, 26-30", "James 5:13-16", "D&C 121:7-9"], "journal": "Who around you is waiting to be healed, physically or otherwise? What can you do this week that's the \"strengthened in bondage\" kind of help?"}, {"q": "What do I believe now?", "intro": "Back to Bethesda. Read it once more, and then read the name you wrote on Day 5.", "read": ["John 5:1-9", {"journal": [10, 5]}], "journal": "Answer the week's question as honestly as you can: Why does Jesus heal some and not others? It's fine if the answer is \"I don't know, but here's what I trust.\""}]}, {"n": 11, "tag": "L3", "question": "Repentance. Why does it feel like punishment when God calls it a gift?", "intro": "Say the word \"repent\" and most people flinch. It sounds like a scolding. But the scriptures call it a gift, prophets call it joyful, and the word itself doesn't mean \"feel terrible.\" It means turn around. Change your mind. Get better. This week connects back to Week 4: if perfect means complete, repentance is how you get more complete. It's self-discovery followed by a commitment, not a penalty box.", "days": [{"q": "What did Jesus say about rest?", "intro": "Read what you wrote on Day 7 of Week 4 first. You rewrote \"be ye therefore perfect\" in your own words. Now read Jesus's invitation in Matthew 11. He's talking to people worn out by religion. His answer isn't \"try harder.\" It's \"come to me.\" That's the door repentance walks through.", "read": [{"journal": [4, 7]}, "Matthew 11:28-30", "Luke 5:31-32"], "journal": "When you hear the word \"repent,\" what's the first feeling? Write it down. We'll see if it changes."}, {"q": "What does the word actually mean?", "intro": "Greek: *metanoia*. A change of mind, a new way of seeing. Hebrew: *shuv*. To turn, to return, to come home. Neither one means \"feel bad.\" Feeling bad is sometimes part of it, but it's not the thing. The thing is the turn. Read Alma asking what turning looks like, then read what Peter said to a crowd that had just realized they'd killed the Messiah.", "read": ["Alma 5:14-16", "Acts 2:37-39", "Ezekiel 18:30-32"], "journal": "If repentance is a change of mind, what's one thing you think about wrong that needs changing? Not a sin. A way of seeing."}, {"q": "What did Alma do with his repentance?", "intro": "Alma the Younger is the case study. He was in real pain for three days. But read what he does afterward. He doesn't sit around feeling sorry. He spends the rest of his life building something. When you read, look at the ratio: how many verses on the pain, how many on what came next.", "read": ["Alma 36:12-24", "Alma 36:24-26", "Mosiah 27:32-37"], "journal": "Alma's pain was three days. His work was thirty years. What's something you've been stuck feeling bad about that you should have turned into work by now?"}, {"q": "What do prophets say repentance is?", "intro": "President Russell M. Nelson, April 2019. He gave this to the priesthood session and told them straight that repentance is not a punishment.", "read": [{"talk": "We Can Do Better and Be Better", "speaker": "Russell M. Nelson", "date": "April 2019", "section": "Read the whole thing."}], "takeaway": "His point is that repentance is one of the most hopeful words in scripture, and the Greek means changing your mind, your knowledge, your spirit, even your breathing. He says nothing is more liberating or more ennobling. And he's clear that it's daily, not just for big sins: \"do better and be better\" is the whole assignment.", "journal": "Nelson says repentance is daily. What's one thing you could do better tomorrow that has nothing to do with a \"sin\"?"}, {"q": "Then where does sorrow fit?", "intro": "Here's the hard part. If repentance is about becoming, why does the Church talk about confession, restitution, forsaking? Why does Paul talk about godly sorrow? Because there *is* a kind of sorrow that's part of it. But there's also a kind that isn't. Paul separates them. King Benjamin's people felt the first kind and it led somewhere. Read these and figure out the difference.", "read": ["2 Corinthians 7:9-11", "Mosiah 4:1-3", "Mormon 2:13-14 (the wrong kind of sorrow)", "D&C 58:42-43"], "journal": "Paul says one kind of sorrow leads to repentance and the other leads to death. Which kind have you been carrying?"}, {"q": "What's the next thing to get better at?", "intro": "This is the self-discovery part. Not a sin inventory. Ether says the Lord shows you your weakness so it can become a strength, and that's a promise, not a threat. When you read, look for the mechanism: weakness, then humility, then grace, then strength. Then pick one.", "read": ["Ether 12:27", "Moroni 10:32", "Preach My Gospel, lesson 3, \"Repentance\""], "journal": "Pick one thing to get better at. Not a habit to quit. Something to become. Write it down and write what you'll do about it this week. That's repentance."}, {"q": "What do I believe now?", "intro": "Read your Day 1 answer. Then read the invitation in Matthew 11 one more time.", "read": [{"journal": [11, 1]}, "Matthew 11:28-30"], "journal": "Rewrite the word \"repent\" in your own words, the way you rewrote \"perfect\" in Week 4. Then answer: why did it ever feel like punishment?"}]}, {"n": 12, "tag": "", "question": "Why did Jesus teach in parables instead of just explaining?", "intro": "Jesus was the best teacher who ever lived and He mostly told stories. Farmers, sheep, coins, seeds. The disciples asked Him why, and His answer is strange: so that some people *wouldn't* understand. That doesn't sound like the Jesus we sing about. This week is about why He taught the way He did, and what that means for how you're supposed to learn.", "days": [{"q": "What's the first parable, and what did He say about it?", "intro": "The sower is the parable about parables. Jesus tells it, then explains why He uses them, then explains the story itself. Read all three parts. When you read, notice that the story is about *how people listen*. That's not an accident.", "read": ["Matthew 13:1-9", "Matthew 13:10-17", "Matthew 13:18-23"], "journal": "Four kinds of soil. Which one are you most of the time? Not which one do you want to be."}, {"q": "How did stories work in His world?", "intro": "Rabbis in Jesus's day taught with *mashal*, which means comparison or riddle. A parable wasn't a fable with a moral at the end. It was a puzzle. You had to work it out, and the working was the lesson. Nathan used one on David and David convicted himself before he realized who the story was about. Read that. Then read Isaiah, which is where Jesus's \"hearing they hear not\" line comes from.", "read": ["2 Samuel 12:1-7", "Isaiah 6:8-10", "Mark 4:33-34"], "journal": "Nathan's story worked because David didn't know it was about him. Which of Jesus's parables have you been assuming is about someone else?"}, {"q": "What does the Book of Mormon say about how God teaches?", "intro": "Alma 32 is a parable too, about a seed. But the key verse for this week is about *why* God gives some people more than others. Alma 12 says it's about what you do with what you've got. And Nephi says line upon line. When you read, look for the rule: what earns you more understanding?", "read": ["Alma 12:9-11", "2 Nephi 28:30", "Alma 32:28-30"], "journal": "Alma 12 says the person who hardens their heart gets less. Where have you gotten less because you stopped paying attention?"}, {"q": "How does a modern apostle teach with a parable?", "intro": "Elder Jeffrey R. Holland, April 2012. He takes one parable, the laborers in the vineyard, and turns it inside out. Read it and watch how he does it. That's how a parable is supposed to work on you.", "read": [{"talk": "The Laborers in the Vineyard", "speaker": "Jeffrey R. Holland", "date": "April 2012", "section": "Read the whole thing.", "note": "Read Matthew 20:1-16 first if you don't know the story."}], "takeaway": "His point is that the parable isn't about wages. It's about the people who worked all day and got angry that the latecomers got the same. Holland says that's most of us. We keep score. And God doesn't. He pays everyone in full because He's generous, not because He's fair by our math.", "journal": "Holland says we keep score on people who came late. Who are you keeping score on?"}, {"q": "Was Jesus actually hiding truth from people?", "intro": "Here's the hard part. Matthew 13:11 says it's given to some to know the mysteries and not to others. That sounds like God picking favorites. Read it again with Isaiah behind it. Then read Jesus's own explanation for why the same story lands differently on different people. Is He hiding truth, or protecting people from truth they'd be accountable for and reject?", "read": ["Matthew 13:11-15", "John 16:12", "Alma 12:9 again", "D&C 50:24"], "journal": "D&C 50:24 says light grows brighter if you receive it. Is there truth you've been given that you've been sitting on? What would receiving it look like?"}, {"q": "How do you get more out of a parable?", "intro": "Simple test. Read one and ask: who am I in this story? Not who should I be. Who am I. Jesus's parables always have a character you'd rather not be. Read three short ones today and find yourself in each one.", "read": ["Matthew 13:44-46", "Luke 18:9-14", "Luke 16:19-25"], "journal": "For each of the three, one line: who were you in it?"}, {"q": "What do I believe now?", "intro": "Back to the sower. Read it once more, and then your Day 1 answer.", "read": ["Matthew 13:3-9, 18-23", {"journal": [12, 1]}], "journal": "Answer the week's question: Why did Jesus teach in parables? And what kind of listener does that require you to be?"}]}, {"n": 13, "tag": "L2", "question": "Easter. Why did Jesus have to die? Couldn't God just forgive?", "intro": "It's Easter week. Everybody knows Jesus died for our sins. Fewer people can say why He *had* to. If God is all-powerful and loves us, why not just forgive? Why does someone have to bleed for it? The Book of Mormon takes this question head on, and the answer isn't what most people assume. This is the center of everything, so slow down.", "days": [{"q": "What actually happened that week?", "intro": "Start with the story. Read the triumphal entry and then jump to the arrest. Notice how fast the crowd turns. Notice that Jesus knew all of it and walked into it anyway.", "read": ["Matthew 21:1-11", "Matthew 26:36-46", "John 18:1-11"], "journal": "Before this week, what would you say if a kid asked you why Jesus had to die? Write it down."}, {"q": "What did \"atonement\" mean to them?", "intro": "Hebrew: *kaphar*, to cover. On the Day of Atonement the high priest covered the sins of Israel with the blood of an animal. Every Jew understood that sin cost something and something died for it. Jesus died during Passover, when lambs were being killed all over Jerusalem. Nobody in that city would have missed the point. Read Leviticus, then Isaiah, then John the Baptist.", "read": ["Leviticus 16:20-22", "Isaiah 53:4-7", "John 1:29", "Bible Dictionary, \"Atonement\""], "journal": "For a thousand years Israel watched something die for their sins every year. What would that do to how you thought about sin?"}, {"q": "Why couldn't God just forgive?", "intro": "Here's the answer nobody gives at church because it takes too long. Alma explains it to his son. Justice is real. It's not a rule God made up; it's part of how things are. If God ignored it, He'd stop being God. So mercy can't just cancel justice. Something has to satisfy it. Read Alma 42 slowly. It's the most important chapter this week.", "read": ["Alma 42:13-25", "Alma 34:8-16", "2 Nephi 9:6-10"], "journal": "Alma says if mercy robbed justice, God would cease to be God. Does that make sense to you, or does it still feel like He could have found another way?"}, {"q": "What do apostles say about justice and mercy?", "intro": "Elder Jeffrey R. Holland, April 2015. He tells a story about two brothers on a cliff and then explains the Atonement through it. Read it.", "read": [{"talk": "Where Justice, Love, and Mercy Meet", "speaker": "Jeffrey R. Holland", "date": "April 2015", "section": "Read the whole thing."}], "takeaway": "His point is that the Atonement isn't a transaction where God was paid off. It's an act of love that reaches down to where you actually are. He says the Savior's suffering was voluntary and it was for *you*, personally, not humanity in general. And he doesn't clean up the cross. He says the pain was real and the price was paid in full.", "journal": "Holland says the cross reaches to where you are. Where are you right now that feels too far down for that?"}, {"q": "Was the Father cruel to require it?", "intro": "Here's the hard part, and people avoid it. If the Father required His Son to suffer like that, what does that say about the Father? Read the plan from the Son's own mouth: He volunteered. Read what Jesus said in Gethsemane. Then read what He said about it afterward, in D&C 19, which is the only place in scripture where the Savior describes His own suffering in the first person.", "read": ["Moses 4:1-2", "Abraham 3:27", "Luke 22:41-44", "D&C 19:16-19"], "journal": "D&C 19 is Jesus telling you what it cost Him and why. Read verse 16 again. Now write what you'd say to Him about it."}, {"q": "What are you supposed to do with a gift that big?", "intro": "The Atonement is free and it also asks something. Both. The Nephites who survived the destruction heard the Savior's own voice tell them what He wanted. Moroni ends the whole Book of Mormon with the how. When you read, look for the verbs. What does He actually ask you to do?", "read": ["3 Nephi 9:13-22", "Moroni 10:32-33", "Preach My Gospel, lesson 2, \"The Atonement\""], "journal": "3 Nephi 9:20 asks for a broken heart. What's the thing you're holding onto that would have to break?"}, {"q": "What do I believe now?", "intro": "Easter Sunday. Read the resurrection first thing. Then read what you wrote on Day 1.", "read": ["John 20:1-18", {"journal": [13, 1]}], "journal": "Answer the week's question the way you'd say it to a kid now: Why did Jesus have to die? Couldn't God just forgive?"}]}, {"n": 14, "tag": "L3", "question": "Why did Peter sink?", "intro": "Peter walked on water. Actually walked on it. Then he sank. We usually treat that as a failure story, but he's the only one who got out of the boat. Eleven guys stayed put. So what happened between the first step and the sinking? And what did Jesus mean when He asked \"wherefore didst thou doubt?\" This is faith in motion, which is the only kind that counts.", "days": [{"q": "What happened on the water?", "intro": "Read Matthew's version, which has Peter in it. Then Mark's, which doesn't mention Peter at all but has a detail Matthew leaves out about *why* they were afraid. When you read Matthew, find the exact moment Peter starts sinking. What changed?", "read": ["Matthew 14:22-33", "Mark 6:45-52"], "journal": "Peter was fine until he looked at the wind. What's the \"wind\" you look at that makes you sink?"}, {"q": "What was that night actually like?", "intro": "The Sea of Galilee sits in a bowl and storms come off the hills fast. The disciples had been rowing against the wind since evening. It was the fourth watch, between three and six in the morning. They'd been at it for nine hours. They were fishermen. They knew exactly how much trouble they were in. Then a figure walks toward them on the water, and they think it's a ghost. Read Mark again for the loaves detail, and then read Job, because God has a history with the sea.", "read": ["Mark 6:51-52", "Job 9:8", "Psalm 107:23-30"], "journal": "Mark says they were afraid because they didn't understand the loaves. What miracle have you already seen that you've forgotten when the next storm hits?"}, {"q": "What does the Book of Mormon say about the trial of faith?", "intro": "Moroni says you don't get the witness until *after* the trial of your faith. Peter got the witness after he sank, not before he stepped. That's the order. Read these and look for what comes first and what comes second.", "read": ["Ether 12:6", "Alma 32:21", "Moroni 7:33", "1 Nephi 4:6-7"], "journal": "Nephi went into Jerusalem \"not knowing beforehand.\" When have you stepped out not knowing? What happened?"}, {"q": "What do apostles say about faith and choosing?", "intro": "Elder Neil L. Andersen, October 2015. He takes on the idea that faith just happens to you.", "read": [{"talk": "Faith Is Not by Chance, but by Choice", "speaker": "Neil L. Andersen", "date": "October 2015", "section": "Read the whole thing."}], "takeaway": "His point is that faith doesn't fall on you by accident and it doesn't leave you by accident either. It grows or shrinks based on what you choose to do with your questions, your attention, and your feet. He says when doubts come you have a choice about where to look, and where you look is where you go. Peter looked at the wind. That was a choice too.", "journal": "Andersen says you choose where you look. Where have you been looking lately, and what's that doing to your faith?"}, {"q": "Was Jesus criticizing Peter?", "intro": "Here's the hard part. \"Wherefore didst thou doubt?\" sounds like a rebuke. Peter did more than anyone else in that boat and got called out for it. Is doubt a sin? Or was Jesus asking a real question? Read how Jesus treats other doubters. The dad in Mark 9 doubts out loud and gets his kid back. Thomas doubts and gets a private invitation. Oliver Cowdery doubts and gets told to remember.", "read": ["Mark 9:23-24", "John 20:24-29", "D&C 6:22-23"], "journal": "Do you think Jesus was disappointed in Peter, or asking him a question he needed to answer? What's the difference, and which would you rather hear?"}, {"q": "How do you get out of the boat?", "intro": "Peter asked first. \"Lord, if it be thou, bid me come.\" He didn't just jump. He asked, got told yes, then went. That's the pattern. Then when he sank he did the one thing that saved him: he yelled for help immediately. When you read, look for what the Lord tells people to do when they're afraid.", "read": ["Matthew 14:28-31 again", "3 Nephi 18:18-21", "Luke 22:31-32", "D&C 6:34-36"], "journal": "What's the thing you'd do if the Lord told you \"come\"? Ask Him this week. Then write down what you'll do if the answer is yes."}, {"q": "What do I believe now?", "intro": "Back to the water. Read it one more time, all the way to the end where they worship Him. Then read your Day 1 answer.", "read": ["Matthew 14:25-33", {"journal": [14, 1]}], "journal": "Answer the week's question: Why did Peter sink? And what's the real lesson, the sinking or the stepping?"}]}, {"n": 15, "tag": "L1", "question": "\"Upon this rock.\" What is revelation, really?", "intro": "Peter said Jesus was the Christ, and Jesus said flesh and blood didn't tell him that. The Father did. Then He said He'd build His Church on \"this rock.\" Catholics say the rock is Peter. We say the rock is revelation. Either way, Jesus is saying the whole thing runs on God actually talking to people. So what does that look like, and how do you know when it's Him?", "days": [{"q": "What did Peter say, and what did Jesus say back?", "intro": "Read the conversation at Caesarea Philippi. Jesus asks two questions. The first is easy. The second is the only one that matters. When you read, notice where Jesus says Peter's answer came from.", "read": ["Matthew 16:13-20", "Mark 8:27-30"], "journal": "\"Whom say ye that I am?\" Answer it yourself, right now, in one sentence. Then write where that answer came from."}, {"q": "Why there, and what's the rock?", "intro": "Caesarea Philippi sat at the base of a massive rock cliff with a cave in it that pagans called the gate of hell. There was a temple to Caesar built into it. Jesus took His disciples to the most pagan spot in the region and asked who He was. Then He said the gates of hell wouldn't prevail against His Church, with the actual gate of hell in view. The Greek: Peter is *petros*, a stone. \"This rock\" is *petra*, bedrock. He's not building on a pebble.", "read": ["Matthew 16:17-18 again, with the footnotes", "Ephesians 2:19-22", "Helaman 5:12"], "journal": "Helaman says build on the rock of the Redeemer so the devil's storms can't drag you down. What are you actually built on? Be specific."}, {"q": "How does the Restoration describe revelation?", "intro": "The D&C has more detail about how revelation works than the rest of scripture combined. Read the Lord explaining it to Oliver Cowdery, twice, because Oliver didn't get it the first time. Then read Alma asking how *he* knows. When you read, list every method you find.", "read": ["D&C 8:2-3", "D&C 9:7-9", "Alma 5:45-47", "Moroni 10:4-5"], "journal": "D&C 8 says it comes to your mind and your heart. Which one do you trust more? Which one do you ignore?"}, {"q": "What does the prophet say about revelation?", "intro": "President Russell M. Nelson, April 2018. His first conference as prophet, and he used it to tell everyone that personal revelation is the whole game.", "read": [{"talk": "Revelation for the Church, Revelation for Our Lives", "speaker": "Russell M. Nelson", "date": "April 2018", "section": "Read the whole thing."}], "takeaway": "His point is that in the coming days it won't be possible to survive spiritually without the guiding influence of the Holy Ghost. Not \"it'll be nice.\" Not possible. He describes how he gets revelation: write down the question, study it out, pray, write down the impressions, and act. And he says you can get better at it, the way you get better at anything, by doing it a lot.", "journal": "Nelson describes a process: ask, study, write, act. Which step do you skip?"}, {"q": "How do you know it's God and not just you?", "intro": "Here's the hard part, and it's the real question. You get a feeling. Is that the Spirit or is that you wanting something? Two honest people pray about the same thing and get opposite answers. So how does this actually work? Read the Lord's own test in D&C 50, and read what He says about revelation that contradicts what's already been revealed.", "read": ["D&C 50:17-24", "D&C 11:12-14", "Galatians 5:22-23", "Moroni 7:15-17"], "journal": "Think of a time you were sure something was revelation and it wasn't. What does that teach you about the times you're sure now?"}, {"q": "How do you get more of it?", "intro": "Nephi gives you the how in one verse: he *desired* to know, he *believed* it was possible, and he *sat pondering*. That's it. Then read D&C 88, which tells you to draw near and promises He'll draw near back. Then the Lord's instruction about pondering things out. When you read, look for what you're supposed to do before the revelation comes.", "read": ["1 Nephi 11:1", "D&C 88:63-64", "D&C 9:8 again", "Preach My Gospel, chapter 4, \"Recognize the Spirit\""], "journal": "Pick one question you actually want an answer to. Write it down. Then do Nelson's process this week and come back to it on Day 7."}, {"q": "What do I believe now?", "intro": "Back to Caesarea Philippi. Read Peter's confession one more time. Then read the question you wrote on Day 6, and what you wrote on Day 1.", "read": ["Matthew 16:13-17", {"journal": [15, 6]}, {"journal": [15, 1]}], "journal": "Answer the week's question: What is revelation, really? And did you get any this week?"}]}, {"n": 16, "tag": "", "question": "How many times do I really have to forgive someone who keeps doing it?", "intro": "Peter thought he was being generous when he asked about seven times. Jesus said seventy times seven, and then told a story about a guy who was forgiven a fortune and then choked somebody over pocket change. Everybody knows we're supposed to forgive. Almost nobody knows what to do with the person who never stops, or never says sorry, or actually hurt you badly. This week is about that person.", "days": [{"q": "What did Jesus say, and what story did He tell?", "intro": "Read Peter's question and the parable that follows. Notice the amounts. Ten thousand talents was more money than existed in the whole region. A hundred pence was a few months' wages. Jesus picked those numbers on purpose. When you read, figure out who you are in the story. The answer is uncomfortable.", "read": ["Matthew 18:21-35", "Luke 17:3-4"], "journal": "Who's the person you've forgiven the most times? Who's the person you haven't forgiven once? Write both names."}, {"q": "Where did \"seventy times seven\" come from?", "intro": "Here's something almost nobody catches. In Genesis 4, a man named Lamech brags that if Cain was avenged seven times, he'll be avenged seventy-seven times. It's the first recorded escalation of revenge in scripture. Jesus takes Lamech's number and flips it from vengeance to forgiveness. He's not giving Peter a quota. He's undoing a curse. Read Lamech first, then Jesus again.", "read": ["Genesis 4:23-24", "Matthew 18:22 again", "Romans 12:17-21"], "journal": "Lamech's math was \"you hurt me once, I hurt you seventy-seven times.\" Where are you keeping that kind of math on someone?"}, {"q": "What does the Restoration require?", "intro": "D&C 64 has the sentence that settles it, and it's harder than the New Testament. \"Of you it is required to forgive all men.\" Not encouraged. Required. Read it, then read what the Lord told Alma about members who won't forgive each other. When you read, notice who the Lord says the unforgiving person is actually hurting.", "read": ["D&C 64:9-11", "Mosiah 26:29-31", "3 Nephi 12:23-24"], "journal": "D&C 64:9 says the one who won't forgive has the greater sin. Does that feel fair? Why does the Lord say it anyway?"}, {"q": "What do apostles say about forgiving?", "intro": "Elder Jeffrey R. Holland, April 2018. He talks about forgiveness in families, in the Church, and with yourself, and he doesn't pretend it's easy.", "read": [{"talk": "The Ministry of Reconciliation", "speaker": "Jeffrey R. Holland", "date": "April 2018", "section": "Read the whole thing."}], "takeaway": "His point is that holding a grudge is like drinking poison and waiting for the other person to die. He says forgiveness is a gift you give yourself as much as them, and that carrying the wound around doesn't hurt the person who caused it. He also says something important: forgiving isn't the same as saying it didn't matter. It mattered. You forgive anyway.", "journal": "Holland says the grudge hurts you, not them. What's the grudge that's been costing you the most?"}, {"q": "Does forgiving mean trusting them again?", "intro": "Here's the hard part. Someone hurt you badly
