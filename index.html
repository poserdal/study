. Maybe they're not sorry. Maybe they'll do it again. Does forgiving mean letting them back in? No. Forgiveness and trust are different things. Read D&C 98, which is the Lord's actual instruction about people who keep coming back to hurt you. It's more nuanced than people think. Then read Jesus on enemies. Figure out what forgiveness requires and what it doesn't.", "read": ["D&C 98:39-45", "Luke 6:27-36", "Matthew 10:16"], "journal": "Who do you need to forgive but not trust? What would forgiving them look like if it doesn't mean letting them close?"}, {"q": "How do you actually do it?", "intro": "Jesus gives one instruction that works: pray for them. Not pray that they change. Pray *for* them. It's almost impossible to keep hating someone you're sincerely praying for. Then read Nephi, who was hunted by his own brothers and still calls his heart's anger a weakness he needs to fix. When you read, look for what forgiveness does to the forgiver.", "read": ["Matthew 5:43-45", "2 Nephi 4:27-29", "Moroni 7:45-48", "Preach My Gospel, chapter 6, \"Charity and Love\""], "journal": "Take the name from Day 1 that you haven't forgiven. Pray for them tonight, by name, for good things. Then write one sentence about what it was like."}, {"q": "What do I believe now?", "intro": "Back to the parable. Read it once more and find the moment the servant could have chosen differently. Then read your Day 1 answer.", "read": ["Matthew 18:28-35", {"journal": [16, 1]}], "journal": "Answer the week's question: How many times do you really have to forgive? And what about the person who isn't sorry?"}]}, {"n": 17, "tag": "", "question": "Who is my neighbor, and why did Jesus make the hero a Samaritan?", "intro": "A lawyer asked Jesus \"who is my neighbor?\" trying to find the edge of the rule. Who do I *have* to love, so I know who I don't. Jesus told a story where the priest and the Levite, the religious guys, walk past, and a Samaritan, the guy every Jew hated, stops. That wasn't a nice story to them. It was offensive. This week is about why.", "days": [{"q": "What was the question, and what was the story?", "intro": "Read the whole exchange. Notice the lawyer's second question comes because he wanted to \"justify himself.\" Notice that Jesus never answers \"who is my neighbor.\" He flips it to \"who *was* a neighbor.\" Different question. When you read, count how many people walked past.", "read": ["Luke 10:25-37"], "journal": "The lawyer wanted to know the minimum. Who's outside your circle right now, the people you've decided you don't have to care about?"}, {"q": "Why a Samaritan?", "intro": "Samaritans were half-Israelites left over from the Assyrian conquest, mixed with foreigners, with their own temple on the wrong mountain. Jews and Samaritans hated each other for centuries. Jews would walk days out of their way to avoid Samaria. And here's the kicker: just one chapter earlier in Luke, James and John asked Jesus if they could call down fire on a Samaritan village. Read that first. Then read the woman at the well being shocked He'd even talk to her.", "read": ["Luke 9:51-56", "John 4:7-9", "2 Kings 17:24-29 (where Samaritans came from)"], "journal": "James and John wanted to burn a Samaritan village. A week later Jesus made a Samaritan the hero. Who's the group you'd have a hard time hearing praised?"}, {"q": "What does King Benjamin say about who deserves help?", "intro": "King Benjamin takes the excuse away before you can make it. The beggar brought it on himself? Doesn't matter. Read his logic. Then read the line about serving people being the same as serving God. When you read, look for how he answers the objection \"but they don't deserve it.\"", "read": ["Mosiah 4:16-26", "Mosiah 2:17", "Alma 34:28-29"], "journal": "King Benjamin says we're all beggars. What have you received that you didn't deserve?"}, {"q": "What do apostles say about being the neighbor?", "intro": "President Dieter F. Uchtdorf, April 2010. He tells a story about a statue of Christ with no hands, and what somebody wrote on the sign.", "read": [{"talk": "You Are My Hands", "speaker": "Dieter F. Uchtdorf", "date": "April 2010", "section": "Read the whole thing."}], "takeaway": "His point is that Christ's love for people gets delivered through *us*, or it doesn't get delivered. He says we're His hands. He also says something that stings: we sometimes treat people badly and think it's fine because they're not in our ward or our group. The Samaritan didn't check the guy's tribe before he stopped.", "journal": "Uchtdorf says you're His hands. Whose hands were you this week? Whose weren't you?"}, {"q": "The priest and the Levite had reasons. What are yours?", "intro": "Here's the hard part. The priest and Levite weren't villains. Touching a dead body made you unclean for a week and they had temple duties. The road was dangerous and it could've been a trap. They had *reasons*. Good ones. So do you. Read these and then be honest about which of your reasons the Lord would accept.", "read": ["James 2:14-17", "1 John 3:16-18", "Matthew 25:41-45"], "journal": "Think of the last time you walked past someone who needed help. What was your reason? Would it hold up in Matthew 25?"}, {"q": "How do you become the Samaritan?", "intro": "The Samaritan did specific things. He saw, he went to him, he bandaged, he carried, he paid, he came back. Six verbs. Then read Matthew 25, where Jesus tells you exactly what counts, and D&C 81, where the Lord tells you what to do with hanging hands. When you read, look for the verbs and pick one.", "read": ["Luke 10:33-35 again", "Matthew 25:34-40", "D&C 81:5", "Preach My Gospel, lesson 5, \"Service\""], "journal": "Pick one person outside your normal circle. Do one of the Samaritan's six verbs for them this week. Write down who and which one."}, {"q": "What do I believe now?", "intro": "Back to the story. Read it once more. Then read your Day 1 answer.", "read": ["Luke 10:29-37", {"journal": [17, 1]}], "journal": "Answer the week's question: Who is your neighbor? And why did Jesus pick a Samaritan?"}]}, {"n": 18, "tag": "L3", "question": "Why is the older brother in the prodigal son story?", "intro": "Everybody knows the prodigal son. Kid takes his inheritance, blows it, comes home, dad runs to him. It's the greatest repentance story ever told. But the story doesn't end there. There's an older brother who did everything right and is furious. Jesus put him in on purpose. He was talking to Pharisees who were mad He ate with sinners. This week is about the brother nobody talks about, and why you might be him.", "days": [{"q": "What does the story say, all of it?", "intro": "Read the whole parable, but pay special attention to the last eight verses. The story doesn't end with the party. It ends with the older brother outside, refusing to come in, and the father going out to *him* too. When you read, notice how the father treats both sons.", "read": ["Luke 15:11-32"], "journal": "Which brother are you most like right now? Not which one you want to be. Which one you are."}, {"q": "How offensive was this to the people listening?", "intro": "In that culture, asking for your inheritance early was wishing your father dead. The father running was undignified; old men didn't run. And the older brother refusing to come to the feast was a public insult to his father in front of the whole village. Every person listening would have been shocked at all three. Then read who Jesus was actually talking to. That's the point of the whole chapter.", "read": ["Luke 15:1-2", "Luke 15:3-10 (the two stories He told first)", "Luke 18:9-14"], "journal": "The older brother's complaint is \"I never did anything wrong and I never got a party.\" When have you felt that about someone else's forgiveness?"}, {"q": "Who else got angry at God's mercy?", "intro": "Jonah. He preached to Nineveh, they repented, God spared them, and Jonah was furious. He literally asked God to kill him because God was too merciful. Read that. Then read Alma the Elder reacting when his rebellious son came home. One father was angry at mercy. The other rejoiced. When you read, look at what each one wanted.", "read": ["Jonah 4:1-11", "Mosiah 27:19-24", "Alma 36:5-6"], "journal": "God asks Jonah \"doest thou well to be angry?\" Where are you angry that God is merciful to someone?"}, {"q": "What does an apostle say about the older brother?", "intro": "Elder Jeffrey R. Holland, April 2002. He gave a whole talk on the older brother. It's called \"The Other Prodigal\" and the title is the point.", "read": [{"talk": "The Other Prodigal", "speaker": "Jeffrey R. Holland", "date": "April 2002", "section": "Read the whole thing."}], "takeaway": "His point is that the older brother was also lost, just not in a far country. He was lost at home, in resentment and comparison, keeping score. Holland says the father's line to him is the key: \"thou art ever with me, and all that I have is thine.\" The older brother already had everything and couldn't see it because he was looking at what his brother got.", "journal": "Holland says the older brother was lost in comparison. Who do you compare yourself to that makes you miss what you already have?"}, {"q": "Isn't the older brother right?", "intro": "Here's the hard part. His complaint is legitimate. He did stay. He did work. He never got the party. If you've been the faithful one while somebody else got the attention for coming back, you know exactly how he felt. So is grace unfair? Read the laborers again from Week 12. Then read Luke 15:7, which Jesus said before the story, and figure out what heaven thinks the party is for.", "read": ["Matthew 20:8-16", "Luke 15:7", "Luke 15:31-32 again", "Moroni 7:47"], "journal": "Is grace unfair? Write your honest answer, then write what you'd lose if God were fair by your math."}, {"q": "How do you stop keeping score?", "intro": "Repentance week (Week 11) was about turning. This is the other half: how you treat people who are turning. Read your Week 11 Day 7 answer first, where you rewrote \"repent\" in your own words. Then read how the Lord wants us to feel when somebody repents. When you read, look for the word \"joy.\"", "read": [{"journal": [11, 7]}, "Luke 15:5-7, 9-10", "D&C 18:13-16", "Alma 26:11-16"], "journal": "Think of someone who came back to church, or is trying to. Did you rejoice, or did you keep score? What would rejoicing actually look like this week?"}, {"q": "What do I believe now?", "intro": "Back to the father going out to the older son. Read those verses one more time. Then read your Day 1 answer.", "read": ["Luke 15:25-32", {"journal": [18, 1]}], "journal": "Answer the week's question: Why is the older brother in the story? And did you change your answer about which one you are?"}]}, {"n": 19, "tag": "", "question": "\"What lack I yet?\" What would Jesus tell you to sell?", "intro": "A rich young man kept every commandment and still felt like something was missing. He asked Jesus what. Jesus told him, and it was the one thing he wouldn't give up. He walked away sad. The question isn't whether he was a bad guy. He wasn't. The question is what Jesus would say to *you* if you asked, and whether you'd actually ask.", "days": [{"q": "What did he ask, and what did Jesus say?", "intro": "Read Matthew's account. Then read Mark's, which has one detail that changes the whole story: before Jesus answered, He looked at the man and loved him. This wasn't a rebuke. It was an invitation from someone who wanted him. When you read, notice that the man was actually good.", "read": ["Matthew 19:16-22", "Mark 10:17-22"], "journal": "If you asked Jesus \"what lack I yet\" and He actually answered, what do you think He'd say? Write your guess."}, {"q": "Why was everyone shocked?", "intro": "In that world, wealth meant God's favor. If you were rich you were obviously righteous. So when Jesus said it's hard for a rich man to enter the kingdom, the disciples were floored. If *he* can't get in, who can? Read their reaction and Jesus's answer. Then read what He'd said about treasure earlier.", "read": ["Matthew 19:23-26", "Matthew 6:19-21, 24", "Luke 12:15-21"], "journal": "The disciples assumed rich meant righteous. What do you assume means righteous? Success? Church calling? A good marriage?"}, {"q": "What does the Book of Mormon say about riches?", "intro": "Jacob, Nephi's brother, doesn't say money is evil. He says the *order* matters. Seek the kingdom first, then riches if you want, and only to do good. King Benjamin adds the rule. Alma shows the church getting it right for a while. When you read, look for the order and the purpose.", "read": ["Jacob 2:17-19", "Alma 1:29-31", "Mosiah 4:19-21"], "journal": "Jacob says seek the kingdom *first*. What are you actually seeking first, if you judge by your calendar and your bank account?"}, {"q": "What does a modern leader say about the question?", "intro": "Elder Larry R. Lawrence, October 2015. He built a whole talk on this one question and told stories of people who actually asked it.", "read": [{"talk": "What Lack I Yet?", "speaker": "Larry R. Lawrence", "date": "October 2015", "section": "Read the whole thing."}], "takeaway": "His point is that the question works. People who sincerely ask the Lord \"what lack I yet\" get an answer, and it's usually specific and small, not \"sell everything.\" A sister was told to stop complaining. A brother was told to get to church on time. He says the Spirit can tell you exactly what's next if you ask and mean it.", "journal": "Lawrence says the answers are usually small and specific. Ask tonight. Write down whatever comes, even if it seems dumb."}, {"q": "Does Jesus want everyone to sell everything?", "intro": "Here's the hard part. He told this guy to sell it all. Did He mean that for everyone? The early Saints in Acts actually did it, and then Ananias lied about it and dropped dead. The Lord gave Joseph Smith the law of consecration and most of the Saints couldn't live it. So what's the actual standard? Read these and figure out whether Jesus is asking for your stuff or something else.", "read": ["Acts 4:32-37", "Acts 5:1-11", "D&C 42:30-32", "D&C 105:1-5"], "journal": "Is the standard \"give everything\" or \"be willing to give everything\"? What's the difference in practice for you?"}, {"q": "What are you actually holding onto?", "intro": "The rich young man's thing was money. Yours might not be. It might be a grudge, a habit, an identity, a plan, or your comfort. The test is what you'd walk away sad rather than give up. Read Jesus on the cost, then read what the Lord promises to people who let go. When you read, look for what you get back.", "read": ["Luke 14:25-33", "Matthew 19:27-30", "Alma 22:15-18 (a king offering everything)", "Preach My Gospel, lesson 3, \"Endure to the End\""], "journal": "King Lamoni's father said \"I will give away all my sins to know thee.\" What's the one thing you'd have a hard time giving away? Write it. Then write what it's actually costing you."}, {"q": "What do I believe now?", "intro": "Back to Mark. Read it once more, especially \"Jesus beholding him loved him.\" Then read what you wrote on Day 1 and Day 4.", "read": ["Mark 10:17-22", {"journal": [19, 1]}, {"journal": [19, 4]}], "journal": "Answer the week's question: What would Jesus tell you to sell? And are you going to?"}]}, {"n": 20, "tag": "", "question": "Why did Jesus flip tables? When is anger right?", "intro": "Jesus walked into the temple, made a whip, and drove people out. Overturned tables. Coins everywhere. Twice, actually, once at the start of His ministry and once at the end. That's the same Jesus who said turn the other cheek. So either anger is sometimes right, or Jesus was inconsistent. Let's figure out which, because you're going to be angry at something this week, and it'd be good to know if you're allowed.", "days": [{"q": "What did He do, and what did He say?", "intro": "Read John's account, which is the early one and includes the whip. Then read Matthew's, which is the late one and includes what He quoted. When you read, notice what He's angry *about*. It's specific.", "read": ["John 2:13-17", "Matthew 21:12-17"], "journal": "What's the last thing that made you truly angry? Write it down. We'll test it this week."}, {"q": "What was going on in the temple?", "intro": "The moneychangers were in the Court of the Gentiles, the only part of the temple non-Jews were allowed in. It was supposed to be their place to pray. Instead it was a market, and a crooked one. Jesus quotes two scriptures when He clears it out: Isaiah, about the temple being for all nations, and Jeremiah, about a den of robbers. Read both. Then you'll know exactly what He was mad about.", "read": ["Isaiah 56:6-7", "Jeremiah 7:8-11", "Psalm 69:9 (\"zeal of thine house\")"], "journal": "Jesus was angry that people couldn't get to God because of what others were doing. When has someone's behavior kept you from God? When has yours kept someone else?"}, {"q": "When were Book of Mormon prophets angry?", "intro": "Captain Moroni tore his coat and made a flag. He was angry, and the scriptures call him a man of perfect understanding. Then read the Lord telling Joseph Smith exactly how to be sharp with someone: rarely, with the Spirit, and then with more love afterward. When you read, look for what separates righteous anger from the other kind.", "read": ["Alma 46:11-13, 19-21", "D&C 121:41-44", "Alma 48:11-13"], "journal": "D&C 121 says you can reprove with sharpness, but only when moved by the Spirit, and then show more love afterward. When's the last time you did the sharpness part without the love part?"}, {"q": "What does the prophet say about anger?", "intro": "President Russell M. Nelson, April 2023. He gave this talk about contention and it's blunt. Read it next to the table-flipping and see if you can hold both.", "read": [{"talk": "Peacemakers Needed", "speaker": "Russell M. Nelson", "date": "April 2023", "section": "Read the whole thing."}], "takeaway": "His point is that contention is of the devil, full stop, and that how we treat people who disagree with us is a test of discipleship. He says anger is never the right response to someone being wrong. That sounds like it contradicts Jesus in the temple, until you notice Jesus wasn't contending with anyone. He wasn't in an argument. He was clearing a room so people could pray.", "journal": "Nelson says how you treat people who disagree with you is a test. How'd you do this week?"}, {"q": "So is anger a sin or not?", "intro": "Here's the hard part. 3 Nephi 11 says contention is of the devil. Paul says be angry and sin not. Jesus flipped tables and also said whoever is angry with his brother is in danger. The Joseph Smith Translation removes \"without a cause\" from that verse. So when is anger right? Read these and find the line. It's there, but it's thin.", "read": ["3 Nephi 11:29-30", "Ephesians 4:26-27, 31", "Matthew 5:21-22 with the JST footnote", "James 1:19-20"], "journal": "Go back to what made you angry on Day 1. Was it the temple kind, where someone was blocking access to God? Or the other kind? Be honest."}, {"q": "How do you get angry the right way?", "intro": "Nephi got angry at his brothers and then called it a weakness he needed to fix. Moroni got angry and built a flag. The difference is what the anger *produced*. Read Proverbs on the soft answer, then read the Lord's instruction to Joseph about how to handle people who wrong you. When you read, look for what to do with the feeling.", "read": ["2 Nephi 4:27-29", "Proverbs 15:1", "D&C 98:23-27", "Preach My Gospel, chapter 6, \"Patience\""], "journal": "Next time you're angry this week, do one thing before you react: ask whether it's about someone getting to God or about you. Write down what happened."}, {"q": "What do I believe now?", "intro": "Back to the temple. Read John once more. Then read your Day 1 and Day 5 answers.", "read": ["John 2:13-17", {"journal": [20, 1]}, {"journal": [20, 5]}], "journal": "Answer the week's question: Why did Jesus flip tables? And when is your anger right?"}]}, {"n": 21, "tag": "L1", "question": "Why do we need another book? What does the Book of Mormon actually do?", "intro": "Most Christians have the Bible and think that's enough. We show up with a second book and say it's scripture too. Why? What does the Book of Mormon do that the Bible doesn't? If you can't answer that, you're carrying it around out of habit. This week is about what the book is *for*, according to the book itself and according to the prophets who told us to read it.", "days": [{"q": "Did the Bible say another book was coming?", "intro": "Ezekiel talks about two sticks, Judah's and Joseph's, being joined into one. Isaiah talks about a sealed book that a learned man can't read. Jesus says He has other sheep. Read these cold, without the Sunday School answers, and see what you'd make of them if you'd never heard of the Book of Mormon.", "read": ["Ezekiel 37:15-20", "Isaiah 29:11-14, 18", "John 10:16"], "journal": "Before this week, what would you have said to a friend who asked why you need a second book? Write it."}, {"q": "What did the Bible lose along the way?", "intro": "Nephi saw it in vision: a book going from the Jews to the Gentiles, and \"many plain and precious things\" taken out along the way. Not by bad people necessarily, just by time and copying and translation. The Book of Mormon calls itself the fix. Read Nephi's vision, then read what the Lord says about people who claim the Bible is enough.", "read": ["1 Nephi 13:24-29, 39-40", "2 Nephi 29:3-11", "Bible Dictionary, \"Bible\" (the section on how it came to us)"], "journal": "2 Nephi 29 has the Lord asking why people think He'd only talk to one nation. What's your honest reaction to that argument?"}, {"q": "What does the book say it's for?", "intro": "The title page was written by Moroni, and it states the purpose in one sentence. Read it. Then read the intro and Moroni's promise at the end. When you read, write down every purpose the book claims for itself. There are more than you'd think.", "read": ["Title Page of the Book of Mormon", "Introduction to the Book of Mormon (first four paragraphs)", "Moroni 10:3-5", "2 Nephi 25:26"], "journal": "The title page says the book exists to convince people that Jesus is the Christ. Has it done that for you, or do you believe in Jesus for other reasons?"}, {"q": "What does the prophet say the book does for you?", "intro": "President Russell M. Nelson, October 2017. He asks a question in the title and then answers it with a list.", "read": [{"talk": "The Book of Mormon: What Would Your Life Be Like without It?", "speaker": "Russell M. Nelson", "date": "October 2017", "section": "Read the whole thing."}], "takeaway": "His point is that the book isn't just true, it's *useful*. He lists what it does: it clarifies the Atonement, it teaches how the Holy Ghost works, it exposes the enemies of Christ, it gives you a covenant path. He says something is fundamentally wrong if you'd rather do anything else than read it. And he promises that reading it every day changes you, not just informs you.", "journal": "Nelson asks what your life would be like without it. Answer him. Honestly, what would be different?"}, {"q": "Why not just the Bible?", "intro": "Here's the hard part, and it's the one your friends ask. If the Bible is the word of God, why isn't it sufficient? Isn't adding to it exactly what Revelation warns about? Read the Revelation verse in context. Then read the Lord's argument about two witnesses. Then read a chapter that's only in the Book of Mormon and ask yourself what you'd lose without it.", "read": ["Revelation 22:18-19 (then check Deuteronomy 4:2, same warning, and the Bible kept adding books after it)", "2 Nephi 29:8", "2 Nephi 2:22-27 (the Fall explained; the Bible never does this)"], "journal": "Pick one thing you believe that comes *only* from the Book of Mormon. Write it down. What would you believe about that topic with just the Bible?"}, {"q": "How do you actually read it?", "intro": "Reading the Book of Mormon front to back is fine, but that's not how it changes you. Nelson's method: read with a question. Look for what it says about Christ. Mark it. Then read Moroni's promise as instructions, not a nice thought: read, remember, ask, with real intent. When you read, figure out what \"real intent\" means. It's more than sincere.", "read": ["Moroni 10:3-5 again, slowly", "Alma 37:38-46 (the Liahona worked by faith and attention)", "Preach My Gospel, lesson 1, \"The Book of Mormon: Another Testament of Jesus Christ\""], "journal": "Pick one question you want the Book of Mormon to answer. Write it down. Read one chapter tonight looking for it. Write what you found."}, {"q": "What do I believe now?", "intro": "Back to Ezekiel's two sticks. Read it one more time. Then read your Day 1 answer.", "read": ["Ezekiel 37:15-20", {"journal": [21, 1]}], "journal": "Answer the week's question the way you'd say it to that friend: Why do we need another book? What does it do?"}]}, {"n": 22, "tag": "L3", "question": "The last night. What did Jesus want us to remember?", "intro": "Jesus had one night left with His friends and He knew it. He washed their feet. He broke bread and said \"this is my body.\" He gave a new commandment. He prayed for them out loud. If you had one night, you'd say the things that mattered most. He did. And He told us to remember it every week, which most of us do on autopilot. This week we slow down and figure out what He actually asked us to remember.", "days": [{"q": "What did He do that night?", "intro": "Two scenes. John gives you the foot washing, which none of the other Gospels include. Luke gives you the sacrament, which John skips. Read both. When you read, notice that in both cases Jesus does something and then says \"do this.\"", "read": ["John 13:1-17", "Luke 22:14-20"], "journal": "Jesus said \"this do in remembrance of me.\" When you take the sacrament, what are you actually thinking about? Be honest."}, {"q": "What was the meal, and what did it mean to them?", "intro": "It was Passover. Every family in Jerusalem was eating lamb and unleavened bread to remember the night God's judgment passed over the houses with blood on the door. Jesus took that meal, the one about a lamb dying so Israel could live, and said the bread was Him now. Nobody at the table would have missed it. Read the original Passover, then read Paul's account of the sacrament, which is actually the earliest one written down.", "read": ["Exodus 12:1-14", "1 Corinthians 11:23-29"], "journal": "For 1,400 years Israel ate that meal to remember being saved. What are you remembering when you eat yours?"}, {"q": "What did the resurrected Christ say about it?", "intro": "He gave the sacrament to the Nephites too, in person, and explained it more plainly than He did in Jerusalem. Then read the prayers Moroni recorded, which are the same words you hear every Sunday. When you read the prayers, list the promises. There are three you make and one He makes.", "read": ["3 Nephi 18:1-12", "Moroni 4:3", "Moroni 5:2", "D&C 20:75-79"], "journal": "The prayer says you're willing to take His name, always remember Him, and keep His commandments. Which of the three is hardest for you right now?"}, {"q": "What does an apostle say the sacrament does?", "intro": "Elder David A. Bednar, April 2016. He explains why the sacrament isn't just a reminder. It does something.", "read": [{"talk": "Always Retain a Remission of Your Sins", "speaker": "David A. Bednar", "date": "April 2016", "section": "Read the whole thing."}], "takeaway": "His point is that the sacrament isn't a weekly re-baptism, it's how you *keep* the cleansing you already got. He says the ordinance is the Lord's way of letting you always retain a remission of your sins, not just receive one once. Which means what you do on Sunday during those few minutes actually matters, and it's not a passive thing.", "journal": "Bednar says the sacrament is how you *keep* clean, not just get clean. What would change if you treated it that way?"}, {"q": "Should you take it if you're struggling?", "intro": "Here's the hard part. Paul says whoever eats unworthily eats damnation to himself. Jesus told the Nephites not to let people partake unworthily. So if you messed up this week, do you skip it? Most people either take it without thinking or skip it out of shame, and both miss the point. Read these carefully. The word \"unworthily\" is doing a lot of work and it doesn't mean what most people think.", "read": ["1 Corinthians 11:27-29", "3 Nephi 18:28-30", "D&C 46:4", "Luke 5:31-32"], "journal": "Have you ever skipped the sacrament out of shame? Or taken it without thinking? Which one is closer to \"unworthily\" in Paul's sense?"}, {"q": "What else did He say to remember?", "intro": "Between the bread and the garden, Jesus said more in one night than in most of the rest of the Gospels combined. A new commandment. The Comforter. The vine. And a prayer for you, by name, in John 17. Read pieces of it. When you read, pick out what He most wanted them to hold onto.", "read": ["John 13:34-35", "John 14:26-27", "John 15:1-8", "John 17:20-23", "Preach My Gospel, lesson 3, \"The Gift of the Holy Ghost\" and the sacrament note"], "journal": "John 17:20 is Jesus praying for people who'd believe later. That's you. What do you want Him to have prayed for?"}, {"q": "What do I believe now?", "intro": "Next time you take the sacrament, read this first. Then read your Day 1 answer.", "read": ["Luke 22:19-20", "3 Nephi 18:7, 11", {"journal": [22, 1]}], "journal": "Answer the week's question: What did Jesus want us to remember? And what will you think about next Sunday?"}]}, {"n": 23, "tag": "L2", "question": "What happened in Gethsemane that didn't happen on the cross?", "intro": "Most Christians put the whole Atonement on the cross. We talk about the garden too. Why? What happened there that was different? Jesus bled from every pore in Gethsemane before anyone laid a hand on Him. Nobody was hurting Him. Something else was. This week is about what that something was, and what it means that it happened in a garden at night with three guys asleep nearby.", "days": [{"q": "What happened in the garden?", "intro": "Read Luke, because Luke was a doctor and he's the one who mentions the blood. Then read Mark, who gives you the disciples sleeping. When you read, notice Jesus's exact words in His prayer. He asked for a way out. Then He didn't take it.", "read": ["Luke 22:39-46", "Mark 14:32-42"], "journal": "Jesus asked if the cup could pass. He was allowed to ask. What have you been afraid to ask God to take away?"}, {"q": "What does \"Gethsemane\" mean, and what was the blood?", "intro": "Gethsemane means oil press. Olives were crushed there under a stone until the oil came out. That's where He went. King Benjamin, 120 years before it happened, described the blood coming from every pore. Isaiah, 700 years before, said the Lord would be *bruised* and that His soul would be made an offering. Read both prophecies, then Luke's verse again.", "read": ["Mosiah 3:7", "Isaiah 53:10-12", "Luke 22:44 again"], "journal": "An oil press. The Book of Mormon prophet who wrote about it 120 years early. Does knowing that make the garden feel more real to you, or less? Why?"}, {"q": "What was He actually feeling?", "intro": "D&C 19 is the only place in scripture where the Savior describes His own suffering in the first person. Read it slowly. Then read Alma, who explains *why* He had to feel it: so He'd know how to help you. Then Jacob, on what would have happened without it. When you read, look for the word \"every.\"", "read": ["D&C 19:15-19", "Alma 7:11-13", "2 Nephi 9:21-22"], "journal": "Alma 7:12 says He suffered so He would \"know according to the flesh how to succor his people.\" What's something you've gone through that you'd only trust someone who'd been through it too?"}, {"q": "What does an apostle say about the garden and the cross?", "intro": "President Dieter F. Uchtdorf, April 2018, Easter session. He walks through the last hours and what they cost.", "read": [{"talk": "Behold the Man", "speaker": "Dieter F. Uchtdorf", "date": "April 2018", "section": "Read the whole thing."}], "takeaway": "His point is that if you want to know who Jesus is, look at what He did in those hours: He chose it. Every step. He could have stopped at any point and didn't. Uchtdorf says the garden and the cross aren't two Atonements, they're one act of love that started in Gethsemane and finished on Golgotha, and the whole thing was for *you*, personally.", "journal": "Uchtdorf says He chose every step. What's one thing you're doing right now only because it's required? What would choosing it look like?"}, {"q": "If the garden was enough, why the cross?", "intro": "Here's the hard part. If He already suffered for sin in Gethsemane, why did He have to die too? And if the cross was the point, why the garden? Read these and figure out what each one did. It's not one or the other. And notice that in the garden He was still calling Him \"Father,\" and on the cross, for a moment, He wasn't. Next week is about that.", "read": ["3 Nephi 27:13-16", "Luke 22:42-44", "Mark 15:33-37", "D&C 18:11"], "journal": "What do you think the cross did that the garden didn't? Write your answer even if you're not sure."}, {"q": "How do you actually use it?", "intro": "The Atonement isn't something to admire from a distance. Alma says the Savior took on your infirmities so He could carry them *with* you. That means you're supposed to hand them over. Read King Benjamin on becoming a saint through the Atonement, then Alma's instruction, then the Lord's direct invitation. When you read, look for what you're supposed to do, not just feel.", "read": ["Mosiah 3:19", "Alma 7:14-16", "Matthew 11:28-30", "Preach My Gospel, lesson 2, \"The Atonement\""], "journal": "Name one thing you're carrying that you've never actually asked Him to help carry. Ask tonight. Write what you said."}, {"q": "What do I believe now?", "intro": "Back to the garden. Read Luke one more time. Then read what you wrote on Day 7 of Easter week, about why He had to die.", "read": ["Luke 22:41-44", {"journal": [13, 7]}], "journal": "Answer the week's question: What happened in Gethsemane that didn't happen on the cross? And has your Easter answer changed?"}]}, {"n": 24, "tag": "L2", "question": "\"Why hast thou forsaken me?\" Did the Father really leave?", "intro": "On the cross Jesus said something that should stop you: \"My God, my God, why hast thou forsaken me?\" If anyone had earned the Father's presence, He had. And He felt abandoned. Was He? Did the Father actually leave, or did it just feel that way? And if the Son of God could feel forsaken, what does that mean when you do?", "days": [{"q": "What did He say, and when?", "intro": "Read Matthew and Mark. Both give you the words in Aramaic first, which means it was remembered exactly. Then read the beginning of Psalm 22, because that's what He was quoting. When you read the Psalm, don't stop at verse 1.", "read": ["Matthew 27:45-50", "Mark 15:33-39", "Psalm 22:1-8"], "journal": "When have you felt forsaken by God? Write it down. Not the church answer. The actual time."}, {"q": "Why was He quoting a Psalm?", "intro": "Jews memorized the Psalms. When a rabbi quoted the first line of one, everyone knew he meant the whole thing. Psalm 22 starts with \"why hast thou forsaken me\" and describes pierced hands and feet and soldiers gambling for clothes, a thousand years before crucifixion existed. But read how it ends. It ends in triumph. Jesus was quoting a Psalm that finishes with God *not* hiding His face.", "read": ["Psalm 22:14-18", "Psalm 22:22-31", "Luke 23:44-46"], "journal": "The Psalm He quoted ends with God hearing the cry. Luke says His last words were \"Father, into thy hands.\" What does that tell you about the forsaken moment?"}, {"q": "How far down did He go?", "intro": "The Lord told Joseph Smith in Liberty Jail that the Son of Man had descended below *all* of it. Not most. All. That includes whatever you're in. Read the Lord's words to Joseph, then Paul on Christ becoming a curse, then the Book of Mormon on the depth of it. When you read, look for how low \"below them all\" goes.", "read": ["D&C 122:5-9", "Galatians 3:13", "2 Nephi 9:21", "D&C 88:6"], "journal": "\"Descended below them all.\" Is there something you've been through that you don't believe He understands? Write it. Then read D&C 122:8 again."}, {"q": "What does an apostle say about the forsaken moment?", "intro": "Elder Jeffrey R. Holland, April 2009. He gave this talk about the Savior being alone, and it's one of the most important talks on the Atonement given in your lifetime.", "read": [{"talk": "None Were with Him", "speaker": "Jeffrey R. Holland", "date": "April 2009", "section": "Read the whole thing."}], "takeaway": "His point is that the Father's presence *was* withdrawn, at least in some way, so that the Son could experience total alienation from God, the thing sin actually does to us. Holland says it had to be that way so Christ's triumph would be complete. And then he says the part that matters: because Jesus walked that road alone, you don't have to. He's been at the bottom, so there's no bottom He can't reach.", "journal": "Holland says Jesus walked it alone so you never have to. Do you believe that? What's the evidence in your own life?"}, {"q": "How could a loving Father do that?", "intro": "Here's the hard part. If the Father withdrew from His Son at the worst moment of His life, what kind of Father is that? Don't defend Him too fast. Read John 16, where Jesus says He'd be left alone but the Father would be with Him. Read the moment in the garden where an angel came. Read Abraham and Isaac, the only other story where a father walks a son up a hill. Sit with it.", "read": ["John 16:32", "Luke 22:43", "Genesis 22:1-14", "John 3:16"], "journal": "Abraham didn't have to go through with it. The Father did. What do you think that cost Him?"}, {"q": "What do you do when you feel forsaken?", "intro": "The Psalm Jesus quoted has the answer built in: God hasn't hidden His face, He heard. Isaiah says God can't forget you because you're engraved on His palms. Alma remembered one thing his father said and it was enough. When you read, look for what each person did with the feeling of being abandoned.", "read": ["Psalm 22:24", "Isaiah 49:14-16", "Alma 36:17-20", "D&C 121:1-3, 7-8"], "journal": "Go back to the time you wrote about on Day 1. Was He there? What do you see now that you didn't then?"}, {"q": "What do I believe now?", "intro": "Back to the cross. Read Matthew one more time, then the last verses of Psalm 22, then your Day 1 answer.", "read": ["Matthew 27:46", "Psalm 22:24-31", {"journal": [24, 1]}], "journal": "Answer the week's question: Did the Father really leave? And what does it mean for you when you feel like He has?"}]}, {"n": 25, "tag": "L2", "question": "What does resurrection actually mean for your body?", "intro": "We say \"He is risen\" every Easter, but ask most people what resurrection means for *them* and you get a vague answer about heaven. The scriptures are specific. Jesus ate fish. Thomas touched the holes. Alma says every limb and joint gets restored. This is about your actual body, the one that's aging and breaking, and what happens to it. It's more concrete than you think.", "days": [{"q": "What did the resurrected Jesus look like?", "intro": "Read Luke's account of Jesus appearing in the upper room. The disciples thought He was a ghost. He proved He wasn't by eating. Then read John, where Thomas gets to touch. When you read, notice everything physical about Him.", "read": ["Luke 24:36-43", "John 20:19-29"], "journal": "He had a body. He ate. He still had the wounds. What does it mean to you that the scars stayed?"}, {"q": "What did people believe about resurrection before Jesus?", "intro": "Most of the ancient world thought a bodily resurrection was ridiculous. Greeks laughed at Paul for it. The Sadducees, who ran the temple, didn't believe in it at all, and they tried to trap Jesus with a riddle about it. Read Paul getting mocked in Athens, then Jesus answering the Sadducees. When you read, notice that resurrection was a controversial idea, not an obvious one.", "read": ["Acts 17:30-34", "Matthew 22:23-33", "Job 19:25-27"], "journal": "The Sadducees couldn't imagine a resurrected life that made sense. What part of resurrection is hard for *you* to picture?"}, {"q": "What does the Book of Mormon say happens to your body?", "intro": "Alma and Amulek are the most specific about it anywhere in scripture. Every limb. Every joint. Every hair. And Alma 40 gives you the sequence: death, spirit world, then resurrection. Read them and write down what's restored and what isn't.", "read": ["Alma 11:42-45", "Alma 40:23", "2 Nephi 9:10-13"], "journal": "Alma 11:44 says restored to its \"proper and perfect frame.\" What's your proper and perfect frame? What do you think gets fixed?"}, {"q": "What does an apostle say about it?", "intro": "President Dallin H. Oaks, April 2000. He's a lawyer and he lays out resurrection like a case. It's clear.", "read": [{"talk": "Resurrection", "speaker": "Dallin H. Oaks", "date": "April 2000", "section": "Read the whole thing."}], "takeaway": "His point is that resurrection is universal and it's free. Everyone gets it, good and bad, because of Christ, no conditions. And it's *physical*: a body of flesh and bones, with deformities and disabilities gone. Oaks says the assurance of resurrection should change how we treat our bodies now and how we grieve. Death is real but it's not final, and that's not a metaphor.", "journal": "Oaks says resurrection should change how you grieve. Who have you lost? Does resurrection actually help, or does it feel like a distant idea?"}, {"q": "What happens between death and resurrection?", "intro": "Here's the hard part, because nobody knows the timing. Alma admits he doesn't know when resurrection happens for each person. What we do know is the spirit world exists and it's not idle. Read Alma being honest about what he doesn't know, then read Joseph F. Smith's vision of what the dead are doing. Then ask the harder question: what about people whose bodies were destroyed, or who were born with bodies that never worked?", "read": ["Alma 40:6-14", "D&C 138:11-19, 57-59", "Alma 11:43 again"], "journal": "Alma says he doesn't know the timing and it doesn't matter. What are you demanding to know about death that might not matter?"}, {"q": "How does resurrection change how you live now?", "intro": "Paul says if this life is all there is, we're the most miserable people alive, because we gave things up for nothing. But it's not. So how do you live like resurrection is real? Read Paul, then D&C 130 on what carries over, then Mosiah on what doesn't. When you read, look for what you keep.", "read": ["1 Corinthians 15:19-22, 54-58", "D&C 130:18-19", "Mosiah 16:7-11", "Preach My Gospel, lesson 2, \"The Resurrection and Judgment\""], "journal": "D&C 130 says the intelligence you gain here goes with you. What are you building right now that you'll still have after you're resurrected?"}, {"q": "What do I believe now?", "intro": "Back to the upper room. Read Luke once more, especially the fish. Then read your Day 1 answer.", "read": ["Luke 24:36-43", {"journal": [25, 1]}], "journal": "Answer the week's question: What does resurrection mean for your body? Say it plainly, like you'd say it at a funeral."}]}, {"n": 26, "tag": "L3", "question": "Why did Jesus have to leave for the Holy Ghost to come?", "intro": "Jesus told His disciples it was better for them that He go away. Better. Than having Jesus in the room. That's a strange thing to say, unless the thing coming next was actually better for them. The Holy Ghost is the part of the gospel most members can't explain. What is He? What does He do? Why is He worth trading Jesus's physical presence for? This week is about that trade.", "days": [{"q": "What did Jesus say about the trade?", "intro": "Read John 16. Jesus tells them plainly that His leaving is expedient, and then explains what the Comforter will do. Then read Acts 2, when it actually happens. When you read John, list what Jesus says the Spirit will do. There are at least five things.", "read": ["John 16:5-15", "Acts 2:1-8"], "journal": "Jesus said it was better for them that He leave. Would you have believed Him? Do you now?"}, {"q": "What does \"Comforter\" mean?", "intro": "The Greek is *parakletos*, which means someone called alongside you. A lawyer. An advocate. A helper who stands next to you. \"Comforter\" is a soft translation. It's closer to \"the one who has your back.\" Read the earlier Comforter promise, and then read the strange case of the Samaritans who were baptized but hadn't received the Holy Ghost yet. That gap is the whole reason confirmation exists.", "read": ["John 14:16-17, 26", "Acts 8:14-17", "Acts 19:1-6"], "journal": "Advocate. Helper. Someone who stands next to you. Which word for the Holy Ghost fits your experience of Him best?"}, {"q": "What does the Restoration say He actually does?", "intro": "Nephi lays out the order: repent, get baptized, receive the Holy Ghost, and *then* the Spirit shows you everything you should do. That last part is the point. Then read Moroni's list of gifts and the Lord's description of what happens when you have the Spirit as your constant companion. When you read, look for what the Holy Ghost does that nothing else can.", "read": ["2 Nephi 31:12-13", "2 Nephi 32:2-5", "Moroni 10:8-17", "D&C 121:45-46"], "journal": "2 Nephi 32:5 says the Holy Ghost will show you all things you should do. Is that your experience? When was the last time He showed you something specific?"}, {"q": "What does an apostle say about receiving Him?", "intro": "Elder David A. Bednar, October 2010. He says the confirmation prayer is a command, not a statement, and that changes everything.", "read": [{"talk": "Receive the Holy Ghost", "speaker": "David A. Bednar", "date": "October 2010", "section": "Read the whole thing."}], "takeaway": "His point is that when you were confirmed, you were told to \"receive the Holy Ghost,\" and that's an instruction you have to act on continually, not something that happened to you once. Receiving Him means wanting Him, inviting Him, and getting rid of the stuff that pushes Him out. He lists what that looks like: sincere desire, worthiness, and obedience. It's not passive.", "journal": "Bednar says \"receive\" is a command you keep obeying. What's one thing in your life that's pushing the Spirit out right now?"}, {"q": "Why can't I feel Him?", "intro": "Here's the hard part. You were confirmed. You're trying. And most days you don't feel anything. Is that your fault, His, or is that just how it works? Read Nephi telling his brothers they were \"past feeling.\" Read King Benjamin on what withdraws the Spirit. Read the Lord's warning about what makes the heavens withdraw. Then be honest about which applies to you, if any.", "read": ["1 Nephi 17:45", "Mosiah 2:36-37", "D&C 121:37", "Helaman 4:24"], "journal": "Is it possible you've been feeling Him and calling it something else? Or is there something specific keeping Him out? Write whichever is true."}, {"q": "How do you get Him to stay?", "intro": "Paul lists the fruit of the Spirit, which is really a list of how you know He's there. The Lord tells Hyrum Smith to trust the Spirit that leads to do good, which is a simple test. And Nephi saw the disciples pray for the thing they most desired, and it was this. When you read, look for what you *do* to have Him.", "read": ["Galatians 5:22-25", "D&C 11:12-14", "3 Nephi 19:9", "Preach My Gospel, lesson 3, \"The Gift of the Holy Ghost\""], "journal": "Pick one thing from Galatians 5:22-23 you'd like more of. What would you do differently tomorrow to make room for it?"}, {"q": "What do I believe now?", "intro": "Back to John 16. Read Jesus's promise one more time. Then read what you wrote in Week 6 about being born of the Spirit, and your Day 1 answer.", "read": ["John 16:7, 13", {"journal": [6, 7]}, {"journal": [26, 1]}], "journal": "Answer the week's question: Why did Jesus have to leave for the Holy Ghost to come? And was it a good trade?"}]}, {"n": 27, "tag": "", "question": "Why did God convert Saul, the guy killing Christians, instead of someone nicer?", "intro": "Saul of Tarsus held the coats while Stephen was stoned. He hunted Christians from house to house. He was on his way to arrest more of them when Jesus knocked him off his horse. And God made *that* guy the greatest missionary in history. Not one of the nice, faithful disciples who'd been there from the start. Saul. Why? What does that say about who God uses, and who's too far gone?", "days": [{"q": "Who was Saul, and what happened on the road?", "intro": "Read who he was before. He wasn't confused or lukewarm. He was actively destroying the Church and thought he was serving God. Then read the road to Damascus. When you read, notice the first question Jesus asks, and what Saul calls Him back.", "read": ["Acts 8:1-3", "Acts 9:1-22"], "journal": "Jesus asked Saul \"why persecutest thou me?\" Not \"my church.\" Me. Who have you been hard on that Jesus might take personally?"}, {"q": "How committed was he to being wrong?", "intro": "Saul wasn't a thug. He was a Pharisee of Pharisees, trained by the best rabbi alive, blameless under the law by his own account. He persecuted Christians because he was *zealous*, not lazy. Read his own description of his résumé and what he did with it. Then read Jesus's line about kicking against the pricks, which means he'd been fighting his own conscience for a while.", "read": ["Philippians 3:4-8", "Acts 26:9-15", "Acts 22:3-5"], "journal": "Saul was sincere, educated, and completely wrong. What are you sincerely sure about that you've never actually checked?"}, {"q": "Who's the Book of Mormon version?", "intro": "Alma the Younger. Son of the prophet, going around with the king's sons trying to destroy the Church, and an angel knocks him flat. Same pattern. Read it, then read Alma describing it from the inside years later. When you read, compare the two conversions and see what they have in common.", "read": ["Mosiah 27:8-24", "Alma 36:6-10", "Alma 36:17-21"], "journal": "Both Saul and Alma were struck down and couldn't see. Both got up different. Has God ever had to knock you flat to get your attention?"}, {"q": "What does an apostle say about who you've been?", "intro": "Elder Dale G. Renlund, April 2015. He talks about a man who told him \"you don't know my past\" and what Renlund said back.", "read": [{"talk": "Latter-day Saints Keep on Trying", "speaker": "Dale G. Renlund", "date": "April 2015", "section": "Read the whole thing."}], "takeaway": "His point is that God cares a lot more about who you are and who you're becoming than about who you were. He quotes a friend who said a Latter-day Saint is a sinner who keeps on trying, and that's the whole definition. Renlund says we have to stop judging people by their worst moment, because God doesn't, and Saul is the proof.", "journal": "Renlund says God cares more about who you're becoming than who you've been. Who's the person you've written off based on who they were?"}, {"q": "Why Saul, and is a dramatic conversion better?", "intro": "Here's the hard part. Most people don't get knocked off horses. They grow up in the Church, feel the Spirit quietly, and never have a Damascus road. Are those people missing something? Paul himself says God chose him as a *pattern*, the worst case, to show nobody's out of reach. And Elijah learned God was in the still small voice, not the earthquake. Read these and figure out whether your quiet faith is less than Paul's loud one.", "read": ["1 Timothy 1:12-16", "1 Kings 19:11-12", "Alma 36:23-24", "3 Nephi 9:20 (Lamanites baptized with fire \"and they knew it not\")"], "journal": "Do you secretly wish you'd had a Damascus road? What has your slower conversion given you that Saul's didn't?"}, {"q": "What did Paul do with his past?", "intro": "He never hid it. He told the story of who he'd been in front of kings, in front of mobs, in letters. His past became the proof of the message. Alma did the same thing with his sons. When you read, notice how they use the worst thing about themselves. Then read who was praying for Alma, because somebody was.", "read": ["Acts 26:12-20", "Alma 36:24-26", "Mosiah 27:14"], "journal": "Mosiah 27:14 says Alma was struck down because his father and the church had been praying for him. Who are you praying for by name? If nobody, pick one and start tonight."}, {"q": "What do I believe now?", "intro": "Back to the road. Read Acts 9 one more time. Then read your Day 1 answer.", "read": ["Acts 9:3-6, 15-16", {"journal": [27, 1]}], "journal": "Answer the week's question: Why did God pick Saul? And who does that mean He'd pick now?"}]}, {"n": 28, "tag": "L1", "question": "Peter's vision. How does the Church change its mind?", "intro": "For years the Church was Jewish only. Then Peter had a vision of unclean animals and a voice telling him to eat. He said no three times. Then a Roman centurion's messengers knocked on his door, and Peter changed the whole direction of the Church. Not because he wanted to. Because God told him. So how does that work? When does the Church change, and how do you tell the difference between God changing it and people changing it?", "days": [{"q": "What happened on the rooftop?", "intro": "Read the whole thing, including Peter's refusal. He argued with the voice from heaven. Three times. Then read what happened when he got to Cornelius's house and the Spirit fell on Gentiles before anyone baptized them. When you read, notice how Peter explains it to the Jewish members afterward, and how they react.", "read": ["Acts 10:9-23", "Acts 10:34-35, 44-48", "Acts 11:1-18"], "journal": "Peter said \"not so, Lord\" three times. What's something you'd say \"not so\" to if God asked you to change it?"}, {"q": "Why was this so hard for them?", "intro": "Kosher wasn't a preference. It was Moses. It was the law God gave them. Jews had died rather than eat pork. Now a voice was telling Peter to eat, and then to go into a Gentile's house, which made you unclean. This wasn't a policy change. It felt like betraying everything. Read the law they were keeping, then read the council that had to sort it out, because it didn't get settled on the rooftop.", "read": ["Leviticus 11:1-8", "Acts 15:1-11", "Acts 15:19-20, 28-29"], "journal": "Acts 15 shows the apostles arguing about it before they agreed. Does it bother you that revelation involved a debate? Why or why not?"}, {"q": "How has the Church changed in our day?", "intro": "The Restoration has its own rooftops. Official Declaration 1 ended plural marriage. Official Declaration 2 extended the priesthood to all worthy men. Both were revelation. Both changed things people had been sure were permanent. Read them, then read the ninth Article of Faith, which is the doctrine that makes change possible.", "read": ["Official Declaration 1 (the declaration itself)", "Official Declaration 2", "Articles of Faith 1:9", "D&C 1:38"], "journal": "The ninth Article of Faith says God will *yet* reveal many things. What's something you hope changes? What's something you hope doesn't?"}, {"q": "What does an apostle say about leaders and mistakes?", "intro": "President Dieter F. Uchtdorf, October 2013. He said out loud that Church leaders have made mistakes. Then he said why he stays anyway.", "read": [{"talk": "Come, Join with Us", "speaker": "Dieter F. Uchtdorf", "date": "October 2013", "section": "Read the whole thing."}], "takeaway": "His point is that the Church is run by imperfect people, that things have been said and done that weren't in harmony with doctrine, and that God works through us anyway. He says doubt your doubts before you doubt your faith, and that leaving over the imperfections means missing what the Church actually is. He's honest about the mess and still says come.", "journal": "Uchtdorf admits leaders have been wrong. Does that make it easier or harder for you to follow them? Why?"}, {"q": "How do you tell revelation from culture?", "intro": "Here's the hard part, and it's a real one. Some things the Church used to teach were cultural, not doctrinal, and later got dropped. So how do you know which is which *now*? Paul had to confront Peter to his face about backsliding on this exact issue. Read that. Then read what the Lord says is doctrine versus what people add. Then read the test in D&C 50.", "read": ["Galatians 2:11-14", "D&C 10:67-68", "3 Nephi 11:38-40", "D&C 50:23-24"], "journal": "Peter, the prophet, was wrong for a while and Paul called him on it. What do you do with the fact that prophets can be wrong on some things and still be prophets?"}, {"q": "How do you follow a Church that changes?", "intro": "The answer is the same one Peter gave: you go where the Spirit says, even when you argued first. The Lord says receive the prophet's word in patience and faith. He also says decisions come from a unanimous quorum, not one man. When you read, look for what protects the Church from changing wrong, and what your part is.", "read": ["D&C 21:4-6", "D&C 107:27-31", "Mosiah 29:26-27", "Preach My Gospel, lesson 1, \"The Church of Jesus Christ Is Restored\""], "journal": "Pick one thing the prophet has asked recently that you haven't done yet. Why not? Write the real reason, then decide."}, {"q": "What do I believe now?", "intro": "Back to the rooftop. Read Peter's three refusals and what came after. Then read your Day 1 answer.", "read": ["Acts 10:13-16, 34-35", {"journal": [28, 1]}], "journal": "Answer the week's question: How does the Church change its mind? And how do you follow it when it does?"}]}, {"n": 29, "tag": "", "placeholder": "April 2027 General Conference", "question": "Conference week. Which talk from April got under your skin?", "intro": "This week is different. No topic picked ahead of time. Instead you pick one talk from April 2027 general conference, the one that either hit you hardest or bugged you the most (both count), and we spend the week taking it apart. The prophets just spoke. You're going to actually do something with it. Before Day 1, pick your talk. Write the speaker and title in your Day 1 journal.", "days": [{"q": "What did the speaker actually say?", "intro": "Read the whole talk, start to finish, no skipping. Not the summary. Not the highlights video. The talk. When you read, mark the one sentence that stopped you, and the one sentence you disagreed with or didn't understand. There's always one of each.", "read": ["Your talk, the whole thing"], "journal": "Write the speaker and title. Then write the sentence that stopped you and the sentence you pushed back on."}, {"q": "What scriptures did they build it on?", "intro": "Conference talks are scripture stacked on scripture. Go back through your talk and list every scripture the speaker cited. Then read at least three of them in context, meaning the verses around them, not just the one line. When you read, figure out why the speaker picked *that* verse and not a different one.", "read": ["Every scripture cited in your talk (list them)", "Three of them, read in context"], "journal": "Which scripture was doing the most work in the talk? Did reading it in context change what you thought the speaker meant?"}, {"q": "What does the rest of scripture say about it?", "intro": "Now find your own. Take the talk's main point and find two scriptures the speaker *didn't* use, one from the Book of Mormon and one from the Doctrine and Covenants, that teach the same thing. Use the Topical Guide or the search bar. This is the part where you stop being an audience and start being a student.", "read": ["One Book of Mormon passage on the talk's main point (you find it)", "One D&C passage on the same point (you find it)"], "journal": "Write the two references you found. Did either one say it better than the talk?"}, {"q": "Who else talked about it?", "intro": "Nobody at conference speaks alone. There's almost always another talk in the same conference on a related topic, sometimes deliberately. Find one. Read it. Then compare. When you read, look for where the two speakers agree and where they come at it from different angles.", "read": ["A second talk from April 2027 on a related topic"], "takeaway": "Write your own. Two or three sentences on what the second speaker added that the first didn't.", "journal": "Two apostles, same topic. What did the second one see that the first one didn't say?"}, {"q": "What did they ask you to do that you don't want to?", "intro": "Here's the hard part. Every conference talk has an ask in it. Usually it's clear. Sometimes it's between the lines. Find the ask in your talk and then be honest about whether you want to do it. If you do, it's probably not the real ask. Look harder.", "read": ["Your talk again, just the last third", "D&C 1:37-38"], "journal": "What did the speaker ask you to do? Write the actual ask. Then write why you haven't done it yet."}, {"q": "Do it.", "intro": "No reading today. Or almost none. Take the ask from Day 5 and do the first step of it. Today. Then come back and write what happened. If the ask is too big for one day, do the part that fits in one day. If you can't figure out what the first step is, that's the journal entry.", "read": ["Your Day 5 journal entry", {"journal": [29, 5]}], "journal": "What did you do? What happened? What's the next step?"}, {"q": "What do I believe now?", "intro": "Read your Day 1 entry, both sentences. Then reread the paragraph of the talk that had the sentence that stopped you.", "read": [{"journal": [29, 1]}, "That one paragraph of your talk"], "journal": "Rewrite the talk's main point in your own words, in two sentences, the way you'd say it to a friend who didn't watch conference."}]}, {"n": 30, "tag": "L3", "question": "\"Saved by grace.\" Why do we get weird about that word?", "intro": "Ask a Latter-day Saint about grace and you'll often get a nervous pivot to works. \"Well, it's after all we can do.\" We've been so worried about sounding like we get a free pass that we've made grace sound like a bonus for people who earned it. Paul would have a problem with that. So would Nephi, actually. This week is about what grace really is, and why it should make you relax, not squirm.", "days": [{"q": "What did Paul actually say?", "intro": "Read Romans 3 and Ephesians 2. Paul is blunt: nobody earns it. Not you, not the most obedient person you know. When you read, count how many times he says \"not of works.\" Then notice what Ephesians 2:10 says right after, because people stop at verse 9.", "read": ["Romans 3:20-28", "Ephesians 2:4-10"], "journal": "What's your gut reaction when someone says \"saved by grace alone\"? Write it. That reaction is what we're studying this week."}, {"q": "What did \"grace\" mean to them?", "intro": "The Greek is *charis*. It means a gift, a favor, kindness you didn't earn and can't pay back. In Paul's world it was the word for what a patron gave a client. The client couldn't repay it. He could only be grateful and loyal. That's the relationship Paul is describing. Read him explaining what grace did while we were still enemies. Then read the parable Jesus told about it.", "read": ["Romans 5:1-8", "Matthew 18:23-27", "Bible Dictionary, \"Grace\""], "journal": "Romans 5:8 says Christ died for us while we were still sinners. Not after we got our act together. What does that do to the idea of earning it?"}, {"q": "What does \"after all we can do\" actually mean?", "intro": "Here's the verse everybody quotes wrong. Nephi says we're saved by grace \"after all we can do.\" People read that as \"you do your part, then grace covers the gap.\" But read the rest of the Book of Mormon. Anti-Nephi-Lehies said all they could do was repent. Moroni says grace makes you perfect, not you plus grace. Read these and decide what \"all we can do\" actually is.", "read": ["2 Nephi 25:23", "Alma 24:10-11", "2 Nephi 10:24", "Moroni 10:32-33"], "journal": "If \"all we can do\" is repent and come unto Christ, does that change how you read 2 Nephi 25:23? What did you used to think it meant?"}, {"q": "What does an apostle say about grace?", "intro": "President Dieter F. Uchtdorf, April 2015. He gave a whole talk on grace and it fixed a lot of people's theology.", "read": [{"talk": "The Gift of Grace", "speaker": "Dieter F. Uchtdorf", "date": "April 2015", "section": "Read the whole thing."}], "takeaway": "His point is that grace isn't the gap-filler after you've done your best. It's the whole thing. He says you can't earn heaven any more than you can earn your own birth. But then he says the part that matters: grace changes what you *want*. Once you get it, you obey out of love, not to pay a bill. Obedience is the result of grace, not the price of it.", "journal": "Uchtdorf says obedience is what grace produces, not what buys it. Which direction have you been running it?"}, {"q": "If grace is free, why bother with commandments?", "intro": "Here's the hard part, and it's the objection that makes us nervous. If grace covers everything, why not just sin? Paul heard that exact question and answered it. Read Romans 6. Then read James, who seems to disagree with Paul and doesn't. Then read the Lord's own explanation of how grace grows. Figure out why grace and commandments aren't opposites.", "read": ["Romans 6:1-4, 14-18", "James 2:17-24", "D&C 93:12-14, 19-20", "Helaman 12:23-24"], "journal": "Paul says \"shall we sin that grace may abound? God forbid.\" Why not? Answer it in your own words, not his."}, {"q": "How do you actually live in grace?", "intro": "Grace isn't a doctrine you agree with. It's a way of standing. King Benjamin says even if you served God with your whole soul you'd still be in debt, and that's supposed to be freeing, not crushing. Read him. Then read Ether 12:27, where weakness is the entry point, not the disqualifier. When you read, look for the posture. What does a person who lives in grace act like?", "read": ["Mosiah 2:20-25", "Ether 12:27", "Philippians 2:12-13", "Preach My Gospel, lesson 3, \"Faith in Jesus Christ\""], "journal": "Pick one thing you've been doing to earn God's approval. Do it this week for a different reason, because you love Him, and write down whether it felt different."}, {"q": "What do I believe now?", "intro": "Back to Ephesians 2. Read all seven verses this time, including verse 10. Then read your Day 1 gut reaction.", "read": ["Ephesians 2:4-10", {"journal": [30, 1]}], "journal": "Answer the week's question: What is grace? And why did you ever get weird about it?"}]}, {"n": 31, "tag": "L2", "question": "Why did you come to earth? What is mortality actually for?", "intro": "You're here. You didn't ask to be, at least not that you remember. And most days you're too busy to ask why. Preach My Gospel calls it the plan of salvation and lays out the whole thing in a few pages: where you came from, why you're here, where you're going. This week is the middle part. Why *here*, why a body, why suffering, why a test you didn't sign up for. Except you did.", "days": [{"q": "What did God say you're here for?", "intro": "Abraham saw it before it started. God showed him the spirits and said He'd make an earth and \"prove them.\" That's the plan in one verse. Then read Alma explaining what the proving is, and Paul on what it's supposed to produce. When you read, look for the purpose in each one. They're not identical.", "read": ["Abraham 3:22-26", "Alma 12:24", "Romans 8:16-18"], "journal": "Abraham 3:25 says the test is whether you'll do what God commands. Is that how you'd describe your life? What would you say it's a test of?"}, {"q": "What did the ancients think life was for?", "intro": "Ecclesiastes is the most honest book in the Bible. The writer tried everything, money, pleasure, wisdom, work, and called it all vanity. Read him at his lowest and then at his conclusion. Then read Jesus defining eternal life in one sentence in John 17. When you read, notice that Jesus doesn't define it as a place.", "read": ["Ecclesiastes 1:2-9", "Ecclesiastes 12:13-14", "John 17:3"], "journal": "Ecclesiastes says everything's vanity without God. What are you chasing that would be vanity if this life were all there was?"}, {"q": "What does the Restoration add?", "intro": "Three things nobody else teaches. Lehi says the Fall was on purpose so we could have joy. The Lord says spirit and body together is the point, not the problem. And Moses 1:39 says God's whole work is *us*. Read them and put them together. When you read, look for what mortality gives you that you couldn't get before it.", "read": ["2 Nephi 2:22-25", "D&C 93:33-34", "Moses 1:39", "Alma 34:32-34"], "journal": "D&C 93:33-34 says you can't have a fulness of joy without a body. What's something joyful you can only do because you have one?"}, {"q": "What does an apostle say about the plan?", "intro": "President Dieter F. Uchtdorf, October 2016. He lays out the plan of salvation and asks why it matters that you know it.", "read": [{"talk": "O How Great the Plan of Our God!", "speaker": "Dieter F. Uchtdorf", "date": "October 2016", "section": "Read the whole thing."}], "takeaway": "His point is that knowing the plan changes how you handle everything in it. If you know where you came from and where you're going, the middle makes sense even when it hurts. He says the plan isn't about getting through mortality, it's about becoming something in it. And he says God's not grading you on a curve against other people. He's working on *you*.", "journal": "Uchtdorf says knowing the plan changes how you handle the hard parts. What hard part would look different if you actually believed you chose to come here?"}, {"q": "If it's a test, why so much pointless suffering?", "intro": "Here's the hard part. \"Life is a test\" sounds fine until a kid gets cancer. What's that testing? Not everything hard is a lesson. Some of it is just the world being broken. Read Alma 62, where the same war made some people humble and others hard. Read Hebrews on chastening. Read the Lord's words to Joseph in Liberty. Then decide whether \"test\" is the right word, or whether \"school\" or something else fits better.", "read": ["Alma 62:41", "Hebrews 12:5-11", "D&C 122:7", "Job 23:10"], "journal": "Alma 62:41 says the same affliction softened some and hardened others. What's the thing in your life that could go either way right now?"}, {"q": "How do you live like you know why you're here?", "intro": "The Lord says don't wait to be commanded, use your agency to do good. King Benjamin describes what happy people who keep the commandments look like. And Lehi says the whole point is joy. Not later. Now. When you read, look for what living on purpose actually involves. It's simpler than a mission statement.", "read": ["D&C 58:26-28", "Mosiah 2:41", "2 Nephi 2:25", "Preach My Gospel, lesson 2, \"Our Life on Earth\""], "journal": "Moses 1:39 says God's work is your immortality and eternal life. Write one sentence: what's *your* work? Then write what you'll do about it this week."}, {"q": "What do I believe now?", "intro": "Back to Abraham 3. Read it one more time. Then read your Day 1 answer.", "read": ["Abraham 3:24-26", {"journal": [31, 1]}], "journal": "Answer the week's question: Why did you come to earth? Say it like you actually believe you chose it."}]}, {"n": 32, "tag": "", "question": "Charity. Is it just being nice?", "intro": "Paul says without charity you're nothing. Not less. Nothing. Moroni says the same thing. So it matters what the word means. Most people hear \"charity\" and think of donations or being pleasant. Paul and Moroni meant something a lot harder and a lot more specific. This week is about what charity actually is and how you get it, since apparently you can't do without it.", "days": [{"q": "What did Paul say it is?", "intro": "Read 1 Corinthians 13 like you've never heard it at a wedding. Paul lists what charity is and isn't. When you read, turn each one into a question about yourself. \"Charity suffereth long.\" Do you? \"Is not easily provoked.\" Are you?", "read": ["1 Corinthians 13:1-13"], "journal": "Go through the list in verses 4 through 7. Write down the one you're worst at."}, {"q": "What word was Paul using?", "intro": "Greek has several words for love. *Eros* is desire. *Philia* is friendship. Paul used *agape*, which is love that doesn't depend on the other person deserving it. It's the word John uses for God loving the world. And here's the best example: when the resurrected Jesus asks Peter \"lovest thou me\" three times, He uses agape twice and Peter answers with philia both times. Read it with that in mind.", "read": ["John 21:15-17", "John 3:16", "Luke 6:32-36"], "journal": "Peter couldn't say \"agape\" back to Jesus. He could only say \"I'm your friend.\" Is that where you are? Is that okay?"}, {"q": "What does Moroni add?", "intro": "Moroni gives the definition Paul didn't: charity is the pure love of Christ. Not your love for Christ. *His* love, in you. And then he tells you how to get it, and it isn't by trying harder. Read him. Then read Nephi and Ether on what the Lord does with people who have it. When you read, look for the mechanism.", "read": ["Moroni 7:44-48", "2 Nephi 26:30", "Ether 12:33-34"], "journal": "Moroni says pray for it \"with all the energy of heart.\" Have you ever actually prayed for charity? Not for a person. For the thing itself."}, {"q": "What does an apostle say about loving Him?", "intro": "Elder Jeffrey R. Holland, October 2012. He takes the John 21 conversation from Day 2 and builds a whole talk on what Jesus was really asking Peter.", "read": [{"talk": "The First Great Commandment", "speaker": "Jeffrey R. Holland", "date": "October 2012", "section": "Read the whole thing."}], "takeaway": "His point is that when Jesus asked Peter if he loved Him, the answer wasn't supposed to be words. It was \"feed my sheep.\" Love that doesn't do something isn't the kind He's talking about. Holland says Peter had gone back to fishing after the Resurrection, and Jesus had to come get him and say: not this, that. Go take care of people. That's how you love me.", "journal": "Holland says loving Christ means feeding His sheep. Who are the sheep you've been walking past on your way back to the boat?"}, {"q": "Do you have to love people you don't like?", "intro": "Here's the hard part. Charity \"beareth all things.\" Does that mean you put up with anything? \"Thinketh no evil.\" Does that mean you ignore red flags? And can you actually love someone you can't stand? John says if you hate your brother you don't love God, period. Read these and figure out what charity requires with the person you like least.", "read": ["1 John 4:20-21", "Matthew 5:43-47", "1 Corinthians 13:7 again, with the footnotes", "D&C 121:41-43 (charity includes reproving)"], "journal": "Name the person you have the hardest time loving. What would charity toward them actually require? Not niceness. Charity."}, {"q": "How do you get it?", "intro": "Moroni said pray. King Benjamin adds what to do while you're praying: teach your kids, help people, don't turn away the beggar. And the Lord says let your bowels be full of charity toward *everyone*. When you read, look for the connection between praying for it and doing it. They're not separate steps.", "read": ["Moroni 7:48 again", "Mosiah 4:14-16", "D&C 121:45", "Preach My Gospel, chapter 6, \"Charity and Love\""], "journal": "Pray for charity tonight, with all the energy of heart, and name the person from Day 5 in the prayer. Then do one charitable thing for them this week. Write what you did."}, {"q": "What do I believe now?", "intro": "Back to 1 Corinthians 13. Read verses 4 through 7 one more time. Then read your Day 1 answer.", "read": ["1 Corinthians 13:4-8", {"journal": [32, 1]}], "journal": "Answer the week's question: What is charity? And is it more than being nice?"}]}, {"n": 33, "tag": "", "question": "\"Through a glass, darkly.\" How much are we supposed to know?", "intro": "Paul admits he sees dimly. He knows in part. That's Paul, who saw the resurrected Christ and got caught up to the third heaven. If *he* only knew in part, what are the odds you know the whole thing? This week is about living with questions that don't have answers yet. Which is most of them. And figuring out whether that's a problem or the design.", "days": [{"q": "What did Paul admit he didn't know?", "intro": "Read the end of 1 Corinthians 13, which most people skip because they stop at charity. Then read chapter 2, where Paul says the things of God can't be figured out by the natural man. When you read, notice he's not apologizing for not knowing. He's describing how it works.", "read": ["1 Corinthians 13:9-12", "1 Corinthians 2:9-14"], "journal": "What's the gospel question you most wish you had an answer to? Write it down. We're not going to answer it this week. We're going to figure out what to do with it."}, {"q": "What was the glass?", "intro": "Corinth was famous for bronze mirrors. Polished metal, not glass. You could see yourself, sort of, dim and warped. That's Paul's image: you can see something real, but not clearly, and not all of it. Moses said the same thing centuries earlier. The secret things belong to God. What's revealed is ours. Read both and figure out where the line is.", "read": ["Deuteronomy 29:29", "Isaiah 55:8-9", "Job 38:1-7 (God answering Job's questions with more questions)"], "journal": "God answered Job's demand for answers with sixty questions of His own. What does that tell you about how He handles \"why\"?"}, {"q": "What does the Book of Mormon say about not knowing?", "intro": "Alma says faith is *not* a perfect knowledge, on purpose. The Lord withheld some of Christ's teachings from the record to try people's faith. And D&C 121 promises all mysteries will eventually be revealed. Eventually. When you read, look for why God withholds and what He promises about it.", "read": ["Alma 32:21", "3 Nephi 26:9-11", "D&C 121:26-32", "2 Nephi 28:30"], "journal": "3 Nephi 26 says the Lord held things back to try your faith. Does that feel like a test or a trick? Why?"}, {"q": "What does an apostle say about unanswered questions?", "intro": "President Dallin H. Oaks, October 2019. He gave a talk on the things we don't know and the things we do, and he was careful about the line.", "read": [{"talk": "Trust in the Lord", "speaker": "Dallin H. Oaks", "date": "October 2019", "section": "Read the whole thing."}], "takeaway": "His point is that there are things about the next life we simply haven't been told, and that guessing beyond what's revealed usually causes more harm than good. He lists questions people ask him that he can't answer. And then he says the thing that matters: you don't have to know everything to trust the One who does. Trust isn't a substitute for knowledge. It's what you do while you wait for it.", "journal": "Oaks lists things he doesn't know. Does it help or bother you that an apostle says \"I don't know\" out loud?"}, {"q": "What do you do with a question that has no answer?", "intro": "Here's the hard part. Some questions won't get answered in this life. The Church says so. So do you shelve them, obsess over them, or leave over them? Read Jacob, who says people who look beyond the mark stumble. Read the Lord telling the Saints why He doesn't explain everything. Then read Ether 12:6 again, because it's the whole principle in one line.", "read": ["Jacob 4:8-10", "D&C 101:32-34", "Alma 40:
